[package]
name = "nulang-rusqlite-recovery-reader"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated from the root workspace to avoid linking two SQLite runtimes.
[workspace]

[dependencies]
nulang = { path = "../../..", default-features = false }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = "1"
serde_json = "1"
