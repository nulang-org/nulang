# Opt-in protocol fixture checks; they use no service credentials and do not
# authorize the production migration. Untrusted fork PRs require approval by
# Woodpecker before executing Rust build scripts on our self-hosted agent.
labels:
  platform: linux/amd64
  pool: bootstrap-ci

when:
  - event: pull_request
    path:
      include:
        - "src/runtime/turso_remote_probe.rs"
        - "src/runtime/mod.rs"
        - "tests/turso_remote_*.rs"
        - "scripts/ci/turso-remote-wire.sh"
        - ".woodpecker/turso-remote-wire.yml"
        - "Cargo.toml"
        - "Cargo.lock"
  - event: push
    branch: main
    path:
      include:
        - "src/runtime/turso_remote_probe.rs"
        - "tests/turso_remote_*.rs"
        - "scripts/ci/turso-remote-wire.sh"
        - ".woodpecker/turso-remote-wire.yml"
  - event: manual

concurrency:
  limit: 1
  group: turso-remote-wire-${CI_COMMIT_PULL_REQUEST}

steps:
  - name: test-turso-wire
    image: rust:1.95-bookworm
    environment:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: /tmp/nulang-turso-wire-target
    commands:
      - set -eu
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-dev pkg-config clang libclang-dev
      - rustup component add rustfmt clippy
      - timeout --signal=TERM --kill-after=30s 2400s bash scripts/ci/turso-remote-wire.sh
