# Test-only isolated native SQLite compatibility gate. No secrets or
# production databases. Untrusted forks require server-side PR approval.
labels:
  platform: linux/amd64
  pool: bootstrap-ci

when:
  - event: pull_request
    path:
      include:
        - "tools/rusqlite-local-compat/**"
        - ".woodpecker/rusqlite-local-parity.yml"
  - event: push
    branch: main
    path:
      include:
        - "tools/rusqlite-local-compat/**"
        - ".woodpecker/rusqlite-local-parity.yml"
  - event: manual

concurrency:
  limit: 1
  group: rusqlite-local-parity-${CI_COMMIT_PULL_REQUEST}

steps:
  - name: two-process-sqlite-parity
    image: rust:1.95-bookworm
    environment:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TARGET_DIR: /tmp/nulang-rusqlite-parity-target
    commands:
      - set -eu
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config clang libclang-dev python3-dev util-linux gcc libc6-dev
      - rustup component add rustfmt clippy
      - timeout --signal=TERM --kill-after=30s 2400s bash tools/rusqlite-local-compat/verify.sh
