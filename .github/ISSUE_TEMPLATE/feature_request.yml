name: Feature Request
description: Propose a scoped Nulang improvement or user experience fix
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please start with the user problem, not a new keyword.
        Frozen/Stable semantic changes require an accepted RFC under GOVERNANCE.md
        before implementation. Large proposals should start as a discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem and motivating use case
      description: What fails today? Provide a short runnable example or workflow if possible.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed result and acceptance criteria
      description: Observable behavior and the test or example that would prove it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and non-core options
      description: Could this be a library, capability package, plugin, WASM component or cloud feature instead of core syntax?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Likely surface
      description: Choose the best fit; final classification is decided in review.
      options:
        - Documentation / examples / tooling
        - Experimental runtime / library / backend
        - Stable or Frozen language semantics (RFC required)
        - Unsure
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related issue, RFC or roadmap tracker
      placeholder: e.g. #231 or RFC/0000-template.md
