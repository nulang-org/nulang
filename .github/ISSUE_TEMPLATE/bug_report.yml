name: Bug Report
description: Report a reproducible compiler, runtime, tooling, or docs bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and reduce the failure to the smallest example.
        **Security issue?** Do not post details here; use SECURITY.md and private reporting.
  - type: input
    id: version
    attributes:
      label: Nulang version or exact commit
      description: Output of `nulang --version` and/or the built source commit SHA.
      placeholder: e.g. release version or git SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, toolchain and feature flags
      description: Include OS/architecture, Rust version (if source-built), and relevant `--features` or CLI flags.
      placeholder: e.g. Ubuntu 24.04 x86_64, Rust 1.95.0, default features
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior
      description: What happened? Include the exact diagnostic or failure mode.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead? Reference a documented contract if applicable.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction and steps
      description: A minimal .nula file or commands, with steps to reproduce. Remove secrets.
      placeholder: |
        1. Build with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs (redacted)
      description: Paste compiler errors or logs without credentials or personal data.
      render: text
