name: Transport stage benchmark

on:
  pull_request:
    paths:
      - 'benches/dist_bench.rs'
      - 'benches/bench_main.rs'
      - 'src/runtime/network.rs'
      - 'tests/transport_stage_bench_contract.rs'
      - '.github/workflows/transport-stage-bench-pr.yml'

concurrency:
  group: transport-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  transport-roundtrip:
    name: TCP/NUL0 transport RTT
    if: github.head_ref == 'perf/transport-stage-rtt-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify measurement boundary contract
        run: cargo test --locked --test transport_stage_bench_contract

      - name: Measure transport-only request/return RTT
        run: cargo bench --locked --bench bench_main -- 'dist/transport_roundtrip' --noplot
