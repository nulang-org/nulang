name: Apply Transactional Selective Receive v3

on:
  push:
    branches:
      - fix/selective-receive-orca-transaction-v3

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/selective-receive-orca-transaction-v3
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply fail-closed transaction transform
        run: python3 .github/sev1/apply-selective-receive-transaction.py

      - name: Format
        run: cargo fmt --all

      - name: Transaction regressions
        run: cargo test --lib transactional_receive_tests -- --nocapture

      - name: Existing mailbox regressions
        run: cargo test --lib runtime::mailbox::tests -- --nocapture

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Clippy correctness gate
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: Reject whitespace damage
        run: git diff --check

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-selective-receive-transaction-v3.yml
          rm .github/sev1/apply-selective-receive-transaction.py

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): make selective receive ownership transactional"
          git push origin HEAD:fix/selective-receive-orca-transaction-v3
