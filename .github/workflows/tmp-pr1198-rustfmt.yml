name: Temporary PR1198 rustfmt

on:
  push:
    branches:
      - tmp/pr1198-rustfmt-20261004

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/pr1198-rustfmt-20261004
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt

      - name: Format timer replay restack
        run: cargo fmt

      - name: Commit formatted tree and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr1198-rustfmt.yml
          git add -A
          git commit -m "style(workflow): rustfmt timer replay restack"
          git push origin HEAD:tmp/pr1198-rustfmt-20261004
