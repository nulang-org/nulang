name: Apply P0 Closure Hardening

on:
  push:
    branches: [fix/compiled-runtime-fuzz-p0]
    paths:
      - .github/workflows/apply-p0-closure-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v7
        with:
          ref: fix/compiled-runtime-fuzz-p0
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply exact closure hardening transform
        run: python3 .github/sev1/apply-p0-closure-hardening.py

      - name: Format transformed source
        run: cargo fmt --all

      - name: Verify focused differential regressions
        run: cargo test --lib differential_unary_negation_and_error_isolation_regressions -- --nocapture

      - name: Verify AOT closure allocation regressions
        run: cargo test --lib aot_closure_helpers_reserve_full_payload -- --nocapture

      - name: Verify all targets compile
        run: cargo check --all-targets

      - name: Reject whitespace damage
        run: git diff --check

      - name: Remove one-shot recovery machinery
        run: |
          git rm .github/sev1/apply-p0-closure-hardening.py
          git rm .github/workflows/apply-p0-closure-hardening.yml

      - name: Commit verified source hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes produced; refusing an empty recovery commit."
            exit 1
          fi
          git commit -m "fix(aot): harden closure tagging and dynamic dispatch"
          git push origin HEAD:fix/compiled-runtime-fuzz-p0
