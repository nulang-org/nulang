name: Validate restacked sqlite feature

on:
  push:
    branches:
      - automation/validate-sqlite-feature-20261002

jobs:
  sqlite-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 65c47f46f3898905e91b51e16c212093f52a9acc
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove exact candidate
        run: |
          test "$(git rev-parse HEAD)" = 65c47f46f3898905e91b51e16c212093f52a9acc
          cargo check --locked --no-default-features --features sqlite --all-targets
          cargo test --locked --no-default-features --features sqlite --lib libsql_atomic_transition -- --nocapture
          cargo test --locked --no-default-features --features sqlite --lib test_libsql_store -- --nocapture
