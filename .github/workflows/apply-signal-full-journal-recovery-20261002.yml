name: Apply full-journal signal recovery

on:
  push:
    branches:
      - automation/apply-signal-full-journal-recovery-20261002

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workflow-signal-full-journal-recovery-20261002
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: automation/apply-signal-full-journal-recovery-20261002
          path: .ci-helper
      - uses: dtolnay/rust-toolchain@stable
      - name: Compose, test, and publish
        run: bash .ci-helper/scripts/ci/apply-signal-full-journal-recovery-20261002.sh
