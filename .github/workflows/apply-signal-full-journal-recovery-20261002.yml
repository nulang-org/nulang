name: Apply full-journal signal recovery

on:
  push:
    branches:
      - automation/apply-signal-full-journal-recovery-20261002

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workflow-signal-full-journal-recovery-20261002
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add covered-snapshot RED contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime/tests.rs')
          text = p.read_text()
          marker = '#[test]\nfn test_recovery_replays_unfinished_atomic_native_workflow_activation() {'
          assert text.count(marker) == 1, text.count(marker)
          name = 'fn test_signal_journal_survives_process_restart_when_snapshot_covers_signal()'
          assert name not in text
          test = r'''#[cfg(feature = "sqlite")]
          #[test]
          fn test_signal_journal_survives_process_restart_when_snapshot_covers_signal() {
              let nonce = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .unwrap()
                  .as_nanos();
              let dir = std::env::temp_dir().join(format!(
                  "nulang-workflow-signal-covered-restart-{}-{nonce}",
                  std::process::id()
              ));
              let db_path = dir.join("workflow.db");
              let _ = std::fs::remove_dir_all(&dir);
              std::fs::create_dir_all(&dir).unwrap();

              let mut rt = Runtime::new();
              rt.persistence = Box::new(LibsqlStore::new(&db_path).unwrap());
              let actor_id =
                  rt.spawn_workflow_actor("SignalCoveredRestart", Box::new(Vec::new), HashMap::new());

              rt.signal_workflow(actor_id, "wake", Some("payload".to_string()))
                  .unwrap();
              let signal_sequence = rt
                  .persistence
                  .read_signal_events(actor_id)
                  .into_iter()
                  .map(|event| event.sequence())
                  .max()
                  .unwrap();
              let snapshot = rt.persistence.load_snapshot(actor_id).unwrap();
              assert!(
                  snapshot.sequence >= signal_sequence,
                  "fixture requires the completed snapshot to cover the durable signal"
              );

              drop(rt);

              let mut recovered = Runtime::new();
              recovered.persistence = Box::new(LibsqlStore::new(&db_path).unwrap());
              assert_eq!(recovered.recover_actor(actor_id), Some(actor_id));
              assert_eq!(
                  recovered
                      .actors
                      .get(&actor_id)
                      .unwrap()
                      .received_signals
                      .iter()
                      .filter(|(name, payload)| {
                          name == "wake" && payload.as_deref() == Some("payload")
                      })
                      .count(),
                  1,
                  "restart must rebuild signal availability from the full durable signal journal even when the snapshot sequence already covers it"
              );

              drop(recovered);
              let _ = std::fs::remove_dir_all(&dir);
          }

          '''
          p.write_text(text.replace(marker, test + marker))
          PY
          git diff --check
          git config user.name 'nlc-ci'
          git config user.email 'nlc-ci@users.noreply.github.com'
          git add src/runtime/tests.rs
          git commit -m 'test(workflow): pin covered-signal restart recovery'
      - name: Apply full-journal reconstruction only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime/mod.rs')
          text = p.read_text()
          old = '''            for event in &all_timer_events {
                if let WorkflowEvent::TimerSet {
                    name, duration_ms, ..
                } = event
                {
                    if !fired_timer_names.contains(name) {
                        self.rearm_timer(actor_id, name, *duration_ms);
                    }
                }
            }
            // If the workflow was in the middle of a step waiting on a signal,
'''
          new = '''            for event in &all_timer_events {
                if let WorkflowEvent::TimerSet {
                    name, duration_ms, ..
                } = event
                {
                    if !fired_timer_names.contains(name) {
                        self.rearm_timer(actor_id, name, *duration_ms);
                    }
                }
            }

            // Signal availability is not part of ActorSnapshot. Rebuild it from
            // the full signal journal even when a later completed snapshot has a
            // sequence at or beyond a SignalReceived record.
            let signal_events = self.persistence.read_signal_events(actor_id);
            if let Some(actor) = self.actors.get_mut(&actor_id) {
                actor.received_signals.clear();
                for event in &signal_events {
                    if let WorkflowEvent::SignalReceived { name, payload, .. } = event {
                        actor.received_signals.push((name.clone(), payload.clone()));
                    }
                }
            }

            // If the workflow was in the middle of a step waiting on a signal,
'''
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Prove both signal restart boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib test_signal_received_survives_process_restart_from_libsql_journal -- --nocapture
          cargo test --locked --lib test_signal_journal_survives_process_restart_when_snapshot_covers_signal -- --nocapture
          cargo test --locked --lib signal_received_ -- --nocapture
      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git add src/runtime/mod.rs
          git diff --cached --check
          git commit -m 'fix(workflow): rebuild durable signals from full journal'
          git push origin HEAD:fix/workflow-signal-full-journal-recovery-20261002
