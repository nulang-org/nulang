name: Focused actor-aware journal payloads

on:
  pull_request:

jobs:
  journal-payloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features --lib journal_preserves
      - run: cargo test --locked --no-default-features --lib journal_does_not_decode_raw_heap_pointer_as_string
