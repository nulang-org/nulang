name: Raw Value WASM Fix

on:
  push:
    branches:
      - integration/raw-value-provenance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/raw-value-provenance
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Own validated WASM decoder error
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/wasm_runtime.rs')
          s = p.read_text()
          old = '.map_err(|msg| NuError::runtime_error(msg, Span::default()))'
          new = '.map_err(|msg| NuError::runtime_error(msg.to_string(), Span::default()))'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one WASM decoder error boundary, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Validate exact raw-value branch
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 check --all-targets --no-default-features
          cargo +1.95.0 check --all-targets
          cargo +1.95.0 check --all-targets --all-features
          cargo +1.95.0 test --test raw_value_provenance
          git diff --check

      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/raw-value-wasm-fix.yml
          git fetch origin integration/raw-value-provenance
          if [ "$(git rev-parse origin/integration/raw-value-provenance)" != "$GITHUB_SHA" ]; then
            echo 'branch advanced during validation; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(wasm): own validated decoder errors'
          git push origin HEAD:integration/raw-value-provenance
