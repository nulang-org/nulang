name: Refresh Web Contract request binding docs

on:
  push:
    branches:
      - docs/web-request-source-syntax

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/web-request-source-syntax
          fetch-depth: 0

      - name: Align OpenAPI request binding documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("docs/WEB_CONTRACT_IR.md")
          text = path.read_text()
          old = "- body/form bindings remain Nulang extensions until the request algebra defines media-type/schema semantics strongly enough to emit OpenAPI `requestBody` without guessing."
          new = "- form bindings become an `application/x-www-form-urlencoded` OpenAPI `requestBody`, because the HTTP transport now defines that media type explicitly.\n- raw whole-body bindings remain Nulang extensions until the request algebra defines their media type/schema semantics without guessing."
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale OpenAPI body/form bullet, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate documentation invariants
        run: |
          grep -F 'application/x-www-form-urlencoded' docs/WEB_CONTRACT_IR.md
          grep -F 'raw whole-body bindings remain Nulang extensions' docs/WEB_CONTRACT_IR.md
          ! grep -F 'body/form bindings remain Nulang extensions' docs/WEB_CONTRACT_IR.md

      - name: Commit documentation refresh
        shell: bash
        run: |
          rm .github/workflows/zz-ai-web-contract-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_CONTRACT_IR.md .github/workflows/zz-ai-web-contract-docs.yml
          git commit -m "docs(web): align request binding contract with runtime"
          git push origin HEAD:docs/web-request-source-syntax
