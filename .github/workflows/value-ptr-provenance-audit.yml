name: Value pointer provenance audit

on:
  push:
    branches:
      - audit/value-ptr-provenance

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-value-ptr-provenance-v2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Run compiler-driven pointer provenance migration
        shell: bash
        run: |
          set -euo pipefail
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 scripts/migrate_value_ptr_provenance.py

      - name: Commit validated hardening to target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/p0-value-ptr-provenance-v2
          if [ "$(git rev-parse origin/fix/p0-value-ptr-provenance-v2)" != "$TARGET_SHA" ]; then
            echo 'target branch advanced during validation; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): require provenance for pointer Values'
          git push origin HEAD:fix/p0-value-ptr-provenance-v2
