name: Finalize shard counterbalance branch

on:
  push:
    branches:
      - perf/shard-scaling-counterbalanced-order-current-main
    paths:
      - .github/workflows/tmp-shard-counterbalance-tdd.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/shard-scaling-counterbalanced-order-current-main
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Revalidate emitted order
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --no-default-features --features savina-bench --bin nulang-shard-bench
          cargo test --locked --release --no-default-features --features savina-bench \
            --bin nulang-shard-bench counterbalances_measurement_order_across_forward_reverse_pairs
          cargo run --locked --release --no-default-features --features savina-bench \
            --bin nulang-shard-bench -- \
            --shards 1,2 --messages 2048 --repeat 4 --format jsonl \
            > /tmp/shard-order.jsonl
          python3 - <<'PY'
          import json
          rows = [json.loads(line) for line in open('/tmp/shard-order.jsonl') if line.strip().startswith('{')]
          observed = [row['shards'] for row in rows]
          expected = [1, 2, 2, 1, 2, 1, 1, 2]
          assert observed == expected, (observed, expected)
          assert all(row['messages'] == 2048 for row in rows)
          PY
      - name: Add changelog and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          heading = '### Counterbalanced runtime-shard measurement order — 2026-10-02\n'
          if heading not in text:
              entry = (
                  heading
                  + '- **Repeated shard-scaling runs now rotate forward and reverse shard-count orders instead of always measuring 1/2/4/8 in the same sequence.** Across an eight-repeat four-shard run, every shard count receives equal exposure to each ordinal measurement position.\n'
                  + '- **The benchmark keeps fixed total work and reports each iteration in actual execution order.** This reduces systematic warmup/thermal/order bias without changing runtime scheduling or shard semantics.\n\n'
              )
              assert text.startswith('# Nulang Changelog\n')
              text = '# Nulang Changelog\n' + entry + text[len('# Nulang Changelog\n'):]
              path.write_text(text)
          PY
          rm .github/workflows/tmp-shard-counterbalance-tdd.yml
          git diff --check
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md src/bin/nulang_shard_bench.rs .github/workflows/tmp-shard-counterbalance-tdd.yml
          git commit -m "perf(bench): finalize counterbalanced shard measurements"
          git push origin HEAD:perf/shard-scaling-counterbalanced-order-current-main
