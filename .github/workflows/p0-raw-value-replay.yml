name: P0 Runtime Stabilization Integration

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14

permissions:
  contents: write

concurrency:
  group: p0-runtime-stabilization-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Fetch reviewed P0 branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            integration/raw-value-provenance \
            fix/p0-value-ptr-provenance-v2 \
            feat/authority-host-boundaries-clean

      - name: Replay raw Value provenance (#200)
        shell: bash
        run: |
          set -euo pipefail
          git diff 79ce4c9fdac9fba2c49f828054697f7989148c97 9adb6f81bed13e446c925c5f357a03070d225117 -- \
            src/aot/codegen.rs \
            src/aot/mod.rs \
            src/ffi/c_api.rs \
            src/ffi/marshal.rs \
            src/fuzz.rs \
            src/integration_tests/mod.rs \
            src/jit/runtime.rs \
            src/jit/tests.rs \
            src/jit/typed_compiler.rs \
            src/main.rs \
            src/python/marshal.rs \
            src/runtime/heap_serialize.rs \
            src/vm.rs \
            src/wasm_runtime.rs \
            src/wasmfx_runtime.rs \
            tests/raw_value_provenance.rs \
            > /tmp/01-raw-value.patch
          test -s /tmp/01-raw-value.patch
          git apply --3way --index /tmp/01-raw-value.patch 2>&1 | tee /tmp/01-raw-value-apply.log

      - name: Replay pointer provenance (#197)
        shell: bash
        run: |
          set -euo pipefail
          git diff 9adb6f81bed13e446c925c5f357a03070d225117 c7e3ce37c171298c06012b7185c26ab7b932788c -- \
            docs/UNSAFE_AUDIT.md \
            src/ffi/marshal.rs \
            src/jit/runtime.rs \
            src/runtime/actor.rs \
            src/runtime/callbacks.rs \
            src/runtime/heap_serialize.rs \
            src/runtime/network.rs \
            src/runtime/tests.rs \
            src/stress_tests.rs \
            src/vm.rs \
            src/wasm_runtime.rs \
            > /tmp/02-pointer-provenance.patch
          test -s /tmp/02-pointer-provenance.patch
          git apply --3way --index /tmp/02-pointer-provenance.patch 2>&1 | tee /tmp/02-pointer-provenance-apply.log

      - name: Replay host-boundary authority (#178)
        shell: bash
        run: |
          set -euo pipefail
          git diff 5622d5271e30143cb8bee9f81f53f77119603175 8ff33558243499822ec46a43c3e4e2d6f870bc5b -- \
            src/aot/mod.rs \
            src/jit/runtime.rs \
            src/vm.rs \
            > /tmp/03-host-authority-production-other.patch
          test -s /tmp/03-host-authority-production-other.patch
          git apply --3way --index /tmp/03-host-authority-production-other.patch 2>&1 | tee /tmp/03-host-authority-production-other-apply.log

          git diff 5622d5271e30143cb8bee9f81f53f77119603175 8ff33558243499822ec46a43c3e4e2d6f870bc5b -- \
            src/runtime/callbacks.rs \
            > /tmp/03-host-authority-callbacks.patch
          test -s /tmp/03-host-authority-callbacks.patch

          python3 - <<'PY'
          from pathlib import Path

          src = Path('/tmp/03-host-authority-callbacks.patch').read_text().splitlines(keepends=True)
          prefix = []
          hunks = []
          current = None
          for line in src:
              if line.startswith('@@ '):
                  if current is not None:
                      hunks.append(current)
                  current = [line]
              elif current is None:
                  prefix.append(line)
              else:
                  current.append(line)
          if current is not None:
              hunks.append(current)
          if not hunks:
              raise SystemExit('no callbacks hunks found in #178 patch')
          removed = [h for h in hunks if 'mod host_authority_tests {' in ''.join(h)]
          kept = [h for h in hunks if 'mod host_authority_tests {' not in ''.join(h)]
          if len(removed) != 1:
              raise SystemExit(f'expected exactly one host-authority test hunk, found {len(removed)}')
          out = ''.join(prefix) + ''.join(''.join(h) for h in kept)
          Path('/tmp/03-host-authority-callbacks-production.patch').write_text(out)
          PY
          test -s /tmp/03-host-authority-callbacks-production.patch
          git apply --3way --index /tmp/03-host-authority-callbacks-production.patch 2>&1 | tee /tmp/03-host-authority-callbacks-apply.log

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ["git", "show", "8ff33558243499822ec46a43c3e4e2d6f870bc5b:src/runtime/callbacks.rs"],
              text=True,
          )
          marker = "#[cfg(test)]\nmod host_authority_tests {"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("host_authority_tests marker missing from #178 head")
          block = source[start:].rstrip() + "\n"
          path = Path("src/runtime/callbacks.rs")
          current = path.read_text()
          if "mod host_authority_tests {" in current:
              raise SystemExit("host_authority_tests already present before replay")
          path.write_text(current.rstrip() + "\n\n" + block)
          PY
          git add src/runtime/callbacks.rs

      - name: Restore minimal-build authority test boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/spawn_authority_provenance.rs')
          text = path.read_text()
          replacements = [
              (
                  'use nulang::aot::AotModule;\n',
                  '#[cfg(feature = "native-codegen")]\nuse nulang::aot::AotModule;\n',
              ),
              (
                  'fn sorted_actor_manifests(rt: &Runtime) -> Vec<Vec<String>> {',
                  '#[cfg(feature = "native-codegen")]\nfn sorted_actor_manifests(rt: &Runtime) -> Vec<Vec<String>> {',
              ),
              (
                  '#[test]\nfn vm_and_native_agree_on_exact_site_spawn_authority() {',
                  '#[cfg(feature = "native-codegen")]\n#[test]\nfn vm_and_native_agree_on_exact_site_spawn_authority() {',
              ),
              (
                  '#[test]\nfn vm_and_native_both_reject_parent_authority_escalation_before_creation() {',
                  '#[cfg(feature = "native-codegen")]\n#[test]\nfn vm_and_native_both_reject_parent_authority_escalation_before_creation() {',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git add tests/spawn_authority_provenance.rs

      - name: Normalize and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          git diff --name-only | tee /tmp/10-fmt-paths.log
          cargo +1.95.0 fmt --all -- --check 2>&1 | tee /tmp/10-fmt.log
          git diff --check
          git add -A

      - name: Check no-default-features
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 check --all-targets --no-default-features 2>&1 | tee /tmp/11-no-default.log

      - name: Check default features
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 check --all-targets 2>&1 | tee /tmp/12-default.log

      - name: Check all features
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 check --all-targets --all-features 2>&1 | tee /tmp/13-all-features.log

      - name: Validate provenance regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --test raw_value_provenance 2>&1 | tee /tmp/14-raw-value-test.log
          cargo +1.95.0 test --doc 2>&1 | tee /tmp/15-doctest.log
          if grep -nE 'pub[[:space:]]+(const[[:space:]]+)?fn[[:space:]]+ptr[[:space:]]*\(' src/vm.rs; then
            echo 'safe public Value::ptr constructor detected' >&2
            exit 1
          fi

      - name: Validate actor authority regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --lib host_authority -- --nocapture 2>&1 | tee /tmp/16-host-authority-test.log
          cargo +1.95.0 test --lib authority -- --nocapture 2>&1 | tee /tmp/17-authority-test.log
          cargo +1.95.0 test --test spawn_authority_provenance -- --nocapture 2>&1 | tee /tmp/18-spawn-authority-test.log

      - name: Validate receive ownership regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 test --lib selective_receive -- --nocapture 2>&1 | tee /tmp/19-selective-receive-test.log
          cargo +1.95.0 test --lib orca -- --nocapture 2>&1 | tee /tmp/20-orca-test.log

      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check 2>&1 | tee /tmp/21-diff.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-runtime-stabilization-diagnostics
          path: |
            /tmp/*.patch
            /tmp/*-apply.log
            /tmp/10-fmt-paths.log
            /tmp/10-fmt.log
            /tmp/11-no-default.log
            /tmp/12-default.log
            /tmp/13-all-features.log
            /tmp/14-raw-value-test.log
            /tmp/15-doctest.log
            /tmp/16-host-authority-test.log
            /tmp/17-authority-test.log
            /tmp/18-spawn-authority-test.log
            /tmp/19-selective-receive-test.log
            /tmp/20-orca-test.log
            /tmp/21-diff.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit validated P0 integration and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p0-raw-value-replay.yml
          git add -A
          git diff --cached --check
          git fetch origin integration/p0-stabilization-2026-09-14
          if [ "$(git rev-parse origin/integration/p0-stabilization-2026-09-14)" != "$GITHUB_SHA" ]; then
            echo 'stabilization branch advanced during validation; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): integrate P0 provenance and host authority stabilization'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
