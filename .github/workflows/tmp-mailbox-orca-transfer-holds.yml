name: Temporary mailbox ORCA transfer hold verification

on:
  push:
    branches:
      - fix/mailbox-orca-transfer-holds

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mailbox-orca-transfer-holds
          fetch-depth: 0

      - name: Apply mailbox-resident ORCA transfer holds
        run: python3 .tmp_mailbox_orca_patch.py

      - name: Format and validate patch
        shell: bash
        run: |
          cargo fmt --all
          unexpected="$(git diff --name-only | grep -Ev '^(src/runtime/mod.rs|src/runtime/exit.rs|src/runtime/tests.rs|src/aot/mod.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "cargo fmt changed unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Verify mailbox ORCA transfer regressions
        run: cargo test test_orca_mailbox_transfer_hold --lib

      - name: Verify selective receive transaction regressions
        run: cargo test transactional_receive_tests --lib

      - name: Verify AOT fail-closed regression
        run: cargo test test_aot_native_selective_receive_fails_closed --lib

      - name: Verify all targets compile
        run: cargo check --all-targets

      - name: Verify correctness clippy
        run: cargo clippy --all-targets -- -D clippy::correctness

      - name: Commit verified patch and remove temporary harness
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/mod.rs src/runtime/exit.rs src/runtime/tests.rs src/aot/mod.rs
          git rm .github/workflows/tmp-mailbox-orca-transfer-holds.yml .tmp_mailbox_orca_patch.py
          git commit -m "fix(runtime): retain ORCA refs while messages are queued"
          git push origin HEAD:fix/mailbox-orca-transfer-holds