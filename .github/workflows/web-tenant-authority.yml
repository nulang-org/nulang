name: Web Tenant Authority (disposable PostgreSQL)

on:
  pull_request:
    paths:
      - '.github/workflows/web-tenant-authority.yml'
      - 'tests/tenant_pg_request_authority.rs'
      - 'tests/tenant_pg_durable_revocation.rs'
      - 'tests/tenant_http_socket_authority.rs'
      - 'tests/tenant_jwt_verifier.rs'
      - 'tests/run_tenant_pg_authority_ci.sh'
      - 'src/web/tenant_pg_reference.rs'
      - 'src/web/tenant_jwt_reference.rs'
      - 'src/web/tenant_pg_revocation_reference.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/web/mod.rs'
      - 'src/runtime/http_server.rs'
      - 'docs/WEB_TENANT_PG_AUTHORITY_REFERENCE.md'
      - 'src/runtime/mod.rs'
      - 'examples/tenant-resources/sql/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-postgres-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Install disposable PostgreSQL utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-common openssl
          command -v pg_virtualenv
          command -v cargo
      - name: Verify pinned Ed25519 JWT access-token contract
        run: cargo test --locked --no-default-features --features postgres --test tenant_jwt_verifier
      - name: Verify signed request authority to disposable tenant SQL
        run: bash tests/run_tenant_pg_authority_ci.sh
