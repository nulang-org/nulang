name: P0 Durable Spawn Transaction v2

on:
  push:
    branches:
      - fix/p0-durable-spawn-transaction
    paths:
      - .github/workflows/p0-durable-spawn-transaction.yml
      - .github/scripts/p0_durable_spawn_transaction.py

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-durable-spawn-transaction
          fetch-depth: 0

      - name: Pin product blobs
        shell: bash
        run: |
          set -euo pipefail
          for path in src/runtime/spawn.rs src/runtime/workflow.rs src/runtime/callbacks.rs src/runtime/crdt_manager.rs; do
            key=$(echo "$path" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')
            echo "BASE_${key}=$(git rev-parse HEAD:$path)" >> "$GITHUB_ENV"
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: p0-durable-spawn-transaction-v2

      - name: Apply fail-closed durable spawn transaction
        run: |
          python3 .github/scripts/p0_durable_spawn_transaction.py
          cargo fmt --all
          git diff --check

      - name: Focused durability and authority regressions
        run: |
          cargo test --lib runtime::spawn::authority_tests:: -- --nocapture
          cargo test --lib runtime::crdt_manager:: -- --nocapture
          cargo test --test spawn_authority_provenance -- --nocapture

      - name: Compile and warning gates
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features
          RUSTFLAGS='-D warnings' cargo check --lib
          cargo fmt --all -- --check
          git diff --check

      - name: Enforce product diff scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -qx 'src/runtime/callbacks.rs'
          printf '%s\n' "${changed[@]}" | grep -qx 'src/runtime/crdt_manager.rs'
          printf '%s\n' "${changed[@]}" | grep -qx 'src/runtime/spawn.rs'
          printf '%s\n' "${changed[@]}" | grep -qx 'src/runtime/workflow.rs'

      - name: Land validated transaction
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/runtime/spawn.rs src/runtime/workflow.rs src/runtime/callbacks.rs src/runtime/crdt_manager.rs > /tmp/product.patch
          git fetch origin fix/p0-durable-spawn-transaction
          remote_head=$(git rev-parse origin/fix/p0-durable-spawn-transaction)
          for path in src/runtime/spawn.rs src/runtime/workflow.rs src/runtime/callbacks.rs src/runtime/crdt_manager.rs; do
            key=$(echo "$path" | tr '/.' '__' | tr '[:lower:]' '[:upper:]')
            expected_var="BASE_${key}"
            expected=${!expected_var}
            actual=$(git rev-parse "origin/fix/p0-durable-spawn-transaction:$path")
            if [ "$actual" != "$expected" ]; then
              echo "$path advanced during validation: $actual (expected $expected)" >&2
              exit 1
            fi
          done
          git reset --hard "$remote_head"
          git apply /tmp/product.patch
          rm .github/workflows/p0-durable-spawn-transaction.yml
          rm .github/scripts/p0_durable_spawn_transaction.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/spawn.rs src/runtime/workflow.rs src/runtime/callbacks.rs src/runtime/crdt_manager.rs .github/workflows/p0-durable-spawn-transaction.yml .github/scripts/p0_durable_spawn_transaction.py
          git diff --cached --check
          git commit -m 'fix(durability): fail closed on initial workflow persistence'
          git push origin HEAD:fix/p0-durable-spawn-transaction
