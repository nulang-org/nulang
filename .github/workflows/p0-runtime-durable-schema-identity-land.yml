name: P0 Runtime Durable Schema Identity Land

on:
  push:
    branches:
      - fix/p0-runtime-durable-schema-identity

concurrency:
  group: p0-runtime-durable-schema-identity-land
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-runtime-durable-schema-identity
          fetch-depth: 0

      - name: Pin branch head
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply durable schema identity integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p0_durable_schema_identity_land.py
          git diff --check

      - name: Validate durable schema regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features runtime_schema_identity::tests --lib
          cargo test --no-default-features --test runtime_snapshot_schema_identity
          cargo test --no-default-features --test runtime_actor_behavior_ownership
          cargo test --no-default-features --test runtime_grain_behavior_ownership

      - name: Full no-default regression suite
        shell: bash
        run: cargo test --no-default-features

      - name: Format and diff gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
          git diff --name-only

      - name: Guard exact head and land validated durable identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/p0-runtime-durable-schema-identity
          remote_head="$(git rev-parse origin/fix/p0-runtime-durable-schema-identity)"
          if [ "$remote_head" != "$START_HEAD" ]; then
            echo "branch advanced during validation: $remote_head (expected $START_HEAD)" >&2
            exit 1
          fi
          git rm .github/workflows/p0-runtime-durable-schema-identity-land.yml
          git rm scripts/p0_durable_schema_identity_land.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime): preserve durable actor schema identity'
          git push origin HEAD:fix/p0-runtime-durable-schema-identity
