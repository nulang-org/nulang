name: UI Protocol Validation Fix

on:
  push:
    branches:
      - feat/nulang-ui-protocol-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nulang-ui-protocol-v1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply iterative validation fix
        run: python3 patches/ui_protocol_iterative_validation.py

      - name: Format
        run: cargo fmt --all

      - name: Validate protocol crate
        run: cargo test -p nulang-ui-protocol

      - name: Publish source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/nulang-ui-protocol/src/lib.rs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): validate deep documents iteratively"
          git push origin HEAD:feat/nulang-ui-protocol-v1
