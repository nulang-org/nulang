name: Experimental Numeric Buffers

on:
  pull_request:
    paths:
      - "crates/nulang-numeric/**"
      - ".github/workflows/numeric-buffers.yml"
  push:
    branches: [main]
    paths:
      - "crates/nulang-numeric/**"
      - ".github/workflows/numeric-buffers.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/nulang-numeric/Cargo.toml --check
      - name: Unit tests
        run: cargo test --manifest-path crates/nulang-numeric/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/nulang-numeric/Cargo.toml --all-targets -- -D warnings
      - name: Release example compile
        run: cargo check --release --manifest-path crates/nulang-numeric/Cargo.toml --example compare_views
      # Diagnostic timing only: shared-runner values are not performance
      # certification and must never gate or claim a speedup.
      - name: Generate paired Rust-side timing artifact
        run: |
          cargo run --release --manifest-path crates/nulang-numeric/Cargo.toml \
            --example compare_views > numeric-views.csv
          head -n 5 numeric-views.csv
      - name: Test timing analysis contracts
        run: |
          cd crates/nulang-numeric/tools
          python3 -m unittest discover -s tests -v
      - name: Analyze paired timing artifact
        run: |
          python3 crates/nulang-numeric/tools/analyze.py numeric-views.csv > numeric-views-report.json
          cat numeric-views-report.json
      - name: Upload timing samples and summary
        uses: actions/upload-artifact@v4
        with:
          name: numeric-views
          path: |
            numeric-views.csv
            numeric-views-report.json
          retention-days: 14
