name: Experimental Numeric Buffers

on:
  pull_request:
    paths:
      - "crates/nulang-numeric/**"
      - ".github/workflows/numeric-buffers.yml"
  push:
    branches: [main]
    paths:
      - "crates/nulang-numeric/**"
      - ".github/workflows/numeric-buffers.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path crates/nulang-numeric/Cargo.toml --check
      - name: Unit tests
        run: cargo test --manifest-path crates/nulang-numeric/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path crates/nulang-numeric/Cargo.toml --all-targets -- -D warnings
      - name: Release example compile
        run: cargo check --release --manifest-path crates/nulang-numeric/Cargo.toml --example compare_views
