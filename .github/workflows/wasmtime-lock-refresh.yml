name: Refresh Wasmtime lockfile

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/wasmtime-lock-refresh.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'fix/wasmtime-rustsec-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Refresh Wasmtime dependency family
        run: cargo update -p wasmtime --precise 48.0.3
      - name: Verify resolved Wasmtime version
        run: cargo tree --features wasm-backend -i wasmtime | grep -F 'wasmtime v48.0.3'
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): refresh Wasmtime lockfile [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
