name: Temporary signal GREEN proof

on:
  push:
    branches:
      - tmp/format-signal-green-20261004

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/format-signal-green-20261004
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Run focused signal regression
        run: cargo test --no-default-features --test workflow_signal_safe_snapshot
      - name: Publish formatted tree
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply rustfmt to signal replay restack"
          git push origin HEAD:tmp/format-signal-green-20261004
