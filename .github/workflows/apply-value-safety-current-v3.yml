name: Apply Value Safety Migration v3

on:
  push:
    branches:
      - fix/value-safety-current-main-v3

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/value-safety-current-main-v3
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply fail-closed migration
        run: python3 scripts/apply_value_safety.py

      - name: Format
        run: cargo fmt --all

      - name: Compile all features
        run: cargo check --all-features --all-targets

      - name: Library regressions
        run: cargo test --lib --all-features

      - name: Clippy correctness gate
        run: cargo clippy --all-features --all-targets -- -D clippy::correctness

      - name: Reject whitespace damage
        run: git diff --check

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-value-safety-current-v3.yml
          rm scripts/apply_value_safety.py

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(vm): harden raw Value construction boundaries"
          git push origin HEAD:fix/value-safety-current-main-v3
