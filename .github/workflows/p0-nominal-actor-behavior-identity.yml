name: P0 Nominal Actor Behavior Identity

on:
  push:
    branches:
      - fix/nominal-actor-behavior-identity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nominal-actor-behavior-identity
          fetch-depth: 0

      - name: Pin head
        run: echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply product patch
        run: |
          python3 scripts/apply_p0_nominal_actor_behavior.py
          python3 scripts/apply_p0_behavior_key.py
          python3 scripts/apply_p0_behavior_site_key.py

      - name: Format and focused Rust tests
        run: |
          cargo fmt --all
          git diff --check
          cargo test --no-default-features typechecker::tests
          cargo test --no-default-features hir_lower
          cargo test --no-default-features mir_lower

      - name: Build minimal compiler
        run: cargo build --quiet --no-default-features

      - name: Duplicate-name ask dispatches by nominal owner
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug/nulang")')"
          test "$($BIN conformance/behavior/actor_18_nominal_behavior_owner.nula)" = "42ok"

      - name: Duplicate-name send dispatches by nominal owner
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug/nulang")')"
          test "$($BIN conformance/behavior/lifecycle_05_behavior_name_first_declaration_wins.nula)" = "1"

      - name: Unique dynamic receiver remains compatible
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug/nulang")')"
          test "$($BIN conformance/behavior/cap_02_default_spawn_iso.nula)" = "pong"

      - name: Ambiguous dynamic receiver fails closed
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug/nulang")')"
          set +e
          "$BIN" conformance/behavior/actor_20_ambiguous_dynamic_behavior_error.nula > /tmp/ambiguous-out 2> /tmp/ambiguous-err
          CODE=$?
          set -e
          test "$CODE" -eq 10
          test ! -s /tmp/ambiguous-out
          grep -F "cannot resolve behavior 'ping' unambiguously from dynamic receiver" /tmp/ambiguous-err

      - name: Foreign payload fails closed
        run: |
          BIN="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug/nulang")')"
          set +e
          "$BIN" conformance/behavior/actor_19_nominal_behavior_payload_error.nula > /tmp/out 2> /tmp/err
          CODE=$?
          set -e
          test "$CODE" -eq 4
          test ! -s /tmp/out
          grep -F "Type mismatch: expected Int, found String" /tmp/err

      - name: Land validated delta
        run: |
          git fetch origin fix/nominal-actor-behavior-identity
          test "$(git rev-parse origin/fix/nominal-actor-behavior-identity)" = "$START_HEAD"
          rm .github/workflows/p0-nominal-actor-behavior-identity.yml
          rm scripts/apply_p0_nominal_actor_behavior.py
          rm scripts/apply_p0_actor_provenance.py
          rm scripts/apply_p0_behavior_key.py
          rm scripts/apply_p0_behavior_site_key.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(actor): make behavior identity receiver-specific"
          git push origin HEAD:fix/nominal-actor-behavior-identity
