name: Apply P1 AOT closure allocation fix

on:
  push:
    branches:
      - fix/compiled-runtime-fuzz-p0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Bring branch up to date with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Fix closure payload allocation and add regression
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/jit/runtime.rs"); s=p.read_text(); old="let Some(ptr) = alloc_obj(2 + count * 8, HeapTypeTag::Closure) else {"; new="let Some(ptr) = alloc_obj((2 + count) * std::mem::size_of::<u64>(), HeapTypeTag::Closure) else {"; assert s.count(old) == 1, f"expected one allocation expression, found {s.count(old)}"; p.write_text(s.replace(old,new,1))'
          cat >> src/jit/runtime.rs <<'EOF'

          #[cfg(test)]
          mod aot_closure_allocation_tests {
              use super::*;

              #[test]
              fn aot_closure_helpers_reserve_full_payload() {
                  clear_jit_callbacks();
                  let _ = aot_take_heap();
                  aot_set_heap(crate::runtime::heap::ActorHeap::new(4096));

                  unsafe {
                      let first = nulang_aot_make_closure_0(11);
                      let second = nulang_aot_make_closure_0(22);
                      assert_eq!(first & TAG_MASK, TAG_CLOSURE);
                      assert_eq!(second & TAG_MASK, TAG_CLOSURE);

                      let first_ptr = (first & PAYLOAD_MASK) as *mut u64;
                      let second_ptr = (second & PAYLOAD_MASK) as *mut u64;
                      assert_eq!(*first_ptr, 11);
                      assert_eq!(*first_ptr.add(1), 0);
                      assert_eq!(*second_ptr, 22);
                      assert_eq!(*second_ptr.add(1), 0);

                      let captured = nulang_aot_make_closure_2(
                          33,
                          Value::int(7).as_raw(),
                          Value::int(9).as_raw(),
                      );
                      let guard = nulang_aot_make_closure_0(44);
                      let captured_ptr = (captured & PAYLOAD_MASK) as *mut u64;
                      assert_eq!(*captured_ptr, 33);
                      assert_eq!(*captured_ptr.add(1), 2);
                      assert_eq!(*captured_ptr.add(2), Value::int(7).as_raw());
                      assert_eq!(*captured_ptr.add(3), Value::int(9).as_raw());
                      assert_eq!(guard & TAG_MASK, TAG_CLOSURE);
                  }

                  let _ = aot_take_heap();
              }
          }
          EOF

          python3 -c 'from pathlib import Path; p=Path("CHANGELOG.md"); s=p.read_text(); old="  canonical `TAG_CLOSURE` representation instead of masquerading as tagged\n  function-index integers. This restores interpreter/JIT/AOT parity for\n"; new="  canonical `TAG_CLOSURE` representation instead of masquerading as tagged\n  function-index integers, with exact payload sizing for closure headers and\n  captures. This restores interpreter/JIT/AOT parity for\n"; assert s.count(old) == 1, f"expected changelog context once, found {s.count(old)}"; p.write_text(s.replace(old,new,1))'

      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Verify closure allocation safety
        run: cargo test --lib aot_closure_helpers_reserve_full_payload -- --nocapture

      - name: Re-run backend regression
        run: cargo test --lib differential_unary_negation_and_error_isolation_regressions -- --nocapture

      - name: Remove one-shot workflow and commit verified fix
        run: |
          git rm .github/workflows/apply-p1-closure-allocation.yml
          git add src/jit/runtime.rs CHANGELOG.md
          git commit -m "fix(aot): allocate full closure payload"
          git push origin HEAD:fix/compiled-runtime-fuzz-p0
