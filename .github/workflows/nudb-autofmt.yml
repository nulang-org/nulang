name: NulangDB Autoformat

on:
  pull_request:
    paths:
      - "src/database/wal_batch.rs"
      - "tests/nudb_wal_batch.rs"
      - "benches/database_bench.rs"
      - ".github/workflows/nudb-autofmt.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benches/database_bench.rs src/database/wal_batch.rs tests/nudb_wal_batch.rs
          git commit -m "style(database): apply rustfmt to batched WAL slice"
          git push origin HEAD:${{ github.head_ref }}
