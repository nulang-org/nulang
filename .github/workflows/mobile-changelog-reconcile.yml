name: Mobile Changelog Reconcile

on:
  push:
    branches:
      - feat/mobile-runtime-boundary-ci2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-runtime-boundary-ci2
          fetch-depth: 0

      - name: Add mobile runtime changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "## Stable tier\n\n*Breaking changes require an accepted RFC and a deprecation cycle of at least\ntwo major versions.*\n\n"
          entry = """### Added since 1.0.0-frozen — 2026-09-13 (mobile runtime boundary)\n- **Interpreter-only mobile runtime profile** (`Cargo.toml`, `src/runtime/`, `src/backends/`, `src/vm.rs`): native Cranelift/AOT code generation is now owned by the optional `native-codegen` feature while remaining enabled in default builds. The `mobile-runtime` profile excludes executable-code-generation and dynamic-loader dependencies, gates native backend wiring and benchmarks, and keeps Wasm support independently selectable. `scripts/check_mobile_runtime_profile.sh` provides the release gate for dependency-graph isolation and interpreter-only correctness.\n\n"""
          if entry not in text:
              if marker not in text:
                  raise SystemExit("stable tier insertion marker not found")
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text)

      - name: Publish changelog only
        shell: bash
        run: |
          set -euo pipefail
          git add CHANGELOG.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Changelog already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): record mobile runtime boundary"
          git push origin HEAD:feat/mobile-runtime-boundary-ci2
