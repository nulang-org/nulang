name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR commits should not keep burning runner time. Main pushes are
# deliberately not cancelled because the benchmark job below records rolling
# history and should retain every main-branch sample.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DAGGER_VERSION: v0.21.9

jobs:
  # GitHub Actions is intentionally only the trigger/status layer for the
  # portable validation jobs below. The actual build/test logic lives in
  # .dagger/ci and can be invoked unchanged from a developer machine or a
  # different CI scheduler (for example Woodpecker).
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable build, test, coverage, and implementation gates
        run: dagger --progress plain .dagger/ci/build-test.dag

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info

  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable release build and tests
        run: dagger --progress plain .dagger/ci/release.dag

  nula-test:
    name: Nula Package Test
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable Nula package smoke test
        run: dagger --progress plain .dagger/ci/nula-test.dag

  minimal-build:
    name: Build without optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable minimal-feature validation
        run: dagger --progress plain .dagger/ci/minimal-build.dag

  wasm-backend:
    name: Build & Test (wasm-backend feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable WASM backend validation
        run: dagger --progress plain .dagger/ci/wasm-backend.dag

  lint:
    name: Format, Clippy & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable format, lint, audit, and docs gates
        run: dagger --progress plain .dagger/ci/lint.dag

  lean:
    name: Lean Formalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Run portable Lean formalization gates
        run: dagger --progress plain .dagger/ci/lean.dag

  # Benchmarks intentionally remain GitHub-native in this migration because
  # they export artifacts and commit rolling benchmark history back to main.
  # Move this after the read-only validation path is proven stable.
  bench:
    name: Benchmarks (regression-gated)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --bench bench_main

      - name: Collect results
        run: |
          python3 scripts/collect_bench_results.py \
            --out "benchmarks/$(git rev-parse --short HEAD).json"

      - name: Check for regressions
        id: regression_check
        continue-on-error: true
        run: |
          python3 scripts/check_bench_regression.py \
            --latest "benchmarks/$(git rev-parse --short HEAD).json" \
            --history-dir benchmarks

      - name: Upload results as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/*.json
          retention-days: 90

      - name: Commit results to benchmarks/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "benchmarks/$(git rev-parse --short HEAD).json"
          git diff --staged --quiet || git commit -m "bench: record results for $(git rev-parse --short HEAD) [skip ci]"
          git push

      - name: Fail the job if a regression was found
        if: steps.regression_check.outcome == 'failure'
        run: exit 1
