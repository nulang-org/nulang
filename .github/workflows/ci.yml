name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch supersedes the previous run. Without
# this, every push queues a full ~6h run set (including Release Build) and
# the shared runner pool gridlocks behind stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------------
  # Documentation site + zero-install browser playground
  # -----------------------------------------------------------------------
  docs-site:
    name: Docs site & browser playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install Rust for browser playground
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache playground build
        uses: Swatinem/rust-cache@v2

      - name: Build browser playground
        run: playground/web/build.sh

      - name: Smoke test browser playground
        run: node playground/web/test/smoke.mjs

      - name: Install docs dependencies
        run: |
          cd docs
          pnpm install --frozen-lockfile

      - name: Type-check Astro site
        run: |
          cd docs
          pnpm run check

      - name: Build Astro site
        run: |
          cd docs
          pnpm run build

      - name: Verify playground is in site output
        run: |
          test -s docs/dist/playground/index.html
          test -s docs/dist/playground/playground.js
          test -s docs/dist/playground/style.css
          test -s docs/dist/playground/nulang_playground.wasm

  # -----------------------------------------------------------------------
  # Primary build & test (default features)
  # -----------------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: |
          # The five-node split-brain cluster test is known to be timing-
          # sensitive on GitHub Actions shared runners. Retry the whole suite
          # once on failure so a single flaky run does not block merges.
          cargo test || (echo "Retrying test suite after flaky failure..." && cargo test)

      - name: Install cargo-llvm-cov
        if: env.CODECOV_TOKEN != ''
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        if: env.CODECOV_TOKEN != ''
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info

      - name: Gate (forbidden patterns + zero warnings)
        # Build & Test above already ran the full default-feature test suite,
        # and llvm-cov reran tests with all features. Keep the verifier's
        # static-invariant and zero-warning checks, but avoid a third test run.
        run: python3 scripts/verify_implementation.py --skip-tests

  # -----------------------------------------------------------------------
  # Release build — catches optimization-only errors
  # -----------------------------------------------------------------------
  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release


  # -----------------------------------------------------------------------
  # Nula package-manager smoke test — scaffold a package and run `nula test`
  # -----------------------------------------------------------------------
  nula-test:
    name: Nula Package Test
    runs-on: ubuntu-latest
    needs: release
    env:
      # The repo sets `target-dir = "/tmp/cargo-target"` in `.cargo/config.toml`,
      # but the smoke-test steps below reference `./target/release/nulang`.
      # Override the target directory locally so the binary lands where the
      # scripts expect it.
      CARGO_TARGET_DIR: ./target
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build nulang (release)
        run: cargo build --release --bin nulang

      - name: Smoke test (eval)
        run: ./target/release/nulang --eval 'perform IO.print("hello")'

      - name: Scaffold test package
        run: ./target/release/nulang nula new test-pkg

      - name: Run nula test
        run: cd test-pkg && ../target/release/nulang nula test

      - name: Verify documentation examples
        run: NULANG_BIN=./target/release/nulang bash scripts/verify_doc_examples.sh
  # -----------------------------------------------------------------------
  # No-default-features build — proves zero PyO3/SQLite/LSP dependencies
  # -----------------------------------------------------------------------
  minimal-build:
    name: Build without optional features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # No python3-dev installed here on purpose: this job proves the
      # no-default-features build has zero PyO3/SQLite/LSP dependencies.
      - name: Build
        run: cargo build --all-targets --no-default-features

      - name: Test
        run: cargo test --no-default-features

      - name: Check zero warnings
        run: cargo check --tests --no-default-features

  # -----------------------------------------------------------------------
  # WASM backend
  # -----------------------------------------------------------------------
  wasm-backend:
    name: Build & Test (wasm-backend feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --features wasm-backend

      - name: Test
        run: cargo test --features wasm-backend

  # -----------------------------------------------------------------------
  # Lint — format, clippy, audit, docs, all-features check
  # -----------------------------------------------------------------------
  lint:
    name: Format, Clippy & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Format check is blocking — the codebase has been rustfmt'd.
      - name: Format check
        run: cargo fmt --check

      # Clippy with default features — correctness lints are blocking.
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D clippy::correctness

      # Clippy with all features — catches wasm-backend code paths.
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness

      # Clippy with no default features — catches minimal-build code paths.
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D clippy::correctness

      # Zero compiler warnings on the main build path.
      - name: Check zero warnings (tests)
        run: cargo check --tests

      # Security audit of dependency tree.
      - name: Audit (cargo-audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # All-features compilation check.
      - name: Check all features
        run: cargo check --all-features

      # Documentation builds without errors.
      - name: Check docs
        run: cargo doc --no-deps

      # Documentation warnings are non-blocking but visible.
      - name: Doc warnings (info only)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps 2>&1 || true

  # -----------------------------------------------------------------------
  # Lean formalization — verifies the formal specs compile
  # -----------------------------------------------------------------------
  lean:
    name: Lean Formalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.16.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build formal specs
        run: |
          cd spec/formal
          lake build

      - name: Sorry-count ratchet (no silent proof regressions)
        run: |
          cd spec/formal
          count=$(grep -rc '\bsorry\b' *.lean | awk -F: '{sum+=$2} END {print sum+0}')
          baseline=1
          echo "sorry count: $count (baseline: $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::spec/formal/*.lean sorry count ($count) exceeds baseline ($baseline)."
            echo "::error::A PR must not silently regress a proved theorem to 'sorry'. If intentional"
            echo "::error::(e.g. a toolchain compat fix), lower this baseline AND document the"
            echo "::error::regression in spec/formal/README.md, SPEC2.md, CHANGELOG.md, and PLAN.md"
            echo "::error::(see the 2026-08-02 correction entries for the required disclosure"
            echo "::error::pattern this repeats: what regressed, which commit, why, and current"
            echo "::error::per-theorem status)."
            exit 1
          fi

  # -----------------------------------------------------------------------
  # Same-host Nulang vs BEAM evidence — informational, never a merge ranking.
  # Runs only on the dedicated benchmark PR so normal changes do not pay for
  # installing Erlang or compiling the matched release harness.
  # -----------------------------------------------------------------------
  beam-parity-evidence:
    name: Same-host Nulang vs BEAM actor baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/beam-parity')
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies and Erlang
        run: sudo apt-get update && sudo apt-get install -y python3-dev erlang-base

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build matched Nulang harness
        run: |
          CARGO_TARGET_DIR=/tmp/nulang-beam-target \
            cargo build --release --example beam_parity

      - name: Run matched 1k / 10k actor workloads
        run: |
          mkdir -p /tmp/beam-parity-results
          /tmp/nulang-beam-target/release/examples/beam_parity 1000 10000 \
            | tee /tmp/beam-parity-results/nulang.csv
          escript benchmarks/beam/beam_parity.escript 1000 10000 \
            | tee /tmp/beam-parity-results/beam.csv

      - name: Render comparison
        run: |
          python3 scripts/compare_beam_parity.py \
            --nulang /tmp/beam-parity-results/nulang.csv \
            --beam /tmp/beam-parity-results/beam.csv \
            | tee /tmp/beam-parity-results/summary.md
          cat /tmp/beam-parity-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload same-host evidence
        uses: actions/upload-artifact@v7
        with:
          name: beam-parity-${{ github.sha }}
          path: /tmp/beam-parity-results
          retention-days: 90

  # -----------------------------------------------------------------------
  # Actor density A/B gate — runs only for actor-density PR branches.
  #
  # Builds the PR base and head into separate target directories, then runs
  # both binaries on the same hosted runner. This makes RSS/throughput ratios
  # materially more useful than comparing unrelated CI jobs.
  # -----------------------------------------------------------------------
  actor-density:
    name: Actor density A/B (10k / 100k)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/actor-density')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Create base worktree
        run: git worktree add /tmp/nulang-density-base "${{ github.event.pull_request.base.sha }}"

      - name: Build base and candidate probes
        run: |
          CARGO_TARGET_DIR=/tmp/nulang-density-target-base \
            cargo build --manifest-path /tmp/nulang-density-base/Cargo.toml \
              --release --example actor_density
          CARGO_TARGET_DIR=/tmp/nulang-density-target-head \
            cargo build --release --example actor_density

      - name: Run same-host density ladder
        run: |
          mkdir -p /tmp/nulang-density-results/base /tmp/nulang-density-results/candidate
          for count in 10000 100000; do
            /tmp/nulang-density-target-base/release/examples/actor_density "$count" \
              | tee "/tmp/nulang-density-results/base/$count.txt"
            /tmp/nulang-density-target-head/release/examples/actor_density "$count" \
              | tee "/tmp/nulang-density-results/candidate/$count.txt"
          done

      - name: Compare memory and throughput
        run: |
          python3 scripts/compare_actor_density.py \
            --base-dir /tmp/nulang-density-results/base \
            --candidate-dir /tmp/nulang-density-results/candidate \
            | tee /tmp/nulang-density-results/summary.md
          cat /tmp/nulang-density-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload density evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actor-density-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: /tmp/nulang-density-results
          retention-days: 30

  # -----------------------------------------------------------------------
  # Benchmarks — regression-gated against a rolling window of recent
  # main-branch history (see scripts/check_bench_regression.py and
  # benchmarks/README.md for the noise-aware methodology: each
  # benchmark's own historical spread sets its threshold, not a flat
  # percentage — GitHub Actions' shared runners commonly show 20-50%+
  # run-to-run noise, so a naive fixed threshold would fail PRs for
  # noise, not real regressions). Runs on push to main only (not every
  # PR) since a full criterion run of every group is slow; results are
  # committed back so PERFORMANCE_ANALYSIS.md can cite real numbers
  # instead of estimates. The gate needs >= 3 prior commits' worth of
  # history for a given benchmark before it will fail anything, so
  # early runs (and brand-new benchmarks) are informational only until
  # enough history accumulates.
  # -----------------------------------------------------------------------
  bench:
    name: Benchmarks (regression-gated)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Persist rolling benchmark history after regression checks pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --bench bench_main

      - name: Collect results
        run: |
          python3 scripts/collect_bench_results.py \
            --out "benchmarks/$(git rev-parse --short HEAD).json"

      - name: Check for regressions
        id: regression_check
        continue-on-error: true
        run: |
          python3 scripts/check_bench_regression.py \
            --latest "benchmarks/$(git rev-parse --short HEAD).json" \
            --history-dir benchmarks

      - name: Upload results as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/*.json
          retention-days: 90

      - name: Commit results to benchmarks/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "benchmarks/$(git rev-parse --short HEAD).json"
          git diff --staged --quiet || git commit -m "bench: record results for $(git rev-parse --short HEAD) [skip ci]"
          git push

      # Separate from the check step itself so the commit above always
      # happens (preserving complete rolling-window history) even when
      # this commit's numbers regressed.
      - name: Fail the job if a regression was found
        if: steps.regression_check.outcome == 'failure'
        run: exit 1
