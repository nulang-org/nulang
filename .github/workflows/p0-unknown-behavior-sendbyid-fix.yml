name: P0 Unknown Behavior SendById Fix

on:
  push:
    branches:
      - fix/fail-closed-unknown-behavior

concurrency:
  group: p0-unknown-behavior-sendbyid-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/fail-closed-unknown-behavior
          fetch-depth: 0

      - name: Pin branch head
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply narrow runtime and regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path("src/runtime/mod.rs")
          runtime = runtime_path.read_text()
          start_marker = "        if self.actors.contains_key(&target_id)\n            && !self.actor_has_behavior_id(target_id, behavior_id)\n        {\n"
          end_marker = "        let msg = Message {\n"
          if start_marker in runtime:
              start = runtime.index(start_marker)
              end = runtime.index(end_marker, start)
              block = runtime[start:end]
              expected = "".join([
                  "        if self.actors.contains_key(&target_id)\n",
                  "            && !self.actor_has_behavior_id(target_id, behavior_id)\n",
                  "        {\n",
                  "            warn!(\n",
                  "                \"nulang-runtime: rejecting message to actor {}: unknown behavior id {}\",\n",
                  "                target_id, behavior_id\n",
                  "            );\n",
                  "            return;\n",
                  "        }\n",
              ])
              if block != expected:
                  raise SystemExit(f"unexpected send_message_by_id guard shape:\n{block}")
              runtime_path.write_text(runtime[:start] + runtime[end:])
          else:
              print("numeric send guard already absent")

          tests_path = Path("src/runtime/tests.rs")
          tests = tests_path.read_text()
          fn_marker = "fn test_distributed_remote_address_local_fallback() {\n"
          start = tests.index(fn_marker)
          next_test = tests.index("\n#[test]\n", start + len(fn_marker))
          segment = tests[start:next_test]
          registration = '        .register_behavior("test", local_fallback_behavior);\n'
          if registration not in segment:
              actor_line = (
                  '    let actor_id = rt.spawn_actor(Box::new(|| vec![("val".to_string(), Value::int(0))]));\n'
              )
              if actor_line not in segment:
                  raise SystemExit("unexpected local fallback test shape")
              segment = segment.replace(
                  fn_marker,
                  fn_marker + "    fn local_fallback_behavior(_actor: &mut Actor, _args: &[Value]) {}\n\n",
                  1,
              )
              segment = segment.replace(
                  actor_line,
                  actor_line
                  + "    rt.actors\n"
                  + "        .get_mut(&actor_id)\n"
                  + "        .unwrap()\n"
                  + registration,
                  1,
              )
              tests_path.write_text(tests[:start] + segment + tests[next_test:])
          else:
              print("local fallback test already declares behavior")
          PY
          git diff --check

      - name: Validate focused fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features runtime::tests::p0_unknown_named_send_is_rejected -- --exact
          cargo test --no-default-features runtime::tests::p0_unknown_numeric_ask_is_rejected_without_running_behavior_zero -- --exact

      - name: Revalidate representative internal numeric delivery paths
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features runtime::tests::test_send_carries_current_trace_span -- --exact
          cargo test --no-default-features runtime::tests::test_cross_actor_send_foreign_count_lifecycle -- --exact
          cargo test --no-default-features runtime::tests::test_distributed_remote_address_local_fallback -- --exact
          cargo test --no-default-features integration_tests::tests::test_flight_recorder_records_messages -- --exact

      - name: Revalidate full no-default suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features

      - name: Format and diff gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
          changed="$(git diff --name-only)"
          printf 'working-tree paths:\n%s\n' "$changed"
          expected=$'src/runtime/mod.rs\nsrc/runtime/tests.rs'
          if [ -n "$changed" ]; then
            test "$changed" = "$expected"
          fi

      - name: Guard exact head and land validated product files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/runtime/mod.rs src/runtime/tests.rs; then
            echo "validated product fixes already landed; no commit needed"
            exit 0
          fi
          git fetch origin fix/fail-closed-unknown-behavior
          remote_head="$(git rev-parse origin/fix/fail-closed-unknown-behavior)"
          if [ "$remote_head" != "$START_HEAD" ]; then
            echo "branch advanced during validation: $remote_head (expected $START_HEAD)" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/mod.rs src/runtime/tests.rs
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          expected=$'src/runtime/mod.rs\nsrc/runtime/tests.rs'
          test "$changed" = "$expected"
          git commit -m 'fix(runtime): preserve trusted numeric delivery semantics'
          git push origin HEAD:fix/fail-closed-unknown-behavior
