name: Finalize Web Contract request binding docs

on:
  push:
    branches:
      - docs/web-request-source-syntax

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/web-request-source-syntax
          fetch-depth: 0

      - name: Record socket-level coverage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("docs/WEB_CONTRACT_IR.md")
          text = path.read_text()

          anchor = "Both typed and legacy calls remain inside the existing request context during the migration period. This preserves current request helpers and response-cookie behavior while argument sourcing moves to compiler-owned bindings."
          addition = anchor + "\n\nNetwork-level regression coverage compiles real Nulang handlers and route contracts, starts `WebDevServer` on an ephemeral TCP port, and verifies successful typed query decoding, `400 application/problem+json` decode failures, and legacy route fallback over the wire."
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one runtime compatibility paragraph, found {text.count(anchor)}")
          text = text.replace(anchor, addition, 1)

          old_priorities = """1. Define an explicit request/response algebra (`Json[T]`, `Html`, bytes, streams, typed bodies/media) so Contract IR and OpenAPI can represent payloads without guessing.
          2. Add richer request decoders for optional/default values, repeated query parameters/collections, binary bodies, transparent aliases, and opaque/domain types.
          3. Add full socket-level regression tests covering compiler syntax through `WebDevServer`, including 400 problem responses and legacy fallback.
          4. Execute requests under lightweight supervised request actors with structured cancellation/backpressure.
          5. Replace ambient request-context dependency injection with effect handlers once compatibility coverage is sufficient.
          6. Introduce authorization/resource capabilities separately from Nulang reference capabilities, including attenuation and capability-parameterized effects.
          7. Unify HTTP, SSE, and WebSocket entry points over the same actor/effect/capability execution model."""
          new_priorities = """1. Define an explicit request/response algebra (`Json[T]`, `Html`, bytes, streams, typed bodies/media) so Contract IR and OpenAPI can represent payloads without guessing.
          2. Add richer request decoders for optional/default values, repeated query parameters/collections, binary bodies, transparent aliases, and opaque/domain types.
          3. Execute requests under lightweight supervised request actors with structured cancellation/backpressure.
          4. Replace ambient request-context dependency injection with effect handlers once compatibility coverage is sufficient.
          5. Introduce authorization/resource capabilities separately from Nulang reference capabilities, including attenuation and capability-parameterized effects.
          6. Unify HTTP, SSE, and WebSocket entry points over the same actor/effect/capability execution model."""
          if text.count(old_priorities) != 1:
              raise SystemExit(f"expected one stale remaining-priorities block, found {text.count(old_priorities)}")
          path.write_text(text.replace(old_priorities, new_priorities, 1))
          PY

      - name: Validate documentation truth
        run: |
          grep -F 'Network-level regression coverage' docs/WEB_CONTRACT_IR.md
          grep -F '400 application/problem+json' docs/WEB_CONTRACT_IR.md
          ! grep -F 'Add full socket-level regression tests' docs/WEB_CONTRACT_IR.md
          grep -F '1. Define an explicit request/response algebra' docs/WEB_CONTRACT_IR.md

      - name: Commit finalized documentation
        shell: bash
        run: |
          rm .github/workflows/zz-ai-web-contract-docs-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/WEB_CONTRACT_IR.md .github/workflows/zz-ai-web-contract-docs-final.yml
          git commit -m "docs(web): finalize compiler-owned request binding contract"
          git push origin HEAD:docs/web-request-source-syntax
