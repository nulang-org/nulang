name: Focused durable journal replay

on:
  pull_request:

jobs:
  durable-journal-string-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-default-features --lib test_journal_replay_restores_persisted_string_payload_on_actor_heap -- --exact
