name: Apply PR 1207 terminal cleanup

on:
  push:
    branches:
      - automation/apply-pr1207-terminal-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/compiled-workflow-atomic-tail-20260930
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply verified source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tests = Path('src/runtime/tests.rs')
          text = tests.read_text()
          old = '    assert!(rt.append_timer_set(actor_id, "wake", 250).unwrap());\n'
          new = '    rt.append_timer_set(actor_id, "wake", 250).unwrap();\n'
          assert text.count(old) == 1, text.count(old)
          tests.write_text(text.replace(old, new))

          mod = Path('src/runtime/mod.rs')
          text = mod.read_text()
          marker = '    /// Resume an actor that yielded at a JIT safepoint.\n'
          assert text.count(marker) == 1, text.count(marker)
          helper = '''    /// Clear replay state only after the matching workflow activation reaches a
              /// durable terminal boundary. A persistence failure must leave the replay
              /// identity intact so recovery can resume from committed history.
              pub(crate) fn clear_terminal_workflow_activation(
                  &mut self,
                  actor_id: u64,
                  activation: Option<WorkflowActivationId>,
              ) {
                  let Some(actor) = self.actors.get_mut(&actor_id) else {
                      return;
                  };

                  if actor.current_workflow_activation == activation {
                      actor.current_workflow_activation = None;
                  }
                  if actor.workflow_replay_activation == activation {
                      actor.workflow_replay_activation = None;
                      actor.workflow_replay_event_ordinal = 0;
                  }
              }

          '''
          text = text.replace(marker, helper + marker)
          mod.write_text(text)

          workflow = Path('src/runtime/workflow.rs')
          text = workflow.read_text()

          completed_start = text.index('pub(crate) fn persist_step_completed(')
          failed_start = text.index('pub(crate) fn persist_step_failed(', completed_start)
          completed = text[completed_start:failed_start]
          old_atomic = '        return commit_step_completed(rt, actor_id, activation, step_name);\n'
          assert completed.count(old_atomic) == 1, completed.count(old_atomic)
          completed = completed.replace(
              old_atomic,
              '        commit_step_completed(rt, actor_id, activation, step_name)?;\n'
              '        rt.clear_terminal_workflow_activation(actor_id, activation);\n'
              '        return Ok(());\n',
          )
          old_tail = '    try_checkpoint_actor(rt, actor_id)\n}\n\n'
          assert completed.count(old_tail) == 1, completed.count(old_tail)
          completed = completed.replace(
              old_tail,
              '    try_checkpoint_actor(rt, actor_id)?;\n'
              '    rt.clear_terminal_workflow_activation(actor_id, activation);\n'
              '    Ok(())\n}\n\n',
          )
          text = text[:completed_start] + completed + text[failed_start:]

          failed_start = text.index('pub(crate) fn persist_step_failed(')
          next_fn = text.index('\npub(crate) fn ', failed_start + 1)
          failed = text[failed_start:next_fn]
          old_atomic = '        return commit_step_failed(rt, actor_id, activation, step_name, error);\n'
          assert failed.count(old_atomic) == 1, failed.count(old_atomic)
          failed = failed.replace(
              old_atomic,
              '        commit_step_failed(rt, actor_id, activation, step_name, error)?;\n'
              '        rt.clear_terminal_workflow_activation(actor_id, activation);\n'
              '        return Ok(());\n',
          )
          old_tail = '    try_checkpoint_actor(rt, actor_id)\n}\n'
          assert failed.count(old_tail) == 1, failed.count(old_tail)
          failed = failed.replace(
              old_tail,
              '    try_checkpoint_actor(rt, actor_id)?;\n'
              '    rt.clear_terminal_workflow_activation(actor_id, activation);\n'
              '    Ok(())\n}\n',
          )
          workflow.write_text(text[:failed_start] + failed + text[next_fn:])
          PY

          cargo fmt --all
          git diff --check

      - name: Verify focused regression gates
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib test_terminal_activation_cleanup_resets_replay_cursor
          cargo test --locked --no-default-features --lib compiled_workflow
          cargo test --locked --no-default-features --lib open_activation_intermediate_events_extend_atomic_tail
          cargo build --locked --all-targets --no-default-features

      - name: Commit source fix to PR branch
        shell: bash
        run: |
          git config user.name 'nlc-ci'
          git config user.email 'nlc-ci@users.noreply.github.com'
          git add src/runtime/llm.rs src/runtime/mod.rs src/runtime/persistence.rs src/runtime/tests.rs src/runtime/workflow.rs
          git diff --cached --check
          git commit -m 'fix(workflow): clear terminal replay state after durable commit'
          git push origin HEAD:fix/compiled-workflow-atomic-tail-20260930
