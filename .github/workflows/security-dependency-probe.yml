name: Security dependency resolution probe

# TEMPORARY read-only resolver diagnostic; remove before promotion.
on:
  push:
    branches: [codex/security-audit-unified-20261020]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve patched dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Stage libSQL and ureq candidate manifests for resolution
        run: |
          git show e7d1da13041c7d8020327b7892a551473a54f428:Cargo.toml > Cargo.toml
          git show e7d1da13041c7d8020327b7892a551473a54f428:Cargo.lock > Cargo.lock
          sed -i 's/wasmtime = { version = "48.0.6"/wasmtime = { version = "48.0.7"/' Cargo.toml
          sed -i 's/^ureq = \["dep:ureq"\]/ureq = ["dep:ureq", "dep:native-tls"]/' Cargo.toml
          sed -i 's/^ureq = { version = "2", optional = true }/ureq = { version = "2", optional = true, default-features = false, features = ["native-tls", "gzip"] }/' Cargo.toml
          sed -i '/^ureq = { version = "2", optional = true, default-features = false/a native-tls = { version = "0.2", optional = true }' Cargo.toml
          grep '^wasmtime = ' Cargo.toml
          grep '^ureq = ' Cargo.toml
      - name: Resolve exact patched dependency graph
        run: |
          cargo update -p wasmtime --precise 48.0.7
          cargo update -p rustls-webpki@0.103.14 --precise 0.103.16
          cargo update -p webpki-roots@1.0.9 --precise 1.0.10
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Verify vulnerable root version removed and emit lockfile
        run: |
          cargo tree --locked --all-features -i rustls-webpki@0.103.16
          git diff --stat -- Cargo.lock Cargo.toml
          if grep -A2 '^name = "webpki-roots"$' Cargo.lock | grep -Fq '"0.26.11"'; then
            echo "::error::Legacy root bundle remains in resolved graph"
            cargo tree --locked --all-features -i webpki-roots@0.26.11
            exit 1
          fi
          echo "NULANG_LOCK_BEGIN"
          cat Cargo.lock
          echo "NULANG_LOCK_END"
      - name: Upload Cargo-resolved lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-resolved-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
