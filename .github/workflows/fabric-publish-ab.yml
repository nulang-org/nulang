name: Fabric publication exact-base A/B

on:
  pull_request:
    paths:
      - '.github/workflows/fabric-publish-ab.yml'
      - 'scripts/fabric_publish_ab_bench.py'
      - 'scripts/tests/test_fabric_publish_ab_bench.py'
      - 'benches/actor_bench.rs'
      - 'src/runtime/distributed_context.rs'

concurrency:
  group: fabric-publish-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    name: Matched-fixture Fabric A/B
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify harness contracts
        run: python3 -m unittest scripts/tests/test_fabric_publish_ab_bench.py

      - name: Select newly added benchmark fixture
        id: fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          from scripts.fabric_publish_ab_bench import matched_fixture, select_mode

          base = subprocess.check_output(
              ["git", "show", f"{os.environ['BASE_SHA']}:benches/actor_bench.rs"],
              text=True,
          )
          candidate = Path("benches/actor_bench.rs").read_text()
          mode = select_mode(base, candidate)
          if mode is not None:
              matched_fixture(base, candidate, mode=mode)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"mode={mode or 'skip'}\n")
          print(f"Fabric A/B mode: {mode or 'skip'}")
          PY

      - name: Compare exact-base same-host Criterion samples
        if: steps.fixture.outputs.mode != 'skip'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MODE: ${{ steps.fixture.outputs.mode }}
        run: |
          python3 scripts/fabric_publish_ab_bench.py --base-ref "$BASE_SHA" --mode "$MODE" --runs 8 --warmup 1 --output fabric-publish-ab.json

      - name: Publish measurement and provenance
        if: steps.fixture.outputs.mode != 'skip'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("fabric-publish-ab.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Exact-base Fabric A/B ({report['mode']})\n\n")
              f.write(f"Base: `{report['base_sha']}` · Candidate: `{report['candidate_sha']}`\n\n")
              label = 'Unrelated exact subscriptions' if report['mode'] == 'exact' else 'Idle actors'
              f.write(f'| {label} | Base ns | Candidate ns | Paired speedup |\n')
              f.write("| ---: | ---: | ---: | ---: |\n")
              for count, row in report["comparison"].items():
                  f.write(f"| {count} | {row['median_base_ns']:.1f} | {row['median_candidate_ns']:.1f} | {row['median_speedup_x']:.3f}x |\n")
              f.write(f"\nCriterion group: {report['benchmark_group']}; unmatched publication only, not delivered throughput.\n")
          PY
