name: P0 AI Redrive Recovery

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14
    paths:
      - .github/workflows/p0-ai-redrive-recovery.yml

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Pin validation bases
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo "VALIDATION_BRANCH_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VALIDATION_MAIN_HEAD=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Recover interrupted workflow inference by redriving the durable step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/mod.rs')
          text = path.read_text()
          before = '''            let should_resume = self
              .actors
              .get(&actor_id)
              .map(|a| a.waiting_signal.is_some() || a.suspended_execution.is_some())
              .unwrap_or(false);
          if should_resume {
          '''
          after = '''            let (should_resume, interrupted_llm) = self
              .actors
              .get(&actor_id)
              .map(|a| {
                  (
                      a.waiting_signal.is_some() || a.suspended_execution.is_some(),
                      a.waiting_signal.as_deref() == Some(LLM_SUSPEND_MARKER),
                  )
              })
              .unwrap_or((false, false));
          if interrupted_llm {
              // VM continuations are process-local and cannot survive recovery. The
              // durable marker means this workflow step must be re-driven instead
              // of leaving the recovered actor blocked on the abandoned call.
              if let Some(actor) = self.actors.get_mut(&actor_id) {
                  actor.waiting_signal = None;
                  actor.llm_inflight = false;
                  actor.suspended_execution = None;
              }
          }
          if should_resume {
          '''
          if text.count(before) != 1:
              raise SystemExit('recover_actor resume shape changed')
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Reuse reviewed authority migration transforms
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/p0-ai-authority-migration.yml')
          wanted = [
            'Rebase function-local spawn metadata to module PCs',
            'Add nonzero-function-base authority regression',
            'Migrate legacy AI fixtures to explicit inference authority',
          ]
          steps = workflow.fetch('jobs').fetch('migrate-and-validate').fetch('steps')
          wanted.each_with_index do |name, index|
            step = steps.find { |candidate| candidate['name'] == name }
            raise "missing migration step: #{name}" unless step
            File.write("/tmp/p0-migration-#{index}.sh", step.fetch('run'))
          end
          RUBY
          for script in /tmp/p0-migration-*.sh; do
            bash "$script"
          done

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check default and minimal builds
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features

      - name: Enforce zero-warning library builds
        run: |
          RUSTFLAGS='-D warnings' cargo check --lib
          RUSTFLAGS='-D warnings' cargo check --release --lib

      - name: Run spawn authority provenance suite
        run: cargo test --test spawn_authority_provenance -- --nocapture

      - name: Run all migrated AI regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test_agent_ask_tracks_usage_and_cost
            test_agent_ask_uses_memory
            test_agent_usage_behavior
            test_agent_workflow_recovers_semantic_memory_after_restart
            test_agent_workflow_researches_and_reports
            test_debate_source_end_to_end
            test_inference_ask_actor_behavior_suspends_and_resumes
            test_inference_ask_chained_suspensions_resume_in_order
            test_inference_ask_nonblocking_other_actors_run_first
            test_inference_ask_queued_messages_wait_for_suspended_behavior
            test_mir_agent_ask_uses_memory
            test_pipeline_source_end_to_end
            test_supervisor_source_end_to_end
            test_workflow_inference_ask_step_records_completion
            test_workflow_inference_ask_step_redriven_after_restart
            test_workflow_step_inference_ask_then_signal_wait
            test_workflow_step_signal_wait_then_inference_ask
          )
          for test_name in "${tests[@]}"; do
            echo "==> $test_name"
            cargo test --lib "integration_tests::tests::$test_name" -- --exact --nocapture
          done

      - name: Re-run host authority regressions
        run: cargo test --lib host_authority -- --nocapture

      - name: Diff hygiene and product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 5
          test "${changed[0]}" = "src/integration_tests/mod.rs"
          test "${changed[1]}" = "src/mir_codegen.rs"
          test "${changed[2]}" = "src/runtime/http_server.rs"
          test "${changed[3]}" = "src/runtime/mod.rs"
          test "${changed[4]}" = "tests/spawn_authority_provenance.rs"

      - name: Commit validated stabilization changes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-stabilization-2026-09-14 main
          remote_head="$(git rev-parse origin/integration/p0-stabilization-2026-09-14)"
          if [ "$remote_head" != "$VALIDATION_BRANCH_HEAD" ]; then
            echo "integration branch advanced during validation: $remote_head (expected $VALIDATION_BRANCH_HEAD)" >&2
            exit 1
          fi
          main_head="$(git rev-parse origin/main)"
          if [ "$main_head" != "$VALIDATION_MAIN_HEAD" ]; then
            echo "main advanced during validation: $main_head (expected $VALIDATION_MAIN_HEAD)" >&2
            exit 1
          fi
          rm .github/workflows/p0-ai-authority-migration.yml
          rm .github/workflows/p0-ai-redrive-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mir_codegen.rs tests/spawn_authority_provenance.rs src/integration_tests/mod.rs src/runtime/http_server.rs src/runtime/mod.rs .github/workflows/p0-ai-authority-migration.yml .github/workflows/p0-ai-redrive-recovery.yml
          git diff --cached --check
          git commit -m 'fix(runtime): recover interrupted inference and migrate authority fixtures'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
