name: P0 Authority Spawn Landing

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14
    paths:
      - .github/workflows/p0-authority-spawn-landing.yml

permissions:
  contents: write

concurrency:
  group: p0-authority-spawn-landing
  cancel-in-progress: false

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Pin reviewed authority inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/runtime/spawn.rs)" = "7c5d2ff46753ae8237f0dbbe3bd40dd39ffdea42"
          test "$(git rev-parse HEAD:.github/workflows/p0-authority-spawn-ordering.yml)" = "a3dde2d749edeb0ec893822f72112dbfceb61b75"
          echo "BASE_SPAWN_SHA=7c5d2ff46753ae8237f0dbbe3bd40dd39ffdea42" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: p0-authority-spawn-landing-v1

      - name: Apply the reviewed authority transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/p0-authority-spawn-ordering.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          assert workflow.count(start_marker) == 1, 'authority transform start marker drifted'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'p0-authority-spawn-ordering.yml::<transform>', 'exec'), {})
          PY
          cargo fmt --all
          git diff --check

      - name: Verify focused authority regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib runtime::spawn::authority_tests:: -- --nocapture
          cargo test --test spawn_authority_provenance -- --nocapture

      - name: Verify warning and format gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo check --lib

      - name: Enforce isolated product diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/runtime/spawn.rs"

      - name: Land spawn.rs only
        shell: bash
        run: |
          set -euo pipefail
          git diff src/runtime/spawn.rs > /tmp/spawn-ordering.patch
          git fetch origin integration/p0-stabilization-2026-09-14
          remote_head="$(git rev-parse origin/integration/p0-stabilization-2026-09-14)"
          remote_spawn_sha="$(git rev-parse origin/integration/p0-stabilization-2026-09-14:src/runtime/spawn.rs)"
          test "$remote_spawn_sha" = "$BASE_SPAWN_SHA"
          git reset --hard "$remote_head"
          git apply /tmp/spawn-ordering.patch
          git diff --check
          test "$(git diff --name-only)" = "src/runtime/spawn.rs"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/spawn.rs
          git diff --cached --check
          git commit -m 'fix(authority): checkpoint workflow grants at spawn'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
