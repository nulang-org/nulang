name: Apply AOT intrinsic integration

on:
  push:
    paths:
      - .github/workflows/intrinsic-aot-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/mir-inspection-surface
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Integrate AOT intrinsics
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/aot/codegen.rs")
          text = path.read_text()

          old = """        mir::RValue::Binary(_, a, b) => {\n            out.push(*a);\n            out.push(*b);\n        }\n        mir::RValue::StringEq(a, b) | mir::RValue::StrConcat(a, b) => {\n"""
          new = """        mir::RValue::Binary(_, a, b) => {\n            out.push(*a);\n            out.push(*b);\n        }\n        mir::RValue::Intrinsic(intrinsic) => out.extend_from_slice(&intrinsic.args),\n        mir::RValue::StringEq(a, b) | mir::RValue::StrConcat(a, b) => {\n"""
          if text.count(old) != 1:
              raise SystemExit(f"AOT use-analysis anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = """        mir::RValue::Unary(op, operand) => {\n            compile_unary(builder, *op, *operand, type_meta, helpers, local_vals, mode)\n        }\n\n        mir::RValue::Call { func, args } => {\n"""
          new = """        mir::RValue::Unary(op, operand) => {\n            compile_unary(builder, *op, *operand, type_meta, helpers, local_vals, mode)\n        }\n\n        mir::RValue::Intrinsic(intrinsic) => {\n            let args = intrinsic\n                .args\n                .iter()\n                .map(|id| {\n                    let reg = mir::FunctionBuilder::LOCAL_BASE + id.0;\n                    local_vals.get(&reg).copied().ok_or_else(|| {\n                        AotCompileError::Internal(format!(\n                            \"intrinsic arg local {} uninitialized\",\n                            id.0\n                        ))\n                    })\n                })\n                .collect::<AotResult<Vec<_>>>()?;\n            let representation = match mode {\n                CompileMode::Boxed => {\n                    crate::compiler_intrinsics::NativeIntegerRepresentation::TaggedInt48\n                }\n                CompileMode::Unboxed => {\n                    crate::compiler_intrinsics::NativeIntegerRepresentation::RawI64\n                }\n            };\n            crate::compiler_intrinsics::lower_cranelift_integer(\n                builder,\n                intrinsic.op,\n                &args,\n                representation,\n            )\n            .map_err(|e| {\n                AotCompileError::Internal(format!(\n                    \"invalid compiler intrinsic '{}': {e}\",\n                    intrinsic.op.stable_name()\n                ))\n            })\n        }\n\n        mir::RValue::Call { func, args } => {\n"""
          if text.count(old) != 1:
              raise SystemExit(f"AOT compile anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Test intrinsic integration
        run: cargo test --locked --test compiler_intrinsics_aot --test compiler_intrinsics_mir --test compiler_intrinsics_native_representation
      - name: Commit integration
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/aot/codegen.rs tests/compiler_intrinsics_aot.rs
          git diff --cached --check
          git commit -m "feat(aot): lower MIR integer intrinsics natively"
          git push origin HEAD:codex/mir-inspection-surface
