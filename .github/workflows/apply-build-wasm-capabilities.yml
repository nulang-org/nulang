name: Apply build-wasm capability parity

on:
  push:
    branches:
      - fix/build-wasm-capabilities

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[build-wasm-caps-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-wasm-capabilities
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply capability forwarding patch
        run: python3 scripts/apply_build_wasm_capabilities.py
      - name: Format
        run: cargo fmt --all
      - name: Focused regression
        run: cargo test --lib test_build_wasm_forwards_manifest_capabilities -- --nocapture
      - name: Compile package manager path
        run: cargo check --lib
      - name: Remove one-shot machinery
        run: |
          rm scripts/apply_build_wasm_capabilities.py
          rm .github/workflows/apply-build-wasm-capabilities.yml
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(package): forward manifest capabilities to build-wasm [build-wasm-caps-applied]"
          git push origin HEAD:fix/build-wasm-capabilities
