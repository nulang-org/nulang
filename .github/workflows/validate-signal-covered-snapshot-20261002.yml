name: Validate covered-signal process restart

on:
  push:
    branches:
      - automation/validate-signal-covered-snapshot-20261002

permissions:
  contents: write

jobs:
  signal-covered-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/workflow-signal-covered-snapshot-20261002
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add covered-signal restart regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime/tests.rs')
          text = p.read_text()
          marker = '#[test]\nfn test_recovery_replays_unfinished_atomic_native_workflow_activation() {'
          assert text.count(marker) == 1, text.count(marker)
          name = 'fn test_signal_journal_survives_process_restart_when_snapshot_covers_signal()'
          assert name not in text
          test = r'''#[cfg(feature = "sqlite")]
          #[test]
          fn test_signal_journal_survives_process_restart_when_snapshot_covers_signal() {
              let nonce = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .unwrap()
                  .as_nanos();
              let dir = std::env::temp_dir().join(format!(
                  "nulang-workflow-signal-covered-restart-{}-{nonce}",
                  std::process::id()
              ));
              let db_path = dir.join("workflow.db");
              let _ = std::fs::remove_dir_all(&dir);
              std::fs::create_dir_all(&dir).unwrap();

              let mut rt = Runtime::new();
              rt.persistence = Box::new(LibsqlStore::new(&db_path).unwrap());
              let actor_id =
                  rt.spawn_workflow_actor("SignalCoveredRestart", Box::new(Vec::new), HashMap::new());

              rt.signal_workflow(actor_id, "wake", Some("payload".to_string()))
                  .unwrap();
              let signal_sequence = rt
                  .persistence
                  .read_signal_events(actor_id)
                  .into_iter()
                  .map(|event| event.sequence())
                  .max()
                  .unwrap();
              let snapshot = rt.persistence.load_snapshot(actor_id).unwrap();
              assert!(
                  snapshot.sequence >= signal_sequence,
                  "fixture requires the completed snapshot to cover the durable signal"
              );

              drop(rt);

              let mut recovered = Runtime::new();
              recovered.persistence = Box::new(LibsqlStore::new(&db_path).unwrap());
              assert_eq!(recovered.recover_actor(actor_id), Some(actor_id));
              assert_eq!(
                  recovered
                      .actors
                      .get(&actor_id)
                      .unwrap()
                      .received_signals
                      .iter()
                      .filter(|(name, payload)| {
                          name == "wake" && payload.as_deref() == Some("payload")
                      })
                      .count(),
                  1,
                  "restart must rebuild signal availability from the full durable signal journal even when the snapshot sequence already covers it"
              );

              drop(recovered);
              let _ = std::fs::remove_dir_all(&dir);
          }

          '''
          p.write_text(text.replace(marker, test + marker))
          PY
          git diff --check
          git config user.name 'nlc-ci'
          git config user.email 'nlc-ci@users.noreply.github.com'
          git add src/runtime/tests.rs
          git commit -m 'test(workflow): pin covered-signal restart recovery'
          git push origin HEAD:test/workflow-signal-covered-snapshot-20261002
      - name: Run focused covered-signal restart proof
        run: cargo test --locked --lib test_signal_journal_survives_process_restart_when_snapshot_covers_signal -- --nocapture
