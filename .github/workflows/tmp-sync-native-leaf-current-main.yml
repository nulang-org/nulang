name: Temporary native-leaf current-main sync

on:
  push:
    branches:
      - perf/jit-native-leaf-fast-path
    paths:
      - .github/workflows/tmp-sync-native-leaf-current-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: perf/jit-native-leaf-fast-path
      - name: Configure git
        run: |
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
      - name: Merge current main and resolve known conflicts
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge --no-ff --no-edit origin/main; then
            python3 - <<'PY'
          from pathlib import Path

          mod = Path('src/jit/mod.rs')
          s = mod.read_text()
          s = s.replace(
              '''<<<<<<< HEAD\nuse region_planner::{native_leaf_plan, RegionPlanner};\n=======\nuse region_planner::{region_has_internal_back_edge, RegionPlanner};\n>>>>>>> origin/main''',
              '''use region_planner::{native_leaf_plan, region_has_internal_back_edge, RegionPlanner};'''
          )
          if '<<<<<<<' in s or '>>>>>>>' in s or '\n=======\n' in s:
              raise SystemExit('unresolved conflict remains in src/jit/mod.rs')
          mod.write_text(s)

          ch = Path('CHANGELOG.md')
          s = ch.read_text()
          s = s.replace(
              '''<<<<<<< HEAD\n### Native fast path for simple JIT direct calls — 2026-09-30\n- **Hot direct calls to simple, non-suspending, non-recursive leaf functions can now execute as native JIT callees instead of re-entering the interpreter.** Eligible callees are intentionally limited to straight-line scalar register code with an explicit return; branchy, effectful, recursive, indirect, heap/actor, and otherwise unsupported callees retain the existing safe fallback.\n- **Native leaf callees run against an isolated register buffer and copy back only the return value.** Caller registers are preserved, nested JIT thread-local state is saved across interpreter fallback, and leaf errors continue through the existing pending-error path.\n- **The existing `call_loop` JIT telemetry improves from the repository-history ~10.57 ms baseline to a 1.56 ms median warm run in a 20-run fixed-host probe (~6.8× faster), while all 55 focused JIT tests pass.**\n=======\n### Faster tier-2 promotion for native loop regions — 2026-09-30\n- **JIT-compiled regions with an internal back-edge now promote from the low-latency Cranelift tier on their first compiled re-entry.** A single native loop entry can perform arbitrarily many back-edge iterations, so the previous 10,000-entry tier-2 counter could leave genuinely hot loops on first-tier code indefinitely.\n- **Straight-line and already-optimized regions retain the existing tier-2 threshold.** The policy change is limited to first-tier internal loops so cold or call-heavy code does not pay unnecessary optimized-compilation latency.\n>>>>>>> origin/main''',
              '''### Native fast path for simple JIT direct calls — 2026-09-30\n- **Hot direct calls to simple, non-suspending, non-recursive leaf functions can now execute as native JIT callees instead of re-entering the interpreter.** Eligible callees are intentionally limited to straight-line scalar register code with an explicit return; branchy, effectful, recursive, indirect, heap/actor, and otherwise unsupported callees retain the existing safe fallback.\n- **Native leaf callees run against an isolated register buffer and copy back only the return value.** Caller registers are preserved, nested JIT thread-local state is saved across interpreter fallback, and leaf errors continue through the existing pending-error path.\n- **The existing `call_loop` JIT telemetry improves from the repository-history ~10.57 ms baseline to a 1.56 ms median warm run in a 20-run fixed-host probe (~6.8× faster), while all 55 focused JIT tests pass.**\n\n### Faster tier-2 promotion for native loop regions — 2026-09-30\n- **JIT-compiled regions with an internal back-edge now promote from the low-latency Cranelift tier on their first compiled re-entry.** A single native loop entry can perform arbitrarily many back-edge iterations, so the previous 10,000-entry tier-2 counter could leave genuinely hot loops on first-tier code indefinitely.\n- **Straight-line and already-optimized regions retain the existing tier-2 threshold.** The policy change is limited to first-tier internal loops so cold or call-heavy code does not pay unnecessary optimized-compilation latency.'''
          )
          if '<<<<<<<' in s or '>>>>>>>' in s or '\n=======\n' in s:
              raise SystemExit('unresolved conflict remains in CHANGELOG.md')
          ch.write_text(s)
          PY
            git add CHANGELOG.md src/jit/mod.rs
            git commit --no-edit
          fi
      - name: Validate merged JIT candidate
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --locked --no-default-features --features native-codegen
          cargo test --locked --no-default-features --features native-codegen --lib jit::tests -- --test-threads=1
      - name: Remove temporary workflow and push
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-sync-native-leaf-current-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): remove temporary native leaf sync workflow"
          fi
          git push origin HEAD:perf/jit-native-leaf-fast-path
