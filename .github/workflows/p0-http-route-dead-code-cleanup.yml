name: P0 HTTP Route Dead-Code Cleanup

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14
    paths:
      - .github/workflows/p0-http-route-dead-code-cleanup.yml

permissions:
  contents: write

jobs:
  land-validated-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Land previously validated HTTP cleanup only
        shell: bash
        run: |
          set -euo pipefail

          expected_http_sha='58d5a3998426562c2d9f40e54c173849216be8bd'
          expected_auth_sha='a3dde2d749edeb0ec893822f72112dbfceb61b75'
          current_http_sha="$(git rev-parse HEAD:src/runtime/http_server.rs)"
          current_auth_sha="$(git rev-parse HEAD:.github/workflows/p0-authority-spawn-ordering.yml)"
          test "$current_http_sha" = "$expected_http_sha"
          test "$current_auth_sha" = "$expected_auth_sha"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/http_server.rs')
          src = path.read_text()

          matcher_start_marker = '/// Match a route pattern against a request path, returning captured parameters.\n'
          matcher_end_marker = '/// Render a static route by calling its handler with no arguments.\n'
          assert src.count(matcher_start_marker) == 1
          assert src.count(matcher_end_marker) == 1
          matcher_start = src.index(matcher_start_marker)
          matcher_end = src.index(matcher_end_marker, matcher_start)
          src = src[:matcher_start] + src[matcher_end:]

          tests_start_marker = '    #[test]\n    fn test_match_route_exact() {\n'
          tests_end_marker = '    #[test]\n    fn test_parse_form_urlencoded() {\n'
          assert src.count(tests_start_marker) == 1
          assert src.count(tests_end_marker) == 1
          tests_start = src.index(tests_start_marker)
          tests_end = src.index(tests_end_marker, tests_start)
          src = src[:tests_start] + src[tests_end:]
          path.write_text(src)
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/runtime/http_server.rs'

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runtime/http_server.rs
          git commit -m 'fix(web): remove superseded route matcher'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
