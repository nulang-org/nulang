name: Pattern coverage integration

on:
  push:
    branches:
      - feat/pattern-exhaustiveness
    paths:
      - scripts/apply_pattern_coverage_integration.py
      - .github/workflows/pattern-coverage-integration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pattern-coverage-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pattern-exhaustiveness
          fetch-depth: 0

      - name: Apply exact-anchor integration patch
        run: python3 scripts/apply_pattern_coverage_integration.py

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting and diff hygiene
        run: |
          cargo fmt --all -- --check
          git diff --check

      - name: Focused pattern coverage tests
        run: |
          cargo test --lib pattern_coverage
          cargo test --test pattern_coverage_diagnostics

      - name: Compiler checks
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features

      - name: Commit validated integration and remove one-shot helpers
        run: |
          rm scripts/apply_pattern_coverage_integration.py
          rm .github/workflows/pattern-coverage-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire finite pattern coverage diagnostics"
          git push origin HEAD:feat/pattern-exhaustiveness
