name: Refresh rustls lockfile

# Temporary branch-local helper. Remove after Cargo.lock is refreshed.
on:
  push:
    branches: [chore/rustfmt-main-baseline]
    paths:
      - .github/workflows/refresh-rustls-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh rustls lock entry
        run: cargo update -p rustls@0.23.43 --precise 0.23.45

      - name: Verify narrow lockfile change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "Cargo.lock"
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): refresh rustls lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
