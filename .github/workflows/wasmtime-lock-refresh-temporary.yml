name: Resolve Wasmtime lockfile (temporary)
on:
  push:
    branches:
      - fix/wasmtime-rustsec-2026-0378-0379
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Resolve and check Cargo.lock
        run: |
          cargo update -p wasmtime --precise 48.0.7
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff -- Cargo.lock
      - name: Commit resolver output to the same temporary branch
        run: |
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): resolve full Wasmtime 48.0.7 graph with Cargo'
            git push origin "HEAD:fix/wasmtime-rustsec-2026-0378-0379"
          fi
