name: Validate Selective Receive Transaction

on:
  push:
    branches: [fix/selective-receive-transaction]

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/selective-receive-transaction
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply callback ownership transition and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          callbacks = Path('src/runtime/callbacks.rs')
          text = callbacks.read_text()

          old_runtime_try = '''        let (pos, payload) = rt
            .actors
            .get_mut(&actor_id)?
            .mailbox
            .receive_match(behavior_ids)?;
        // ORCA receiver protocol: hold heap pointers carried by the message.
        rt.hold_payload_refs(actor_id, &*payload);
        Some((
            pos,
            Arc::try_unwrap(payload).unwrap_or_else(|arc| (*arc).clone()),
        ))
'''
          new_runtime_try = '''        let (pos, payload) = rt
            .actors
            .get_mut(&actor_id)?
            .mailbox
            .receive_match(behavior_ids)?;
        // Reservation is speculative: the message stays queued and its
        // in-flight ownership protects pointer payloads while patterns/guards
        // run. Receiver-side ownership is established only on commit.
        Some((
            pos,
            Arc::try_unwrap(payload).unwrap_or_else(|arc| (*arc).clone()),
        ))
'''
          if text.count(old_runtime_try) != 1:
              raise SystemExit(f'RuntimeVmCallbacks try_receive_match pattern count: {text.count(old_runtime_try)}')
          text = text.replace(old_runtime_try, new_runtime_try, 1)

          old_runtime_commit = '''    fn commit_receive_match(&mut self) {
        let mut rt = self.runtime.borrow_mut();
        if let Some(actor_id) = rt.current_actor {
            if let Some(actor) = rt.actors.get_mut(&actor_id) {
                actor.mailbox.commit_receive_match();
            }
        }
    }
'''
          new_runtime_commit = '''    fn commit_receive_match(&mut self) {
        let mut rt = self.runtime.borrow_mut();
        if let Some(actor_id) = rt.current_actor {
            let payload = rt
                .actors
                .get_mut(&actor_id)
                .and_then(|actor| actor.mailbox.commit_receive_match());
            if let Some(payload) = payload {
                // Transfer from queued/in-flight ownership to exactly one
                // receiver hold only after pattern+guard success.
                rt.hold_payload_refs(actor_id, &payload);
            }
        }
    }
'''
          if text.count(old_runtime_commit) != 1:
              raise SystemExit(f'RuntimeVmCallbacks commit pattern count: {text.count(old_runtime_commit)}')
          text = text.replace(old_runtime_commit, new_runtime_commit, 1)

          old_bytecode_try = '''            let (pos, payload) = {
                let actor = (*self.runtime).actors.get_mut(&self.actor_id)?;
                actor.mailbox.receive_match(behavior_ids)?
            };
            // ORCA receiver protocol: hold heap pointers carried by the message.
            (*self.runtime).hold_payload_refs(self.actor_id, &*payload);
            Some((
                pos,
                Arc::try_unwrap(payload).unwrap_or_else(|arc| (*arc).clone()),
            ))
'''
          new_bytecode_try = '''            let (pos, payload) = {
                let actor = (*self.runtime).actors.get_mut(&self.actor_id)?;
                actor.mailbox.receive_match(behavior_ids)?
            };
            // Do not take an ORCA receiver hold for a speculative candidate.
            // The message remains queued until commit.
            Some((
                pos,
                Arc::try_unwrap(payload).unwrap_or_else(|arc| (*arc).clone()),
            ))
'''
          if text.count(old_bytecode_try) != 1:
              raise SystemExit(f'BytecodeRuntimeCallbacks try pattern count: {text.count(old_bytecode_try)}')
          text = text.replace(old_bytecode_try, new_bytecode_try, 1)

          old_bytecode_commit = '''    fn commit_receive_match(&mut self) {
        unsafe {
            if let Some(actor) = (*self.runtime).actors.get_mut(&self.actor_id) {
                actor.mailbox.commit_receive_match();
            }
        }
    }
'''
          new_bytecode_commit = '''    fn commit_receive_match(&mut self) {
        unsafe {
            let payload = (*self.runtime)
                .actors
                .get_mut(&self.actor_id)
                .and_then(|actor| actor.mailbox.commit_receive_match());
            if let Some(payload) = payload {
                // Commit is the ownership boundary: establish one receiver
                // hold only for the message that actually won the guard.
                (*self.runtime).hold_payload_refs(self.actor_id, &payload);
            }
        }
    }
'''
          if text.count(old_bytecode_commit) != 1:
              raise SystemExit(f'BytecodeRuntimeCallbacks commit pattern count: {text.count(old_bytecode_commit)}')
          text = text.replace(old_bytecode_commit, new_bytecode_commit, 1)
          callbacks.write_text(text)

          vm = Path('src/vm.rs')
          text = vm.read_text()
          old_doc = '''    /// Commit a selective receive: remove the matched ("tried") message from
    /// the skip-buffer and clear remaining "tried" flags. Called after a
    /// pattern+guard check succeeds. Default is a no-op (standalone VM has no
    /// skip-buffer).
    fn commit_receive_match(&mut self) {}
'''
          new_doc = '''    /// Commit the candidate reserved by the most recent selective receive.
    /// Runtime-backed implementations consume exactly that message and
    /// establish receiver-side ownership only after pattern+guard success.
    /// Default is a no-op for the standalone VM.
    fn commit_receive_match(&mut self) {}
'''
          if text.count(old_doc) != 1:
              raise SystemExit(f'VM commit doc pattern count: {text.count(old_doc)}')
          vm.write_text(text.replace(old_doc, new_doc, 1))

          gc = Path('src/runtime/gc.rs')
          text = gc.read_text()
          marker = '''    pub fn take_held_refs(&mut self) -> Vec<(u64, *mut OrcaHeader)> {
        std::mem::take(&mut self.held_foreign_refs)
    }
'''
          replacement = marker + '''
    #[cfg(test)]
    pub(crate) fn held_ref_count(&self) -> usize {
        self.held_foreign_refs.len()
    }
'''
          if text.count(marker) != 1:
              raise SystemExit(f'GC held-ref accessor insertion count: {text.count(marker)}')
          gc.write_text(text.replace(marker, replacement, 1))

          tests = Path('src/runtime/tests.rs')
          text = tests.read_text()
          if 'selective_receive_rejected_pointer_candidate_takes_no_hold' in text:
              raise SystemExit('selective receive ownership tests already present')
          text += r'''

// ========================================================================
// Transactional selective receive / ORCA ownership regressions (#143)
// ========================================================================

fn selective_receive_pointer_fixture() -> (Runtime, u64, u64, *mut u8) {
    let mut rt = Runtime::new();
    let owner = rt.spawn_actor(Box::new(|| vec![]));
    let receiver = rt.spawn_actor(Box::new(|| vec![]));
    let ptr = rt
        .actors
        .get_mut(&owner)
        .expect("owner actor")
        .heap
        .alloc(std::mem::size_of::<Value>(), TypeTag::Raw)
        .expect("owner heap allocation");
    rt.send_message_by_id(receiver, 0, &[Value::ptr(ptr)]);
    (rt, owner, receiver, ptr)
}

#[test]
fn selective_receive_rejected_pointer_candidate_takes_no_hold() {
    use crate::vm::ActorVmCallbacks;

    let (mut rt, _owner, receiver, ptr) = selective_receive_pointer_fixture();
    let before = unsafe { (*ActorHeap::header_of(ptr)).foreign_count };
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);

    let mut callbacks = BytecodeRuntimeCallbacks::new(&mut rt as *mut Runtime, receiver);
    let first = callbacks
        .try_receive_match(&[0])
        .expect("pointer-bearing candidate");
    assert_eq!(first.1[0].as_ptr(), Some(ptr));
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, before);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);

    // A second scan represents guard rejection of the first candidate. The
    // same queued message must be skipped, not re-held.
    assert!(callbacks.try_receive_match(&[0]).is_none());
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, before);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);

    callbacks.reset_receive_match();
    assert!(callbacks.try_receive_match(&[0]).is_some());
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, before);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);
}

#[test]
fn selective_receive_commit_establishes_exactly_one_receiver_hold() {
    use crate::vm::ActorVmCallbacks;

    let (mut rt, _owner, receiver, ptr) = selective_receive_pointer_fixture();
    let before = unsafe { (*ActorHeap::header_of(ptr)).foreign_count };

    let mut callbacks = BytecodeRuntimeCallbacks::new(&mut rt as *mut Runtime, receiver);
    assert!(callbacks.try_receive_match(&[0]).is_some());
    callbacks.commit_receive_match();

    assert_eq!(rt.actors[&receiver].mailbox.len(), 0);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 1);
    assert_eq!(
        unsafe { (*ActorHeap::header_of(ptr)).foreign_count },
        before + 1,
        "commit adds one receiver hold"
    );

    // Settle the original in-flight send, leaving only the receiver hold.
    rt.process_gc_ops();
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, 1);
    rt.release_held_foreign_refs(receiver);
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, 0);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);
}

#[test]
fn selective_receive_reset_preserves_pointer_ownership_and_message() {
    use crate::vm::ActorVmCallbacks;

    let (mut rt, _owner, receiver, ptr) = selective_receive_pointer_fixture();
    let before = unsafe { (*ActorHeap::header_of(ptr)).foreign_count };

    let mut callbacks = BytecodeRuntimeCallbacks::new(&mut rt as *mut Runtime, receiver);
    assert!(callbacks.try_receive_match(&[0]).is_some());
    callbacks.reset_receive_match();

    assert_eq!(rt.actors[&receiver].mailbox.len(), 1);
    assert_eq!(rt.actors[&receiver].orca_gc.held_ref_count(), 0);
    assert_eq!(unsafe { (*ActorHeap::header_of(ptr)).foreign_count }, before);
    assert!(callbacks.try_receive_match(&[0]).is_some());
}
'''
          tests.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Mailbox transaction tests
        run: |
          cargo test rejected_candidate_stays_queued_and_commit_consumes_current_candidate
          cargo test reset_makes_rejected_candidate_visible_without_consuming_it
          cargo test system_local_and_normal_candidates_share_commit_semantics

      - name: ORCA ownership tests
        run: |
          cargo test selective_receive_rejected_pointer_candidate_takes_no_hold
          cargo test selective_receive_commit_establishes_exactly_one_receiver_hold
          cargo test selective_receive_reset_preserves_pointer_ownership_and_message

      - name: Validate minimal all-targets build
        run: cargo check --all-targets --no-default-features

      - name: Validate default all-targets build
        run: cargo check --all-targets

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(runtime): commit selective receive ownership transactionally'
          git push origin HEAD:fix/selective-receive-transaction
