name: Apply Transactional Selective Receive

on:
  push:
    branches: [fix/selective-receive-transactional]
    paths:
      - .github/workflows/apply-selective-receive-transaction.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/selective-receive-transactional
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply fail-closed transaction transform
        run: python3 .github/sev1/apply-selective-receive-transaction.py

      - name: Format
        run: cargo fmt --all

      - name: Mailbox transaction regressions
        run: cargo test --lib transactional_receive_tests -- --nocapture

      - name: Existing mailbox regressions
        run: cargo test --lib runtime::mailbox::tests -- --nocapture

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Lint default runtime
        run: cargo clippy --lib -- -D warnings

      - name: Reject whitespace damage
        run: git diff --check

      - name: Remove one-shot machinery
        run: |
          git rm .github/sev1/apply-selective-receive-transaction.py
          git rm .github/workflows/apply-selective-receive-transaction.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation diff produced."
            exit 1
          fi
          git commit -m "fix(runtime): make selective receive transactional"
          git push origin HEAD:fix/selective-receive-transactional
