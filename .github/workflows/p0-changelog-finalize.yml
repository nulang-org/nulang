name: P0 Changelog Finalize

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14

concurrency:
  group: p0-changelog-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Pin branch head
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Insert P0 stabilization changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "### Added since 1.0.0-frozen — 2026-09-14 (web contract + capacity broker hardening)\n"
          heading = "### Added since 1.0.0-frozen — 2026-09-15 (P0 runtime authority stabilization)"
          assert text.count(marker) == 1, "expected one 2026-09-14 stable-tier marker"
          assert heading not in text, "P0 changelog entry already exists"
          block = "\n".join([
              heading,
              "- **Runtime authority and value-provenance hardening** (`src/runtime/`, `src/vm.rs`, `src/mir_codegen.rs`). Actor spawn authority is now enforced fail-closed across VM/native/host boundaries, preserved through durable recovery and migration, and installed on workflow actors before their first durable checkpoint. Legacy pre-authority recovery remains deny-by-default. Raw `Value` reconstruction and pointer construction now require explicit trusted/unsafe boundaries so untrusted persisted, FFI, and Wasm bits cannot manufacture pointer-tagged values.",
              "- **Exact spawn-site authority metadata** (`src/mir_codegen.rs`, `tests/spawn_authority_provenance.rs`). Spawn metadata emitted while compiling an isolated function is relocated from function-local PCs to module-absolute PCs before publication, matching the VM's runtime `Spawn` program counter. A non-zero-function-base regression prevents local-PC metadata from silently passing again.",
              "- **Explicit AI inference authority** (`src/integration_tests/mod.rs`). Actor- and workflow-backed inference fixtures now request `Inference::Ask` at the exact spawn site instead of relying on ambient authority. Restart/redrive, semantic-memory, pipeline, supervisor, debate, and suspended-inference paths retain their behavior under the explicit grant model.",
              "- **Transactional actor ownership stabilization** (`src/runtime/`). Selective receive and ORCA ownership transfers use transactional bookkeeping so failed or unmatched receive paths do not leak ownership state while successful delivery preserves the intended transfer semantics.",
              "",
              "",
          ])
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf 'working-tree paths:\n%s\n' "$changed"
          test "$changed" = 'CHANGELOG.md'

      - name: Guard head, self-remove, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-stabilization-2026-09-14
          remote_head="$(git rev-parse origin/integration/p0-stabilization-2026-09-14)"
          if [ "$remote_head" != "$START_HEAD" ]; then
            echo "integration branch advanced during changelog validation: $remote_head (expected $START_HEAD)" >&2
            exit 1
          fi
          rm .github/workflows/p0-changelog-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/p0-changelog-finalize.yml
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          printf 'staged paths:\n%s\n' "$staged"
          expected="$(printf '%s\n%s' '.github/workflows/p0-changelog-finalize.yml' 'CHANGELOG.md')"
          test "$staged" = "$expected"
          git commit -m 'docs(changelog): record P0 runtime authority stabilization'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
