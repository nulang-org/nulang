name: Temporary NuDB manifest-v2 store compatibility fix

on:
  push:
    branches:
      - feat/nudb-manifest-v2-format-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nudb-manifest-v2-format-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch v1 serving for manifest v2
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/database/store.rs')
          text = path.read_text()

          old = 'use super::manifest::{Manifest, ManifestEntry, ManifestError};\n'
          new = 'use super::manifest::{Manifest, ManifestEntry, ManifestError, SstableFormat, SstableIntegrity};\n'
          if text.count(old) != 1:
              raise SystemExit('manifest import anchor mismatch')
          text = text.replace(old, new)

          old = '''        for entry in manifest.entries() {
            let path = sstable_dir.join(&entry.file_name);
            let table = IndexedSstable::open(&path)?;
'''
          new = '''        for entry in manifest.entries() {
            if entry.format != SstableFormat::V1 {
                return Err(WalBackedError::ManifestSstableMismatch(
                    entry.file_name.clone(),
                ));
            }
            let expected_checksum = match entry.integrity {
                SstableIntegrity::WholePayloadBlake3(checksum) => checksum,
                SstableIntegrity::FooterBlake3(_) => {
                    return Err(WalBackedError::ManifestSstableMismatch(
                        entry.file_name.clone(),
                    ));
                }
            };
            let path = sstable_dir.join(&entry.file_name);
            let table = IndexedSstable::open(&path)?;
'''
          if text.count(old) != 1:
              raise SystemExit('manifest open anchor mismatch')
          text = text.replace(old, new)

          old = '                || metadata.checksum != entry.checksum\n'
          new = '                || metadata.checksum != expected_checksum\n'
          if text.count(old) != 1:
              raise SystemExit('checksum comparison anchor mismatch')
          text = text.replace(old, new)

          old = '''            min_key: metadata.min_key.clone(),
            max_key: metadata.max_key.clone(),
            checksum: metadata.checksum,
'''
          new = '''            min_key: metadata.min_key.clone(),
            max_key: metadata.max_key.clone(),
            format: SstableFormat::V1,
            integrity: SstableIntegrity::WholePayloadBlake3(metadata.checksum),
'''
          if text.count(old) != 1:
              raise SystemExit('manifest entry anchor mismatch')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Compile batch WAL gate
        run: cargo test --locked --no-default-features --test nudb_wal_batch --no-run
      - name: Commit compatibility fix
        run: |
          rm .github/workflows/nudb-manifest-v2-store-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/database/store.rs .github/workflows/nudb-manifest-v2-store-fix-temp.yml
          git commit -m "fix(database): bridge v1 serving to manifest v2"
          git push origin HEAD:feat/nudb-manifest-v2-format-contract
