name: Temporary #1237 capability fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/package-capability-forwarding-current-main-20261002' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/package-capability-forwarding-current-main-20261002
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact current-main capability hunk
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/package/commands.rs')
          old = path.read_text(encoding='utf-8')
          target = '    nulang_exe(&["--backend", "wasm-aot", "--out", &wasm_path_str, &entry_str])?;\n'
          replacement = (
              '    let caps = capability_args();\n'
              '    let cap_refs: Vec<&str> = caps.iter().map(|s| s.as_str()).collect();\n'
              '    nulang_exe(\n'
              '        &[\n'
              '            &["--backend", "wasm-aot", "--out", &wasm_path_str, &entry_str],\n'
              '            &cap_refs[..],\n'
              '        ]\n'
              '        .concat(),\n'
              '    )?;\n'
          )
          assert old.count(target) == 1, 'expected exactly one current-main build-wasm invocation'
          path.write_text(old.replace(target, replacement, 1), encoding='utf-8')

      - name: Add changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('CHANGELOG.md')
          old = path.read_text(encoding='utf-8')
          marker = '# Nulang Changelog\n'
          heading = '### Package WASM capability forwarding — 2026-10-02'
          assert old.startswith(marker), 'unexpected changelog header'
          assert heading not in old, 'entry already present'
          entry = '''### Package WASM capability forwarding — 2026-10-02
          - **`nula build-wasm` now forwards manifest-declared `[package].capabilities` to the compiler just like normal package build and run paths.** Resource-gated WASM packages therefore retain the package authority declared in `Nulang.toml` instead of failing compilation because the AOT invocation silently dropped `--with` grants.
          - **A `wasm-backend` integration regression pins the boundary with a `net`-gated `Http.get` package and requires the expected `.wasm` artifact.** No new capability syntax or backend-specific authority model is introduced.

          '''
          path.write_text(marker + entry + old[len(marker):], encoding='utf-8')

      - name: Verify focused regression
        run: |
          set -euxo pipefail
          cargo fmt --all -- --check
          cargo test --locked --features wasm-backend --test package_build_wasm_capabilities

      - name: Remove temporary workflow and verify diff
        run: |
          set -euxo pipefail
          git rm .github/workflows/tmp-1237-capability-fix.yml
          git diff HEAD --check
          test "$(git diff HEAD --name-only | sort)" = $'.github/workflows/tmp-1237-capability-fix.yml\nCHANGELOG.md\nsrc/package/commands.rs'
          test "$(git diff HEAD --numstat -- src/package/commands.rs | cut -f2)" = "1"
          test "$(git diff HEAD --numstat -- CHANGELOG.md | cut -f2)" = "0"

      - name: Commit exact patch
        run: |
          set -euxo pipefail
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached HEAD --name-only | sort)" = $'.github/workflows/tmp-1237-capability-fix.yml\nCHANGELOG.md\nsrc/package/commands.rs'
          git commit -m "fix(package): forward capabilities to build-wasm"
          git push origin HEAD:fix/package-capability-forwarding-current-main-20261002
