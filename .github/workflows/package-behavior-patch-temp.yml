name: Stage package Behavior Manifest integration

on:
  push:
    branches:
      - automation/package-behavior-manifest-build

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/package-behavior-manifest-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Give the integrated compiler build an explicit, scoped resolver context.
          replace_once(
              "src/behavior_build.rs",
              "    pub compiler_bytes: &'a [u8],\n    pub with_capabilities: &'a [String],",
              "    pub compiler_bytes: &'a [u8],\n    /// Optional package dependency mapping in NULANG_MODULE_PATH format.\n    /// Supplying it here keeps package compilation independent of process-wide\n    /// environment mutation.\n    pub module_path: Option<&'a str>,\n    /// Optional stdlib directory for deterministic package builds.\n    pub stdlib_dir: Option<&'a Path>,\n    pub with_capabilities: &'a [String],",
          )
          replace_once(
              "src/behavior_build.rs",
              "        input.source_path,\n        input.with_capabilities,\n        input.deny_warnings,",
              "        input.source_path,\n        input.module_path,\n        input.stdlib_dir,\n        input.with_capabilities,\n        input.deny_warnings,",
          )
          replace_once(
              "src/behavior_build.rs",
              "    source_path: &Path,\n    with_capabilities: &[String],",
              "    source_path: &Path,\n    module_path: Option<&str>,\n    stdlib_dir: Option<&Path>,\n    with_capabilities: &[String],",
          )
          replace_once(
              "src/behavior_build.rs",
              "    let imported_sources =\n        crate::resolver::resolve_imports_with_sources(&mut ast, source_path, &mut stack)?;",
              "    let imported_sources = crate::resolver::with_resolution_context(\n        module_path,\n        stdlib_dir,\n        || crate::resolver::resolve_imports_with_sources(&mut ast, source_path, &mut stack),\n    )?;",
          )
          p = Path("src/behavior_build.rs")
          text = p.read_text()
          old = '            compiler_bytes: b"compiler",\n            with_capabilities: &[],'
          new = '            compiler_bytes: b"compiler",\n            module_path: None,\n            stdlib_dir: None,\n            with_capabilities: &[],'
          if new not in text:
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"expected two BehaviorBuildInput test anchors, found {count}")
              p.write_text(text.replace(old, new))

          replace_once(
              "src/bin/nulang_behavior_build.rs",
              "            compiler_bytes: &compiler_bytes,\n            with_capabilities: &options.grants,",
              "            compiler_bytes: &compiler_bytes,\n            module_path: None,\n            stdlib_dir: None,\n            with_capabilities: &options.grants,",
          )

          # Resolver context is thread-local: compiler tests can resolve packages in
          # parallel without racing over NULANG_MODULE_PATH / NULANG_STDLIB.
          replace_once(
              "src/resolver.rs",
              "    static IMPORT_SOURCES: RefCell<BTreeMap<PathBuf, Vec<u8>>> = const { RefCell::new(BTreeMap::new()) };\n}",
              "    static IMPORT_SOURCES: RefCell<BTreeMap<PathBuf, Vec<u8>>> = const { RefCell::new(BTreeMap::new()) };\n    static MODULE_PATH_OVERRIDE: RefCell<Option<String>> = const { RefCell::new(None) };\n    static STDLIB_DIR_OVERRIDE: RefCell<Option<PathBuf>> = const { RefCell::new(None) };\n}\n\nstruct ResolutionContextGuard {\n    previous_module_path: Option<String>,\n    previous_stdlib_dir: Option<PathBuf>,\n}\n\nimpl Drop for ResolutionContextGuard {\n    fn drop(&mut self) {\n        MODULE_PATH_OVERRIDE.with(|slot| {\n            slot.replace(self.previous_module_path.take());\n        });\n        STDLIB_DIR_OVERRIDE.with(|slot| {\n            slot.replace(self.previous_stdlib_dir.take());\n        });\n    }\n}\n\n/// Run resolver work with package-specific import locations without mutating\n/// process-global environment variables. Overrides are scoped to this thread\n/// and restored on success, error, or unwinding.\npub fn with_resolution_context<T>(\n    module_path: Option<&str>,\n    stdlib_dir: Option<&Path>,\n    f: impl FnOnce() -> NuResult<T>,\n) -> NuResult<T> {\n    let previous_module_path =\n        MODULE_PATH_OVERRIDE.with(|slot| slot.replace(module_path.map(str::to_owned)));\n    let previous_stdlib_dir =\n        STDLIB_DIR_OVERRIDE.with(|slot| slot.replace(stdlib_dir.map(Path::to_path_buf)));\n    let _guard = ResolutionContextGuard {\n        previous_module_path,\n        previous_stdlib_dir,\n    };\n    f()\n}",
          )
          replace_once(
              "src/resolver.rs",
              "        let module_path = module.replace(\"::\", std::path::MAIN_SEPARATOR_STR);\n        // Try NULANG_STDLIB env var first",
              "        let module_path = module.replace(\"::\", std::path::MAIN_SEPARATOR_STR);\n        if let Some(dir) = STDLIB_DIR_OVERRIDE.with(|slot| slot.borrow().clone()) {\n            return dir.join(format!(\"{}.nula\", module_path));\n        }\n        // Try NULANG_STDLIB env var first",
          )
          replace_once(
              "src/resolver.rs",
              "    let entries = std::env::var(\"NULANG_MODULE_PATH\").unwrap_or_default();",
              "    let entries = MODULE_PATH_OVERRIDE\n        .with(|slot| slot.borrow().clone())\n        .unwrap_or_else(|| std::env::var(\"NULANG_MODULE_PATH\").unwrap_or_default());",
          )

          # Replace the legacy child-process package build with the shared checked
          # compilation path. The exact post-resolution lockfile and actual `nula`
          # executable bytes are bound into manifest provenance.
          commands = Path("src/package/commands.rs")
          text = commands.read_text()
          start_marker = "/// `nula build-wasm`: compile package to .wasm + AOT .cwasm."
          end_marker = "/// `nula run`: build, then execute the entry point."
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate cmd_build_wasm replacement range")
          if "Compiling {} to WASM + Behavior Manifest..." not in text[start:end]:
              replacement = r'''/// Locate the stdlib used by this compiler invocation so an in-process
          /// package build resolves `stdlib::*` exactly as the child CLI path did.
          #[cfg(feature = "wasm-backend")]
          fn behavior_build_stdlib_dir() -> Option<PathBuf> {
              if let Some(path) = std::env::var_os("NULANG_STDLIB").map(PathBuf::from) {
                  if path.is_dir() {
                      return Some(path);
                  }
              }
              if let Ok(exe) = std::env::current_exe() {
                  if let Some(exe_dir) = exe.parent() {
                      let candidate = exe_dir.join("stdlib");
                      if candidate.is_dir() {
                          return Some(candidate);
                      }
                  }
              }
              let development = PathBuf::from(env!("CARGO_MANIFEST_DIR"))
                  .join("src")
                  .join("stdlib");
              development.is_dir().then_some(development)
          }

          /// `nula build-wasm`: resolve the package once, then emit `.wasm`,
          /// `.behavior.json`, and machine-local `.cwasm` artifacts. The Wasm and
          /// Behavior Manifest are produced from the same checked compilation unit.
          #[cfg(feature = "wasm-backend")]
          fn cmd_build_wasm() -> NuResult<()> {
              let root = package_root()?;
              let manifest_path = root.join(MANIFEST_FILE);
              let manifest = Manifest::load(&root).map_err(|e| NuError::PackageError {
                  msg: format!("failed to load {}: {}", manifest_path.display(), e),
                  span: Span::default(),
              })?;
              let name = manifest.package.name.clone();
              let version = manifest.package.version.clone();
              let capabilities = manifest.package.capabilities.clone();

              // Resolution writes the canonical lockfile. Read it only afterwards so
              // provenance is bound to the exact dependency graph used by this build.
              let entry = prepare_package()?;
              let lock_path = root.join(LOCKFILE_FILE);
              let dependency_bytes = std::fs::read(&lock_path).map_err(|e| NuError::PackageError {
                  msg: format!("cannot read {}: {}", lock_path.display(), e),
                  span: Span::default(),
              })?;

              let compiler_path = std::env::current_exe().map_err(|e| NuError::PackageError {
                  msg: format!("cannot locate current compiler executable: {}", e),
                  span: Span::default(),
              })?;
              let compiler_bytes =
                  std::fs::read(&compiler_path).map_err(|e| NuError::PackageError {
                      msg: format!("cannot read compiler {}: {}", compiler_path.display(), e),
                      span: Span::default(),
                  })?;

              let mut module_path = std::env::var("NULANG_MODULE_PATH").unwrap_or_default();
              if let Some(computed) = build_module_path() {
                  if !module_path.is_empty() {
                      module_path.push(';');
                  }
                  module_path.push_str(&computed);
              }
              let module_path = (!module_path.is_empty()).then_some(module_path);
              let stdlib_dir = behavior_build_stdlib_dir();

              let dist_dir = root.join(".nula").join("dist");
              std::fs::create_dir_all(&dist_dir).map_err(|e| NuError::PackageError {
                  msg: format!("cannot create {}: {}", dist_dir.display(), e),
                  span: Span::default(),
              })?;
              let wasm_path = dist_dir.join(format!("{}.wasm", name));
              let behavior_path = dist_dir.join(format!("{}.behavior.json", name));
              let cwasm_path = dist_dir.join(format!("{}.cwasm", name));

              eprintln!("Building {} (WASM AOT)...", name);
              eprintln!(
                  "  Compiling {} to WASM + Behavior Manifest...",
                  entry.display()
              );
              let output = crate::behavior_build::compile_wasm_behavior(
                  crate::behavior_build::BehaviorBuildInput {
                      source_path: &entry,
                      package_name: &name,
                      package_version: &version,
                      dependency_bytes: &dependency_bytes,
                      compiler_implementation: "nulang-rust",
                      compiler_version: env!("CARGO_PKG_VERSION"),
                      compiler_bytes: &compiler_bytes,
                      module_path: module_path.as_deref(),
                      stdlib_dir: stdlib_dir.as_deref(),
                      with_capabilities: &capabilities,
                      deny_warnings: false,
                  },
              )
              .map_err(|e| NuError::PackageError {
                  msg: format!("WASM behavior build failed: {}", e),
                  span: Span::default(),
              })?;

              std::fs::write(&wasm_path, &output.wasm_bytes).map_err(|e| NuError::PackageError {
                  msg: format!("cannot write {}: {}", wasm_path.display(), e),
                  span: Span::default(),
              })?;
              let behavior_json =
                  output
                      .manifest
                      .to_canonical_json()
                      .map_err(|e| NuError::PackageError {
                          msg: format!("cannot serialize Behavior Manifest: {}", e),
                          span: Span::default(),
                      })?;
              std::fs::write(&behavior_path, behavior_json).map_err(|e| NuError::PackageError {
                  msg: format!("cannot write {}: {}", behavior_path.display(), e),
                  span: Span::default(),
              })?;

              let wasm_path_string = wasm_path.to_string_lossy().into_owned();
              let cwasm_path_string = cwasm_path.to_string_lossy().into_owned();
              crate::wasm_runtime::aot_compile(&wasm_path_string, &cwasm_path_string).map_err(|e| {
                  NuError::PackageError {
                      msg: format!("AOT compilation failed: {}", e),
                      span: Span::default(),
                  }
              })?;

              println!("WASM AOT build succeeded.");
              println!("  {}", wasm_path.display());
              println!("  {}", behavior_path.display());
              println!("  {}", cwasm_path.display());
              Ok(())
          }

          /// A build without the Wasm backend cannot uphold the command contract:
          /// emitting legacy Wasm without its checked Behavior Manifest would be a
          /// fail-open downgrade.
          #[cfg(not(feature = "wasm-backend"))]
          fn cmd_build_wasm() -> NuResult<()> {
              Err(NuError::PackageError {
                  msg: "nula build-wasm requires the 'wasm-backend' feature so Wasm and its Behavior Manifest are emitted atomically".to_string(),
                  span: Span::default(),
              })
          }

          '''
              commands.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check package integration
        run: cargo check --features wasm-backend --all-targets
      - name: Run focused integrated-build tests
        run: cargo test --features wasm-backend behavior_build::tests --lib
      - name: Commit staged implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/behavior_build.rs src/bin/nulang_behavior_build.rs src/resolver.rs src/package/commands.rs
          git commit -m "feat: emit package Behavior Manifest with wasm builds"
          git push origin HEAD:automation/package-behavior-manifest-build
