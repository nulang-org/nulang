name: Cold JIT minimal-build fix

on:
  push:
    branches:
      - perf/cold-jit-probe-call-gate-20261003

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'apply minimal-build JIT gate fallback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add non-native candidate fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/vm.rs")
          source = path.read_text(encoding="utf-8")
          anchor = (
              '    #[cfg(feature = "native-codegen")]\n'
              '    #[inline(always)]\n'
              '    fn jit_candidate_for_frame(&self, frame_idx: usize) -> bool {\n'
              '        let frame = &self.frames[frame_idx];\n'
              '        self.jit_candidate_pcs\n'
              '            .get(frame.module_idx)\n'
              '            .and_then(|row| row.get(frame.pc))\n'
              '            .copied()\n'
              '            .unwrap_or(false)\n'
              '    }\n'
          )
          replacement = anchor + (
              '\n'
              '    #[cfg(not(feature = "native-codegen"))]\n'
              '    #[inline(always)]\n'
              '    fn jit_candidate_for_frame(&self, _frame_idx: usize) -> bool {\n'
              '        false\n'
              '    }\n'
          )
          assert source.count(anchor) == 1, "unexpected candidate helper anchor"
          path.write_text(source.replace(anchor, replacement, 1), encoding="utf-8")
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Run source regression
        run: python3 -m unittest scripts.tests.test_jit_cold_probe_gate
      - name: Verify minimal build
        run: cargo check --locked --no-default-features
      - name: Commit implementation
        run: |
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/vm.rs
          git diff --cached --check
          git commit -m "fix(vm): preserve minimal-build JIT gate semantics [minimal-fallback-applied]"
          git push
