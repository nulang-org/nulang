name: Apply authority native conformance

on:
  push:
    branches:
      - feat/authority-native-conformance

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[authority-native-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertion-heavy patch
        run: python3 scripts/apply_authority_native_conformance.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run spawn authority conformance tests
        run: cargo test --test spawn_authority_provenance -- --nocapture

      - name: Run authority unit tests
        run: cargo test --lib authority -- --nocapture

      - name: Check library
        run: cargo check --lib

      - name: Check all targets
        run: cargo check --all-targets

      - name: Commit validated implementation
        run: |
          rm scripts/apply_authority_native_conformance.py
          rm .github/workflows/apply-authority-native-conformance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): enforce native exact-site conformance [authority-native-applied]"
          git push origin HEAD:feat/authority-native-conformance
