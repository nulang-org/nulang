name: Apply authority native conformance

on:
  push:
    branches:
      - feat/authority-native-conformance

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[authority-native-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertion-heavy patch
        run: python3 scripts/apply_authority_native_conformance.py

      - name: Expose narrow spawn authority bridge to sibling backends
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_mod = Path("src/runtime/mod.rs")
          text = runtime_mod.read_text()
          needle = "mod spawn;\n"
          if text.count(needle) != 1:
              raise SystemExit(f"runtime spawn module declaration drift: {text.count(needle)}")
          text = text.replace(
              needle,
              needle + "pub(crate) use spawn::spawn_from_module_with_authority;\n",
              1,
          )
          runtime_mod.write_text(text)

          aot_mod = Path("src/aot/mod.rs")
          text = aot_mod.read_text()
          old = "crate::runtime::spawn::spawn_from_module_with_authority("
          new = "crate::runtime::spawn_from_module_with_authority("
          if text.count(old) != 1:
              raise SystemExit(f"native spawn authority call drift: {text.count(old)}")
          aot_mod.write_text(text.replace(old, new, 1))
          PY

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run spawn authority conformance tests
        run: cargo test --test spawn_authority_provenance -- --nocapture

      - name: Run authority unit tests
        run: cargo test --lib authority -- --nocapture

      - name: Check library
        run: cargo check --lib

      - name: Check all targets
        run: cargo check --all-targets

      - name: Commit validated implementation
        run: |
          rm scripts/apply_authority_native_conformance.py
          rm .github/workflows/apply-authority-native-conformance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): enforce native exact-site conformance [authority-native-applied]"
          git push origin HEAD:feat/authority-native-conformance
