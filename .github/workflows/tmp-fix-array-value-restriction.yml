name: Temporary array value restriction fix

on:
  push:
    branches:
      - codex/orca-invariants

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/orca-invariants
          fetch-depth: 0

      - name: Apply one-line value restriction fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/types.rs')
          text = path.read_text()
          old = '            Type::Array(t) => t.collect_ref_free_vars(acc),\n'
          new = '            Type::Array(t) => t.collect_free_vars(acc),\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target line, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --numstat -- src/types.rs | awk '{print $1+$2}')" = "2"

      - name: Verify focused regression matrix
        run: |
          cargo test --locked --test orca_type_invariants --no-default-features
          cargo test --locked --test orca_type_invariants
          cargo test --locked --features wasm-backend --test orca_type_invariants
          cargo fmt --check

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'nulang-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/tmp-fix-array-value-restriction.yml
          git add src/types.rs
          git commit -m 'fix(typechecker): value-restrict mutable arrays'
          git push origin HEAD:codex/orca-invariants
