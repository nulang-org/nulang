name: Rebase Validated P0 Onto Current Main

on:
  push:
    branches:
      - ops/rebase-p0-current-main

permissions:
  contents: write

concurrency:
  group: rebase-p0-current-main
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Merge current main fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main integration/p0-stabilization-2026-09-14
          START_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          printf '%s\n' "$START_HEAD" > /tmp/p0-start-head
          printf '%s\n' "$MAIN_HEAD" > /tmp/main-start-head
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git merge --no-commit --no-ff origin/main; then
            echo 'Merge conflicts detected:'
            git status --short
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            git diff --cc | tee /tmp/conflicts.patch
            exit 1
          fi

          echo "Validated P0 source: $START_HEAD"
          echo "Current main source: $MAIN_HEAD"
          git status --short

      - name: Normalize and verify formatting
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          git diff --check

      - name: Validate build matrix
        run: |
          set -euo pipefail
          cargo +1.95.0 check --all-targets --no-default-features
          cargo +1.95.0 check --all-targets
          cargo +1.95.0 check --all-targets --all-features

      - name: Validate P0 regressions
        run: |
          set -euo pipefail
          cargo +1.95.0 test --test raw_value_provenance
          cargo +1.95.0 test --doc
          cargo +1.95.0 test --lib host_authority
          cargo +1.95.0 test --lib authority
          cargo +1.95.0 test --test spawn_authority_provenance
          cargo +1.95.0 test --lib selective_receive
          cargo +1.95.0 test --lib orca

      - name: Validate current-main web and capacity changes
        run: |
          set -euo pipefail
          cargo +1.95.0 test --lib web::
          cargo +1.95.0 test -p nulang-capacity

      - name: Commit and push with stale-head protection
        shell: bash
        run: |
          set -euo pipefail
          START_HEAD="$(cat /tmp/p0-start-head)"
          MAIN_HEAD="$(cat /tmp/main-start-head)"
          git fetch origin main integration/p0-stabilization-2026-09-14
          test "$(git rev-parse origin/integration/p0-stabilization-2026-09-14)" = "$START_HEAD" || {
            echo 'P0 branch advanced during validation; refusing stale push.'
            exit 1
          }
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD" || {
            echo 'main advanced during validation; refusing stale push.'
            exit 1
          }
          git add -A
          git diff --cached --check
          git commit -m 'chore: merge current main into P0 stabilization'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
