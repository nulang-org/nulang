name: P0 Agent Spawn Authority Diagnostic

on:
  push:
    branches:
      - ops/rebase-p0-current-main

permissions:
  contents: read

concurrency:
  group: rebase-p0-current-main
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: p0-agent-authority-diag
          cache-on-failure: true

      - name: Stage exact failing fixture authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/integration_tests/mod.rs')
          text = path.read_text()
          name = 'test_agent_workflow_recovers_semantic_memory_after_restart'
          marker = f'fn {name}()'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('missing target test')
          next_candidates = [p for p in (
              text.find('\n    #[test]', start + len(marker)),
              text.find('\n    #[cfg(', start + len(marker)),
          ) if p >= 0]
          end = min(next_candidates) if next_candidates else len(text)
          segment = text[start:end]
          pattern = re.compile(r'(spawn\s+[A-Za-z_][A-Za-z0-9_]*\s+\{[^{}]*\})(?!\s+with\s*\[)', re.S)
          migrated, count = pattern.subn(r'\1 with [Inference::Ask]', segment)
          if count != 1:
              raise SystemExit(f'expected one spawn migration, got {count}')
          print('P0_AUTH migrated source contains grant=', 'with [Inference::Ask]' in migrated)
          path.write_text(text[:start] + migrated + text[end:])
          PY

      - name: Instrument spawn authority locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          callbacks = Path('src/runtime/callbacks.rs')
          text = callbacks.read_text()
          needle = '''    let requested = match crate::authority_runtime::spawn_authority_manifest(module, spawn_pc) {\n        Ok(manifest) => manifest,'''
          repl = '''    eprintln!("P0_AUTH spawn_pc={} metadata={:?}", spawn_pc, module.spawn_capability_grants);\n    let requested = match crate::authority_runtime::spawn_authority_manifest(module, spawn_pc) {\n        Ok(manifest) => {\n            eprintln!("P0_AUTH requested={:?}", manifest.canonical_tokens());\n            manifest\n        },'''
          if text.count(needle) != 1:
              raise SystemExit('spawn authority shape changed')
          text = text.replace(needle, repl, 1)

          needle = '''    fn complete_llm(&mut self, model: &str, prompt: &str) -> Option<String> {\n        unsafe {\n            let rt = &mut *self.runtime;'''
          repl = '''    fn complete_llm(&mut self, model: &str, prompt: &str) -> Option<String> {\n        unsafe {\n            let rt = &mut *self.runtime;\n            let caps = rt.actors.get(&self.actor_id).map(|a| a.capabilities.clone());\n            let auth = authorize_actor_host_effect(\n                rt,\n                self.authority_actor_id(),\n                "Inference",\n                Some("ask"),\n                &[],\n                &[],\n            );\n            eprintln!("P0_AUTH complete actor={} runtime_current={:?} caps={:?} auth={:?}", self.actor_id, rt.current_actor, caps, auth);'''
          if text.count(needle) != 1:
              raise SystemExit('bytecode complete_llm shape changed')
          text = text.replace(needle, repl, 1)
          callbacks.write_text(text)
          PY

      - name: Run isolated failing regression with authority diagnostics
        env:
          RUST_BACKTRACE: "1"
        run: cargo +1.95.0 test --lib integration_tests::tests::test_agent_workflow_recovers_semantic_memory_after_restart -- --exact --nocapture
