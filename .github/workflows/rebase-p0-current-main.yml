name: P0 Agent Tool-State Diagnostic

on:
  push:
    branches:
      - ops/rebase-p0-current-main

permissions:
  contents: read

concurrency:
  group: rebase-p0-current-main
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Stage exact failing fixture authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/integration_tests/mod.rs')
          text = path.read_text()
          name = 'test_agent_workflow_recovers_semantic_memory_after_restart'
          marker = f'fn {name}()'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('missing target test')
          next_candidates = [p for p in (
              text.find('\n    #[test]', start + len(marker)),
              text.find('\n    #[cfg(', start + len(marker)),
          ) if p >= 0]
          end = min(next_candidates) if next_candidates else len(text)
          segment = text[start:end]
          pattern = re.compile(r'(spawn\s+[A-Za-z_][A-Za-z0-9_]*\s+\{[^{}]*\})(?!\s+with\s*\[)', re.S)
          migrated, count = pattern.subn(r'\1 with [Inference::Ask]', segment)
          if count != 1:
              raise SystemExit(f'expected one spawn migration, got {count}')
          path.write_text(text[:start] + migrated + text[end:])
          PY

      - name: Instrument tool-state path locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/agent.rs')
          text = path.read_text()
          needle = '''pub(crate) fn invoke_agent_tool_function(\n    rt: &mut Runtime,\n    module: &crate::bytecode::CodeModule,\n    name: &str,\n    arguments: &serde_json::Map<String, serde_json::Value>,\n) -> Result<String, String> {\n    if let Some(actor_id) = rt.current_actor {'''
          repl = '''pub(crate) fn invoke_agent_tool_function(\n    rt: &mut Runtime,\n    module: &crate::bytecode::CodeModule,\n    name: &str,\n    arguments: &serde_json::Map<String, serde_json::Value>,\n) -> Result<String, String> {\n    eprintln!("P0_DIAG tool={} current_actor={:?}", name, rt.current_actor);\n    if let Some(actor_id) = rt.current_actor {\n        eprintln!("P0_DIAG actor={} is_agent={} semantic_behavior={}", actor_id, rt.actor_is_agent(actor_id), rt.is_semantic_memory_behavior(name));'''
          if text.count(needle) != 1:
              raise SystemExit('invoke_agent_tool_function shape changed')
          text = text.replace(needle, repl, 1)

          needle2 = '''        let id = rt.semantic_memory_store_with_metadata(actor_id, &content, metadata);\n        Ok(format!('''
          repl2 = '''        eprintln!("P0_DIAG store_fact actor={} content={}", actor_id, content);\n        let id = rt.semantic_memory_store_with_metadata(actor_id, &content, metadata);\n        if let Some(actor) = rt.actors.get(&actor_id) {\n            let state = actor\n                .get_state_field("semantic_memory")\n                .and_then(|value| vm_value_to_string(&value, actor.bytecode_module.as_ref()));\n            eprintln!("P0_DIAG semantic_after_store={:?}", state);\n        }\n        Ok(format!('''
          if text.count(needle2) != 1:
              raise SystemExit('semantic store shape changed')
          text = text.replace(needle2, repl2, 1)

          needle3 = '''    actor.set_state_field("usage_cost", crate::vm::Value::float(updated_cost));\n    Some(content)'''
          repl3 = '''    actor.set_state_field("usage_cost", crate::vm::Value::float(updated_cost));\n    let semantic = actor\n        .get_state_field("semantic_memory")\n        .and_then(|value| vm_value_to_string(&value, actor.bytecode_module.as_ref()));\n    eprintln!("P0_DIAG semantic_after_finish_agent={:?}", semantic);\n    Some(content)'''
          if text.count(needle3) != 1:
              raise SystemExit('finish_agent_llm shape changed')
          text = text.replace(needle3, repl3, 1)
          path.write_text(text)
          PY

      - name: Run isolated failing regression with diagnostics
        env:
          RUST_BACKTRACE: "1"
        run: cargo +1.95.0 test --lib integration_tests::tests::test_agent_workflow_recovers_semantic_memory_after_restart -- --exact --nocapture
