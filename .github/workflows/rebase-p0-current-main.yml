name: P0 AI Authority Fixture Migration

on:
  push:
    branches:
      - ops/rebase-p0-current-main

permissions:
  contents: write

concurrency:
  group: rebase-p0-current-main
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Record exact source heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main integration/p0-stabilization-2026-09-14
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/p0-start-head
          printf '%s\n' "$(git rev-parse origin/main)" > /tmp/main-start-head
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'P0 branch is no longer based on current main.'
            exit 1
          }

      - name: Migrate only known failing AI fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/integration_tests/mod.rs')
          text = path.read_text()
          tests = [
              'test_agent_ask_tracks_usage_and_cost',
              'test_agent_ask_uses_memory',
              'test_agent_usage_behavior',
              'test_agent_workflow_recovers_semantic_memory_after_restart',
              'test_agent_workflow_researches_and_reports',
              'test_debate_source_end_to_end',
              'test_inference_ask_actor_behavior_suspends_and_resumes',
              'test_inference_ask_chained_suspensions_resume_in_order',
              'test_inference_ask_nonblocking_other_actors_run_first',
              'test_inference_ask_queued_messages_wait_for_suspended_behavior',
              'test_mir_agent_ask_uses_memory',
              'test_pipeline_source_end_to_end',
              'test_supervisor_source_end_to_end',
              'test_workflow_inference_ask_step_records_completion',
              'test_workflow_inference_ask_step_redriven_after_restart',
              'test_workflow_step_inference_ask_then_signal_wait',
              'test_workflow_step_signal_wait_then_inference_ask',
          ]

          for name in tests:
              marker = f'fn {name}()'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing target test: {name}')
              next_candidates = [
                  p for p in (
                      text.find('\n    #[test]', start + len(marker)),
                      text.find('\n    #[cfg(', start + len(marker)),
                  ) if p >= 0
              ]
              end = min(next_candidates) if next_candidates else len(text)
              segment = text[start:end]
              pattern = re.compile(r'(spawn\s+[A-Za-z_][A-Za-z0-9_]*\s+\{[^{}]*\})(?!\s+with\s*\[)', re.S)
              migrated, count = pattern.subn(r'\1 with [Inference::Ask]', segment)
              if count == 0:
                  if 'with [Inference::Ask]' in segment:
                      print(f'{name}: already migrated')
                      continue
                  raise SystemExit(f'{name}: expected an unprivileged spawn fixture')
              text = text[:start] + migrated + text[end:]
              print(f'{name}: migrated {count} spawn site(s)')

          path.write_text(text)

          http = Path('src/runtime/http_server.rs')
          http_text = http.read_text()
          replacement = "/// Match a route pattern against a request path, returning captured parameters.\n/// Patterns use `:name` segments, e.g. `/products/:id`.\n#[cfg(test)]\npub fn match_route("
          if replacement not in http_text:
              needle = "/// Match a route pattern against a request path, returning captured parameters.\n/// Patterns use `:name` segments, e.g. `/products/:id`.\npub fn match_route("
              if http_text.count(needle) != 1:
                  raise SystemExit('expected exactly one legacy match_route declaration')
              http_text = http_text.replace(needle, replacement, 1)
              http.write_text(http_text)
          PY

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(src/integration_tests/mod.rs|src/runtime/http_server.rs)$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected migration changes:"
            printf '%s\n' "$unexpected"
            exit 1
          }

      - name: Verify formatting and diff hygiene
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          git diff --check

      - name: Validate builds and zero-warning contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 check --all-targets
          cargo +1.95.0 check --all-targets --no-default-features
          RUSTFLAGS='-D warnings' cargo +1.95.0 check --lib
          RUSTFLAGS='-D warnings' cargo +1.95.0 check --release --lib

      - name: Run every migrated regression exactly
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test_agent_ask_tracks_usage_and_cost
            test_agent_ask_uses_memory
            test_agent_usage_behavior
            test_agent_workflow_recovers_semantic_memory_after_restart
            test_agent_workflow_researches_and_reports
            test_debate_source_end_to_end
            test_inference_ask_actor_behavior_suspends_and_resumes
            test_inference_ask_chained_suspensions_resume_in_order
            test_inference_ask_nonblocking_other_actors_run_first
            test_inference_ask_queued_messages_wait_for_suspended_behavior
            test_mir_agent_ask_uses_memory
            test_pipeline_source_end_to_end
            test_supervisor_source_end_to_end
            test_workflow_inference_ask_step_records_completion
            test_workflow_inference_ask_step_redriven_after_restart
            test_workflow_step_inference_ask_then_signal_wait
            test_workflow_step_signal_wait_then_inference_ask
          )
          for t in "${tests[@]}"; do
            cargo +1.95.0 test --lib "integration_tests::tests::$t" -- --exact --nocapture
          done

      - name: Re-run core P0 authority regressions
        run: |
          set -euo pipefail
          cargo +1.95.0 test --lib host_authority
          cargo +1.95.0 test --lib authority
          cargo +1.95.0 test --test spawn_authority_provenance

      - name: Commit with branch and main stale-head protection
        shell: bash
        run: |
          set -euo pipefail
          START_HEAD="$(cat /tmp/p0-start-head)"
          MAIN_HEAD="$(cat /tmp/main-start-head)"
          git fetch origin main integration/p0-stabilization-2026-09-14
          test "$(git rev-parse origin/integration/p0-stabilization-2026-09-14)" = "$START_HEAD" || {
            echo 'P0 branch advanced during validation; refusing stale push.'
            exit 1
          }
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD" || {
            echo 'main advanced during validation; refusing stale push.'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/integration_tests/mod.rs src/runtime/http_server.rs
          git diff --cached --check
          git commit -m 'test(ai): require explicit inference authority in actor fixtures'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
