name: P0 Spawn Metadata Relocation Validation

on:
  push:
    branches:
      - ops/rebase-p0-current-main

permissions:
  contents: read

concurrency:
  group: rebase-p0-current-main
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: p0-spawn-metadata-relocation
          cache-on-failure: true

      - name: Rebase function-local spawn metadata to module PCs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mir_codegen.rs')
          text = path.read_text()

          before = '''        let function_start = saved_instructions.len();\n        // Build the spill map: locals whose id exceeds the register file'''
          after = '''        let function_start = saved_instructions.len();\n        // Spawn-site metadata is emitted while this function's instruction\n        // vector is isolated, so its PCs are function-local until the code is\n        // appended back to the module. Remember each table's starting length\n        // and rebase only entries produced by this function at the end.\n        let spawn_init_metadata_start = self.module.spawn_init_overrides.len();\n        let spawn_authority_metadata_start = self.module.spawn_capability_grants.len();\n        let remote_spawn_metadata_start = self.module.remote_spawn_init_fields.len();\n        // Build the spill map: locals whose id exceeds the register file'''
          if text.count(before) != 1:
              raise SystemExit('compile_function start shape changed')
          text = text.replace(before, after, 1)

          before = '''        let code_len = function_code.len();\n        self.module.instructions.extend(function_code);\n\n        // Publish the debugger's pc<->line map and per-function debug info.'''
          after = '''        let code_len = function_code.len();\n        self.module.instructions.extend(function_code);\n\n        // Metadata recorded while `module.instructions` held only this\n        // function used function-local PCs. Runtime spawn dispatch indexes\n        // these tables with module-absolute PCs, so relocate every entry\n        // emitted by this function by the same base as its bytecode.\n        for (pc, _) in &mut self.module.spawn_init_overrides[spawn_init_metadata_start..] {\n            *pc += function_start;\n        }\n        for (pc, _) in &mut self.module.spawn_capability_grants[spawn_authority_metadata_start..] {\n            *pc += function_start;\n        }\n        for (pc, _) in &mut self.module.remote_spawn_init_fields[remote_spawn_metadata_start..] {\n            *pc += function_start;\n        }\n\n        // Publish the debugger's pc<->line map and per-function debug info.'''
          if text.count(before) != 1:
              raise SystemExit('compile_function end shape changed')
          text = text.replace(before, after, 1)
          path.write_text(text)
          PY

      - name: Add nonzero-function-base authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('tests/spawn_authority_provenance.rs')
          text = path.read_text()
          marker = '#[test]\nfn source_grants_survive_frontend_and_bind_to_exact_spawn_pc() {'
          if text.count(marker) != 1:
              raise SystemExit('authority regression insertion point changed')
          test = textwrap.dedent(r'''
          #[test]
          fn spawn_site_authority_pc_is_module_absolute_after_prior_function_code() {
              let mut mir = lower(
                  r#"
          fn helper() { 41 }
          actor Child { behavior ping() { 1 } }
          fn main() {
              spawn Child {} with [Inference::Ask]
          }
          "#,
              );
              let module = compile_mir(&mut mir, "authority-absolute-pc").unwrap();
              let spawn_pc = module
                  .instructions
                  .iter()
                  .position(|instr| instr.opcode == OpCode::Spawn)
                  .unwrap();
              assert!(spawn_pc > 0, "regression requires a nonzero function base");
              assert_eq!(
                  spawn_grants(&module, spawn_pc),
                  vec!["Inference::Ask".to_string()]
              );
              assert_eq!(module.spawn_capability_grants[0].0, spawn_pc);

              let runtime = Rc::new(RefCell::new(Runtime::new()));
              let mut vm = VM::new();
              vm.load_module(module);
              vm.set_actor_callbacks(Box::new(RuntimeVmCallbacks::new(runtime.clone())));
              let child = vm.run().unwrap();
              let child_id = child.as_actor_id().expect("spawn should return actor ref");
              assert_eq!(
                  runtime
                      .borrow()
                      .actors
                      .get(&child_id)
                      .unwrap()
                      .authority_manifest()
                      .unwrap()
                      .canonical_tokens(),
                  vec!["Inference::Ask".to_string()]
              );
          }

          ''').lstrip()
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Format and diff hygiene
        run: |
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          git diff --check

      - name: Run spawn authority provenance suite
        run: cargo +1.95.0 test --test spawn_authority_provenance -- --nocapture

      - name: Re-run previously failing agent recovery fixture with explicit authority
        shell: bash
        run: |
          set -euo pipefail
          cp src/integration_tests/mod.rs /tmp/integration_tests.mod.rs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/integration_tests/mod.rs')
          text = path.read_text()
          name = 'test_agent_workflow_recovers_semantic_memory_after_restart'
          marker = f'fn {name}()'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('missing target test')
          next_candidates = [p for p in (
              text.find('\n    #[test]', start + len(marker)),
              text.find('\n    #[cfg(', start + len(marker)),
          ) if p >= 0]
          end = min(next_candidates) if next_candidates else len(text)
          segment = text[start:end]
          pattern = re.compile(r'(spawn\s+[A-Za-z_][A-Za-z0-9_]*\s+\{[^{}]*\})(?!\s+with\s*\[)', re.S)
          migrated, count = pattern.subn(r'\1 with [Inference::Ask]', segment)
          if count != 1:
              raise SystemExit(f'expected one spawn migration, got {count}')
          path.write_text(text[:start] + migrated + text[end:])
          PY
          cargo +1.95.0 test --lib integration_tests::tests::test_agent_workflow_recovers_semantic_memory_after_restart -- --exact --nocapture
          mv /tmp/integration_tests.mod.rs src/integration_tests/mod.rs
          git diff --check

      - name: Check default and minimal builds
        run: |
          cargo +1.95.0 check --all-targets
          cargo +1.95.0 check --all-targets --no-default-features

      - name: Verify scoped product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/mir_codegen.rs"
          test "${changed[1]}" = "tests/spawn_authority_provenance.rs"
          git diff -- src/mir_codegen.rs tests/spawn_authority_provenance.rs
