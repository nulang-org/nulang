name: CI Hygiene AOT Lint Repair

on:
  push:
    branches:
      - fix/ci-hygiene-2026-09-11

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[aot-lint-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ci-hygiene-2026-09-11
          fetch-depth: 0
      - name: Scope the AOT recursive helper lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/aot/codegen.rs')
          text = path.read_text()
          marker = '    fn emit_expr('
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'expected exactly one emit_expr definition, found {count}')
          annotation = '    // Recursive AOT code generation naturally threads builder/compiler state;\n    // grouping these arguments would add indirection without clarifying ownership.\n    #[allow(clippy::too_many_arguments)]\n'
          if '#[allow(clippy::too_many_arguments)]\n    fn emit_expr(' not in text:
              text = text.replace(marker, annotation + marker, 1)
              path.write_text(text)
          PY
          cargo +1.95.0 fmt --all
      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/ci-hygiene-aot-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): scope AOT codegen argument lint [aot-lint-applied]'
          git push origin HEAD:fix/ci-hygiene-2026-09-11
