name: Capacity Core

on:
  pull_request:
    paths:
      - "crates/nulang-capacity/**"
      - "crates/nulang-capacity-postgres/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capacity.yml"
  push:
    branches: [main]
    paths:
      - "crates/nulang-capacity/**"
      - "crates/nulang-capacity-postgres/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capacity.yml"

concurrency:
  group: capacity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  capacity:
    name: Capacity Core + Postgres Adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --package nulang-capacity --package nulang-capacity-postgres -- --check

      - name: Check core
        run: cargo check -p nulang-capacity --all-targets

      - name: Check Postgres adapter
        run: cargo check -p nulang-capacity-postgres --all-targets

      - name: Test core
        run: cargo test -p nulang-capacity

      - name: Test Postgres adapter
        run: cargo test -p nulang-capacity-postgres

      - name: Clippy core
        run: cargo clippy -p nulang-capacity --all-targets -- -D warnings

      - name: Clippy Postgres adapter
        run: cargo clippy -p nulang-capacity-postgres --all-targets -- -D warnings
