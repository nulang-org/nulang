name: Capacity Core

on:
  pull_request:
    paths:
      - "crates/nulang-capacity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capacity.yml"
  push:
    branches: [main]
    paths:
      - "crates/nulang-capacity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/capacity.yml"

# A newer commit on the same PR/head makes the older validation result stale.
# Keep event types separate so scheduled/default-branch runs do not cancel PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  capacity:
    name: Format, Check, Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --package nulang-capacity -- --check

      - name: Check
        run: cargo check -p nulang-capacity --all-targets

      - name: Test
        run: cargo test -p nulang-capacity

      - name: Clippy
        run: cargo clippy -p nulang-capacity --all-targets -- -D warnings
