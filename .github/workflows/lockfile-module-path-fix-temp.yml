name: Stage lockfile-only module resolution fix

on:
  push:
    branches:
      - automation/package-behavior-manifest-build

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/package-behavior-manifest-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Bind package module resolution to lockfile
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/package/commands.rs')
          text = p.read_text()
          marker = '    let mut module_path = std::env::var("NULANG_MODULE_PATH").unwrap_or_default();'
          replacement = "    // Package dependency resolution is derived exclusively from the lockfile\n    // written by prepare_package(). Ambient module mappings must not change the\n    // semantic input while provenance still claims the locked dependency graph.\n    let module_path = build_module_path();\n"
          if replacement not in text:
              start = text.find(marker)
              end_marker = '    let stdlib_dir = behavior_build_stdlib_dir();'
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('module-path patch anchor missing')
              p.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/package/commands.rs
          git commit -m "fix: bind package imports to resolved lockfile"
          git push origin HEAD:automation/package-behavior-manifest-build
