name: Apply delivery failure system patch

on:
  push:
    branches:
      - fix/delivery-failure-outcomes-1180-main-20261002
    paths:
      - .github/workflows/patch-delivery-failure-system.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply delivery failure system patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/delivery-failure-outcomes-1180-main-20261002

      - name: Apply exact guarded patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/distributed.rs")
          text = path.read_text()
          old = '''pub(crate) fn notify_delivery_failed(runtime: &mut Runtime, sender_id: u64, reason: &str) {
              if sender_id == 0 {
                  return;
              }
              if !runtime.actors.get(&sender_id).is_some() {
                  return;
              }
              let code = delivery_failure_code(reason);
              let fail_payload = vec![Value::int(code), Value::nil()];
              runtime.send_message_by_id(sender_id, 0, &fail_payload);
          }
          '''
          new = '''pub(crate) fn notify_delivery_failed(runtime: &mut Runtime, sender_id: u64, reason: &str) {
              if sender_id == 0 {
                  return;
              }
              if !runtime.actors.contains_key(&sender_id) {
                  return;
              }
              let code = delivery_failure_code(reason);
              let fail_message = Message {
                  behavior_id: 0,
                  payload: MessagePayload::from_slice(&[Value::int(code), Value::nil()]),
                  sender: runtime.current_actor.unwrap_or(0),
                  priority: MessagePriority::System,
                  trace_id: runtime.current_trace.as_ref().map(|trace| trace.to_traceparent()),
              };
              if let Some(sender) = runtime.actors.get_mut(&sender_id) {
                  let _ = sender.mailbox.push_local(fail_message);
              }
              runtime.enqueue_actor(sender_id);
          }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one notify_delivery_failed body, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Commit production fix and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-delivery-failure-system.yml
          git add src/runtime/distributed.rs
          git diff --cached --check
          git commit -m "fix(distribution): prioritize delivery failure notifications"
          git push origin HEAD:fix/delivery-failure-outcomes-1180-main-20261002
