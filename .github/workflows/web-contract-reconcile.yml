name: Web Contract Reconcile

on:
  push:
    branches:
      - feat/native-web-contracts

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-web-contracts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source reconciliation
        run: python3 patches/web_contract_reconcile.py
      - name: Format
        run: cargo fmt --all
      - name: Contract tests
        run: cargo test --lib 'web::contracts::tests::'
      - name: Package contract tests
        run: cargo test --lib 'web::package_contracts::tests::'
      - name: Publish source-only fix
        run: |
          set -euo pipefail
          git add src/web/contracts.rs src/web/package_contracts.rs
          if git diff --cached --quiet; then
            echo "No source changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): validate routes through transparent aliases"
          git push origin HEAD:feat/native-web-contracts
