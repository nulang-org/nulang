name: Release

# Pull requests exercise the exact cross-platform packaging matrix without
# creating a tag or publishing a release. Only release-affecting PRs opt in.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/main.rs'
      - 'scripts/check_release_linux.sh'
      - 'scripts/tests/test_release_cli_profile.py'

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml sets target-dir=/tmp/cargo-target for
  # local dev; override it here so the strip/package steps can use the
  # conventional target/<triple>/ paths.
  CARGO_TARGET_DIR: target

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify public CLI feature-profile parity
        run: python3 -m unittest discover -s scripts/tests -p test_release_cli_profile.py

      - name: Verify tag matches crate and CLI versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as fh:
              crate_version = tomllib.load(fh)["package"]["version"]

          main = open("src/main.rs", encoding="utf-8").read()
          match = re.search(r'const VERSION: &str = "([^"]+)";', main)
          if not match:
              raise SystemExit("src/main.rs VERSION constant not found")
          cli_version = match.group(1)

          expected_tag = f"v{crate_version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"release tag {tag!r} does not match Cargo.toml version {crate_version!r}; "
                  f"expected {expected_tag!r}"
              )
          if cli_version != crate_version:
              raise SystemExit(
                  f"src/main.rs VERSION {cli_version!r} does not match Cargo.toml {crate_version!r}"
              )
          print(f"release version verified: {tag}")
          PY

  release:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nulang-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nulang-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nulang-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nulang-windows-x86_64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cross-compilation toolchain (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # Restrict the runner's amd64 sources and add arm64 via
          # ports.ubuntu.com (archive/security mirrors 404 on arm64).
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          CODENAME=$(lsb_release -cs)
          # printf (not an indented heredoc) so the deb822 stanza has no
          # leading whitespace — indented continuation lines would merge
          # into the previous field and break the source.
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: %s %s-updates %s-backports %s-security\nComponents: main restricted universe multiverse\nArchitectures: arm64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' "$CODENAME" "$CODENAME" "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list.d/arm64.sources
          sudo apt-get update
          # The public CLI does not require cross-target Python headers or
          # shared libraries. Keep the cross toolchain and OpenSSL only.
          # --no-install-recommends omits the target glibc development sysroot
          # on some Ubuntu images. Without it, ring's C build may resolve
          # /usr/include/stdint.h and fail on bits/libc-header-start.h.
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross libssl-dev:arm64 pkg-config
          # Fail early if the compiler cannot find target libc headers.
          printf '#include <stdint.h>\nint main(void) { return (int)sizeof(uint64_t); }\n' \
            | aarch64-linux-gnu-gcc -x c -c - -o "$RUNNER_TEMP/nulang-arm64-libc-smoke.o"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=/opt/homebrew/opt/openssl@3" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain can silently skip the cross-target std when
      # updating a preinstalled toolchain (observed on macOS runners: host
      # components only, then "can't find crate for core"). Add the target
      # explicitly so cross-compilation always has rust-std.
      - name: Ensure cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (public release CLI without Python interop)
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features release-cli --bin nulang

      - name: Reject Linux Python ABI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # readelf understands both native x86_64 and cross-built aarch64 ELF.
          if readelf -d target/${{ matrix.target }}/release/nulang | grep -Eq 'Shared library: \[libpython'; then
            echo "::error::Public release CLI unexpectedly depends on libpython"
            exit 1
          fi

      - name: Smoke native Linux release CLI
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: bash scripts/check_release_linux.sh target/${{ matrix.target }}/release/nulang

      - name: Smoke native macOS/Windows release CLI
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/${{ matrix.target }}/release/nulang.exe"
          else
            bin="target/${{ matrix.target }}/release/nulang"
            # Also fail on macOS Python framework dependencies.
            if otool -L "$bin" | grep -Eiq 'Python.framework|libpython'; then
              echo "::error::Public release CLI unexpectedly depends on Python"
              exit 1
            fi
          fi
          "$bin" --version
          output="$("$bin" --eval 'perform IO.print("release-smoke")')"
          test "$output" = "release-smoke"

      - name: Test (release, native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # --target must match the Build step: the package tests shell out
        # to the nulang binary via the test harness, which locates it next
        # to the test binary (target/<triple>/release/nulang). Without
        # --target the harness falls back to the test binary itself and
        # the web-build tests fail with exit 101.
        run: cargo test --locked --release --target ${{ matrix.target }} --no-default-features --features release-cli

      - name: Strip binary
        # No strip on Windows: the MSVC toolchain has no equivalent
        # single-step strip, and the binary is already release-sized.
        if: runner.os != 'Windows'
        run: |
          # The host strip cannot process a cross-compiled aarch64 ELF;
          # use the cross binutils strip (from gcc-aarch64-linux-gnu).
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            STRIP=aarch64-linux-gnu-strip
          else
            STRIP=strip
          fi
          $STRIP target/${{ matrix.target }}/release/nulang

      - name: Package binary
        # bash shell: the default pwsh on Windows runners cannot run the
        # POSIX commands below (Git Bash ships with the runner image).
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=nulang.exe; else BIN=nulang; fi
          cp target/${{ matrix.target }}/release/$BIN dist/${{ matrix.artifact }}
          tar czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }}
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            else
              shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          )

      - name: Verify packaged archive and checksum
        shell: bash
        run: |
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "${{ matrix.artifact }}.tar.gz.sha256"
            else
              shasum -a 256 -c "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          )
          test "$(tar tzf dist/${{ matrix.artifact }}.tar.gz)" = "${{ matrix.artifact }}"

      - name: Smoke extracted native release archive
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p release-smoke
          tar xzf dist/${{ matrix.artifact }}.tar.gz -C release-smoke
          bin="$PWD/release-smoke/${{ matrix.artifact }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv "$bin" "$bin.exe"
            bin="$bin.exe"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash scripts/check_release_linux.sh "$bin"
          else
            "$bin" --version
            output="$("$bin" --eval 'perform IO.print("release-smoke")')"
            test "$output" = "release-smoke"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  publish:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nulang-*
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p dist-flat
          for d in dist/nulang-*/; do
            cp "$d"* dist-flat/
          done
          ls -la dist-flat/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-flat/*
          generate_release_notes: true
