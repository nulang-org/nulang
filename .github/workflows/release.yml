name: Release

# Pull requests exercise the exact cross-platform packaging matrix without
# creating a tag or publishing a release. Only release-affecting PRs opt in.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/main.rs'
      - 'scripts/check_release_linux.sh'
      - 'scripts/tests/test_release_cli_profile.py'
      - 'scripts/package_linux.sh'
      - 'scripts/tests/test_linux_packages.py'

env:
  CARGO_TERM_COLOR: always
  # The repo's .cargo/config.toml sets target-dir=/tmp/cargo-target for
  # local dev; override it here so the strip/package steps can use the
  # conventional target/<triple>/ paths.
  CARGO_TARGET_DIR: target

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify release packaging contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p test_release_cli_profile.py
          python3 -m unittest discover -s scripts/tests -p test_linux_packages.py

      - name: Verify tag matches crate and CLI versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          with open("Cargo.toml", "rb") as fh:
              crate_version = tomllib.load(fh)["package"]["version"]

          main = open("src/main.rs", encoding="utf-8").read()
          match = re.search(r'const VERSION: &str = "([^"]+)";', main)
          if not match:
              raise SystemExit("src/main.rs VERSION constant not found")
          cli_version = match.group(1)

          expected_tag = f"v{crate_version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"release tag {tag!r} does not match Cargo.toml version {crate_version!r}; "
                  f"expected {expected_tag!r}"
              )
          if cli_version != crate_version:
              raise SystemExit(
                  f"src/main.rs VERSION {cli_version!r} does not match Cargo.toml {crate_version!r}"
              )
          print(f"release version verified: {tag}")
          PY

  release:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against Ubuntu 22.04's glibc 2.35 / OpenSSL 3 baseline,
          # instead of silently increasing minimum requirements with -latest.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: nulang-linux-x86_64
            package_arch: x86_64
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: nulang-linux-aarch64
            package_arch: aarch64
            deb_arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nulang-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nulang-windows-x86_64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Build both GNU/Linux architectures natively to avoid Ubuntu multiarch
      # apt mirror failures and exercise actual ARM64 code before release.
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
          test "$(uname -m)" = "${{ matrix.package_arch }}"

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=/opt/homebrew/opt/openssl@3" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain can silently skip the cross-target std when
      # updating a preinstalled toolchain (observed on macOS runners: host
      # components only, then "can't find crate for core"). Add the target
      # explicitly so cross-compilation always has rust-std.
      - name: Ensure cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (public release CLI without Python interop)
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features release-cli --bin nulang

      - name: Reject Linux Python ABI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Keep public artifacts independent of the runner's Python ABI.
          if readelf -d target/${{ matrix.target }}/release/nulang | grep -Eq 'Shared library: \[libpython'; then
            echo "::error::Public release CLI unexpectedly depends on libpython"
            exit 1
          fi

      - name: Smoke native Linux release CLI
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check_release_linux.sh target/${{ matrix.target }}/release/nulang

      - name: Smoke native macOS/Windows release CLI
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="target/${{ matrix.target }}/release/nulang.exe"
          else
            bin="target/${{ matrix.target }}/release/nulang"
            # Also fail on macOS Python framework dependencies.
            if otool -L "$bin" | grep -Eiq 'Python.framework|libpython'; then
              echo "::error::Public release CLI unexpectedly depends on Python"
              exit 1
            fi
          fi
          "$bin" --version
          output="$("$bin" --eval 'perform IO.print("release-smoke")')"
          test "$output" = "release-smoke"

      - name: Test (release, native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # --target must match the Build step: the package tests shell out
        # to the nulang binary via the test harness, which locates it next
        # to the test binary (target/<triple>/release/nulang). Without
        # --target the harness falls back to the test binary itself and
        # the web-build tests fail with exit 101.
        run: cargo test --locked --release --target ${{ matrix.target }} --no-default-features --features release-cli

      - name: Strip binary
        # Native strip handles both Linux architectures and macOS.
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/nulang

      - name: Package binary
        # bash shell: the default pwsh on Windows runners cannot run the
        # POSIX commands below (Git Bash ships with the runner image).
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=nulang.exe; else BIN=nulang; fi
          cp target/${{ matrix.target }}/release/$BIN dist/${{ matrix.artifact }}
          tar czf dist/${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.artifact }}
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            else
              shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          )

      - name: Verify packaged archive and checksum
        shell: bash
        run: |
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "${{ matrix.artifact }}.tar.gz.sha256"
            else
              shasum -a 256 -c "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          )
          test "$(tar tzf dist/${{ matrix.artifact }}.tar.gz)" = "${{ matrix.artifact }}"

      - name: Smoke extracted native release archive
        shell: bash
        run: |
          mkdir -p release-smoke
          tar xzf dist/${{ matrix.artifact }}.tar.gz -C release-smoke
          bin="$PWD/release-smoke/${{ matrix.artifact }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv "$bin" "$bin.exe"
            bin="$bin.exe"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            bash scripts/check_release_linux.sh "$bin"
          else
            "$bin" --version
            output="$("$bin" --eval 'perform IO.print("release-smoke")')"
            test "$output" = "release-smoke"
          fi

      - name: Install Linux package build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm cpio

      - name: Build Debian and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "nulang"))')"
          bash scripts/package_linux.sh "target/${{ matrix.target }}/release/nulang" "$version" "${{ matrix.package_arch }}" dist

      - name: Verify Linux packages, architectures, payloads, and checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "nulang"))')"
          arch="${{ matrix.package_arch }}"
          deb="dist/nulang_${version}_${{ matrix.deb_arch }}.deb"
          rpm="dist/nulang-${version}-1.${arch}.rpm"
          test "$(dpkg-deb --field "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          test "$(rpm -qp --qf '%{ARCH}' "$rpm")" = "$arch"
          dpkg-deb --contents "$deb" | grep -E '/usr/bin/nulang$'
          rpm -qpl "$rpm" | grep -Fx '/usr/bin/nulang'
          (cd dist && sha256sum -c "$(basename "$deb").sha256" && sha256sum -c "$(basename "$rpm").sha256")
          mkdir -p package-smoke/deb package-smoke/rpm
          dpkg-deb -x "$deb" package-smoke/deb
          rpm2cpio "$rpm" | (cd package-smoke/rpm && cpio -id --quiet)
          cmp package-smoke/deb/usr/bin/nulang "target/${{ matrix.target }}/release/nulang"
          cmp package-smoke/rpm/usr/bin/nulang "target/${{ matrix.target }}/release/nulang"
          bash scripts/check_release_linux.sh package-smoke/deb/usr/bin/nulang
          bash scripts/check_release_linux.sh package-smoke/rpm/usr/bin/nulang

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256

  # Download release-format packages and exercise installation on clean
  # distro images. This includes actual native ARM64 execution, not QEMU.
  linux-install-smoke:
    name: Linux install (${{ matrix.label }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu 22.04 x86_64
            os: ubuntu-22.04
            artifact: nulang-linux-x86_64
            kind: deb
            image: ubuntu:22.04
          - label: Ubuntu 22.04 arm64
            os: ubuntu-22.04-arm
            artifact: nulang-linux-aarch64
            kind: deb
            image: ubuntu:22.04
          - label: Debian 12 x86_64
            os: ubuntu-22.04
            artifact: nulang-linux-x86_64
            kind: deb
            image: debian:12
          - label: Debian 12 arm64
            os: ubuntu-22.04-arm
            artifact: nulang-linux-aarch64
            kind: deb
            image: debian:12
          - label: Fedora 44 x86_64
            os: ubuntu-22.04
            artifact: nulang-linux-x86_64
            kind: rpm
            image: fedora:44
          - label: Fedora 44 arm64
            os: ubuntu-22.04-arm
            artifact: nulang-linux-aarch64
            kind: rpm
            image: fedora:44
    permissions:
      contents: read
    steps:
      - name: Download release package artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: Verify downloaded package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd pkg
          case "${{ matrix.kind }}" in
            deb) sha256sum -c nulang_*.deb.sha256 ;;
            rpm) sha256sum -c nulang-*.rpm.sha256 ;;
            *) exit 2 ;;
          esac

      - name: Install, execute and uninstall package on native host architecture
        shell: bash
        run: |
          docker run --rm \
            -e NULANG_PACKAGE_KIND="${{ matrix.kind }}" \
            -e NULANG_EVAL='perform IO.print("linux-package-smoke")' \
            -v "$PWD/pkg:/packages:ro" \
            "${{ matrix.image }}" sh -euc '
              cd /packages
              if [ "$NULANG_PACKAGE_KIND" = deb ]; then
                apt-get update
                apt-get install -y --no-install-recommends ./nulang_*.deb
              else
                dnf -y install ./nulang-*.rpm
              fi
              nulang --version
              test "$(nulang --eval "$NULANG_EVAL")" = linux-package-smoke
              if [ "$NULANG_PACKAGE_KIND" = deb ]; then
                apt-get remove -y nulang
              else
                dnf remove -y nulang
              fi
              test ! -e /usr/bin/nulang
            '

  publish:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [release, linux-install-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nulang-*
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p dist-flat
          for d in dist/nulang-*/; do
            cp "$d"* dist-flat/
          done
          ls -la dist-flat/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-flat/*
          generate_release_notes: true
