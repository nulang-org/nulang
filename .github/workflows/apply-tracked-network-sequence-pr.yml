name: Apply tracked network sequence implementation

on:
  pull_request:
    paths:
      - '.github/workflows/apply-tracked-network-sequence-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply transport sequence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/runtime/network.rs')
          text = path.read_text()

          def exact(old, new, expected=1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrences, found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          exact(
              '''pub struct OutgoingPacket {\n    pub to_node: NodeId,\n    pub to_addr: SocketAddr,\n    pub packet: Packet,\n}''',
              '''pub struct OutgoingPacket {\n    pub to_node: NodeId,\n    pub to_addr: SocketAddr,\n    /// Exact sequence number that will be encoded into the NUL0 frame.\n    pub seq: u64,\n    pub packet: Packet,\n}''',
          )

          exact(
              '    fn send(&mut self, to_node: NodeId, to_addr: std::net::SocketAddr, packet: Packet);',
              '    fn send(&mut self, to_node: NodeId, to_addr: std::net::SocketAddr, packet: Packet) -> Option<u64>;',
          )

          exact(
              '''    fn send(&mut self, to_node: NodeId, to_addr: std::net::SocketAddr, packet: Packet) {\n        (**self).send(to_node, to_addr, packet)\n    }''',
              '''    fn send(\n        &mut self,\n        to_node: NodeId,\n        to_addr: std::net::SocketAddr,\n        packet: Packet,\n    ) -> Option<u64> {\n        (**self).send(to_node, to_addr, packet)\n    }''',
          )

          exact(
              '''    /// Channel endpoint used to enqueue packets for transmission.\n    outgoing_tx: mpsc::SyncSender<OutgoingPacket>,\n    /// Background thread handles.''',
              '''    /// Channel endpoint used to enqueue packets for transmission.\n    outgoing_tx: mpsc::SyncSender<OutgoingPacket>,\n    /// Next NUL0 sequence reserved synchronously by `send`, so callers can\n    /// correlate the existing transport ACK with the logical operation sent.\n    next_seq: u64,\n    /// Background thread handles.''',
          )

          exact(
              '''            incoming_tx,\n            outgoing_tx,\n            threads: Arc::new(Mutex::new(handles)),''',
              '''            incoming_tx,\n            outgoing_tx,\n            next_seq: 1,\n            threads: Arc::new(Mutex::new(handles)),''',
          )

          tcp_send = re.compile(
              r'    pub fn send\(&mut self, to_node: NodeId, to_addr: SocketAddr, packet: Packet\) \{\n.*?\n    \}\n\n    /// Receive incoming packets',
              re.S,
          )
          replacement = '''    pub fn send(\n        &mut self,\n        to_node: NodeId,\n        to_addr: SocketAddr,\n        packet: Packet,\n    ) -> Option<u64> {\n        // Reject payloads that cannot cross the wire losslessly before\n        // reserving a sequence. `None` means no ACK can ever correspond to\n        // this attempted send.\n        if !packet_payload_wire_safe(&packet) {\n            warn!(\n                "nulang-net: dropping packet to node {:?} (addr {}): payload value cannot cross the wire (heap pointer, nil, or string without content)",\n                to_node, to_addr\n            );\n            return None;\n        }\n\n        let seq = self.next_seq;\n        self.next_seq = self.next_seq.wrapping_add(1);\n        if self.next_seq == 0 {\n            self.next_seq = 1;\n        }\n\n        // Reserve the sequence even for a simulated in-flight drop. The\n        // sender may track it, but no receiver ACK will arrive, which is\n        // exactly the distinction receiver-knowledge tracking needs.\n        if self.partition.contains(&to_node) {\n            return Some(seq);\n        }\n        let outgoing = OutgoingPacket {\n            to_node,\n            to_addr,\n            seq,\n            packet,\n        };\n        // Blocks on a full channel (backpressure). An error means the sender\n        // thread has shut down and the packet cannot be delivered. The\n        // sequence remains valid but will never be acknowledged.\n        if self.outgoing_tx.send(outgoing).is_err() {\n            warn!(\n                "nulang-net: dropping packet to node {:?} (addr {}): sender thread shut down",\n                to_node, to_addr\n            );\n        }\n        Some(seq)\n    }\n\n    /// Receive incoming packets'''
          text, count = tcp_send.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one TcpTransport::send body, replaced {count}')

          exact(
              '''    // We keep a local sequence counter so we can embed it into the bytes.\n    let mut next_seq: u64 = 1;\n\n''',
              '',
          )
          exact(
              '''        // Send the packet.\n        let seq = next_seq;\n        next_seq = next_seq.wrapping_add(1);\n        let bytes = outgoing.packet.to_bytes(seq);''',
              '''        // Send the packet using the sequence reserved synchronously by\n        // `NetworkTransport::send`; this is the value callers correlate with ACKs.\n        let bytes = outgoing.packet.to_bytes(outgoing.seq);''',
          )

          exact(
              '''    fn send(&mut self, to_node: NodeId, to_addr: std::net::SocketAddr, packet: Packet) {\n        self.send(to_node, to_addr, packet)\n    }''',
              '''    fn send(\n        &mut self,\n        to_node: NodeId,\n        to_addr: std::net::SocketAddr,\n        packet: Packet,\n    ) -> Option<u64> {\n        TcpTransport::send(self, to_node, to_addr, packet)\n    }''',
          )

          # Deterministic transport clones share one sequence authority so a\n          # clone cannot reuse a number already reserved by its sibling.\n          marker = '''    incoming_rx: mpsc::Receiver<IncomingPacket>,\n    incoming_tx: mpsc::SyncSender<IncomingPacket>,\n    /// Shared bus for connecting to other nodes: node_id -> (incoming_tx, outgoing_tx)'''
          exact(
              marker,
              '''    incoming_rx: mpsc::Receiver<IncomingPacket>,\n    incoming_tx: mpsc::SyncSender<IncomingPacket>,\n    next_seq: Arc<AtomicU64>,\n    /// Shared bus for connecting to other nodes: node_id -> (incoming_tx, outgoing_tx)''',
          )
          exact(
              '''            incoming_tx: self.incoming_tx.clone(),\n            shared_bus: self.shared_bus.clone(),''',
              '''            incoming_tx: self.incoming_tx.clone(),\n            next_seq: self.next_seq.clone(),\n            shared_bus: self.shared_bus.clone(),''',
          )
          exact(
              '''            incoming_tx,\n            shared_bus,\n            shutdown_flag,''',
              '''            incoming_tx,\n            next_seq: Arc::new(AtomicU64::new(1)),\n            shared_bus,\n            shutdown_flag,''',
          )

          deterministic_send = re.compile(
              r'    fn send\(&mut self, to_node: NodeId, _to_addr: SocketAddr, packet: Packet\) \{\n.*?\n    \}\n\n    fn receive',
              re.S,
          )
          replacement = '''    fn send(\n        &mut self,\n        to_node: NodeId,\n        _to_addr: SocketAddr,\n        packet: Packet,\n    ) -> Option<u64> {\n        let mut seq = self.next_seq.fetch_add(1, Ordering::Relaxed);\n        if seq == 0 {\n            seq = self.next_seq.fetch_add(1, Ordering::Relaxed);\n        }\n\n        // Simulated partition: reserve the wire sequence but silently drop\n        // delivery. No ACK will arrive for the returned value.\n        if self.partition.contains(&to_node) {\n            return Some(seq);\n        }\n        if let Some(sender) = self.get_incoming_sender(to_node) {\n            let incoming = IncomingPacket {\n                from_node: self.node_id,\n                seq,\n                packet,\n            };\n            if self.reorder {\n                if let Some(previous) = self.held.remove(&to_node) {\n                    let _ = sender.send(incoming);\n                    let _ = sender.send(previous);\n                } else {\n                    self.held.insert(to_node, incoming);\n                }\n            } else {\n                let _ = sender.send(incoming);\n            }\n        }\n        Some(seq)\n    }\n\n    fn receive'''
          text, count = deterministic_send.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one deterministic send body, replaced {count}')

          path.write_text(text)

          # Keep the backend facade source-compatible: it intentionally ignores\n          # the sequence because callers using this generic facade do not yet\n          # participate in ACK correlation.
          backends = Path('src/backends/mod.rs')
          b = backends.read_text()
          old = '''        crate::runtime::NetworkTransport::send(self, to_node, to_addr, packet)'''
          if old in b:
              b = b.replace(old, '''        let _ = crate::runtime::NetworkTransport::send(self, to_node, to_addr, packet);''', 1)
              backends.write_text(b)
          PY
      - name: Update RED test for optional sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/network_tracked_sequence.rs')
          text = path.read_text()
          text = text.replace('''    let first = a.send(\n''', '''    let first = a.send(\n''', 1)
          text = text.replace('''    );\n    let second = a.send(\n''', '''    )\n    .expect("wire-safe heartbeat should reserve a sequence");\n    let second = a.send(\n''', 1)
          # Replace the second call's terminator only once, immediately before assertions.
          text = text.replace('''        },\n    );\n\n    assert_eq!(first, 1);''', '''        },\n    )\n    .expect("wire-safe heartbeat should reserve a sequence");\n\n    assert_eq!(first, 1);''', 1)
          path.write_text(text)
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-tracked-network-sequence-pr.yml
          git add src/runtime/network.rs src/backends/mod.rs tests/network_tracked_sequence.rs
          git diff --cached --check
          git commit -m 'refactor(network): expose sent packet sequences'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
