name: Apply web request source compiler slice

on:
  push:
    branches:
      - feat/web-param-request-sources

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-param-request-sources
          fetch-depth: 0

      - name: Apply compiler changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # AST: retain ordinary parameter value types and store HTTP source metadata
          # as function annotations produced by the parser.
          replace_once(
              "src/ast.rs",
              '''#[derive(Debug, Clone, PartialEq)]
          pub enum FunctionAnnotation {
              /// `@tool(description: \"...\")` marks a function as an LLM-callable tool.
              Tool { description: String },
              /// `@backend(native | wasm)` selects the actor execution backend.
              Backend { kind: ActorBackendKind },
              /// `@derive(eq, ...)` requests synthesized trait helpers on a record type.
              Derive(Vec<String>),
              /// `@placement(static|server|edge|client|actor|workflow)` marks a web
              /// framework function's compile-time execution target.
              Placement(crate::types::Placement),
          }
          ''',
              '''/// Request source for compiler-bound web handler parameters.
          ///
          /// This metadata does not wrap or alter the parameter's Nulang type: an
          /// `Int from query` parameter remains an `Int` to the typechecker and body.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum WebRequestParamSource {
              Path,
              Query,
              Header,
              Cookie,
              Body,
              Form,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub enum FunctionAnnotation {
              /// `@tool(description: \"...\")` marks a function as an LLM-callable tool.
              Tool { description: String },
              /// `@backend(native | wasm)` selects the actor execution backend.
              Backend { kind: ActorBackendKind },
              /// `@derive(eq, ...)` requests synthesized trait helpers on a record type.
              Derive(Vec<String>),
              /// `@placement(static|server|edge|client|actor|workflow)` marks a web
              /// framework function's compile-time execution target.
              Placement(crate::types::Placement),
              /// Contextual parameter syntax such as `limit: Int from query`.
              RequestBinding {
                  param: String,
                  source: WebRequestParamSource,
                  source_name: String,
              },
          }
          ''',
          )

          # Parser: `from` is contextual and only recognized after a function parameter
          # type. It therefore introduces no global keyword and no lambda/actor grammar
          # changes. Source metadata is desugared into FunctionAnnotation entries.
          replace_once(
              "src/parser.rs",
              '''    fn parse_function(
                  &mut self,
                  public: bool,
                  annotations: Vec<FunctionAnnotation>,
              ) -> NuResult<Decl> {
          ''',
              '''    fn parse_function(
                  &mut self,
                  public: bool,
                  mut annotations: Vec<FunctionAnnotation>,
              ) -> NuResult<Decl> {
          ''',
          )
          replace_once(
              "src/parser.rs",
              '''        self.expect(TokenKind::LParen)?;
                  let (params, default_values) = self.parse_params_with_defaults()?;
                  self.expect(TokenKind::RParen)?;

                  // Optional `using` clause: `fn foo(x) using (log: Logger) -> T`
                  let using_params = if self.consume_if(&TokenKind::Using) {
                      self.expect(TokenKind::LParen)?;
                      let (up, _) = self.parse_params_with_defaults()?;
                      self.expect(TokenKind::RParen)?;
                      up
                  } else {
                      vec![]
                  };
          ''',
              '''        self.expect(TokenKind::LParen)?;
                  let (params, default_values, request_bindings) =
                      self.parse_params_with_defaults()?;
                  self.expect(TokenKind::RParen)?;
                  annotations.extend(request_bindings);

                  // Optional `using` clause: `fn foo(x) using (log: Logger) -> T`
                  let using_params = if self.consume_if(&TokenKind::Using) {
                      self.expect(TokenKind::LParen)?;
                      let (up, _, request_bindings) = self.parse_params_with_defaults()?;
                      self.expect(TokenKind::RParen)?;
                      if !request_bindings.is_empty() {
                          return Err(NuError::parse_error(
                              "request-source bindings are not allowed on `using` parameters".to_string(),
                              self.current_span(),
                          ));
                      }
                      up
                  } else {
                      vec![]
                  };
          ''',
          )

          old_params = '''    /// Parse function parameters with optional default values.
              /// Returns params and a parallel vec of default expressions (None = required).
              fn parse_params_with_defaults(
                  &mut self,
              ) -> NuResult<(Vec<crate::ast::Param>, Vec<Option<Expr>>)> {
                  let mut params = Vec::new();
                  let mut defaults = Vec::new();
                  self.skip_newlines();
                  while self.peek_kind() != &TokenKind::RParen && !self.is_at_end() {
                      let cap = self.try_parse_param_capability().unwrap_or(None);
                      let name = self.expect_ident("parameter name")?;
                      let ty = if self.consume_if(&TokenKind::Colon) {
                          Some(self.parse_type()?)
                      } else {
                          None
                      };
                      let default = if self.consume_if(&TokenKind::Assign) {
                          Some(self.parse_expr()?)
                      } else {
                          None
                      };
                      params.push(crate::ast::Param { name, ty, cap });
                      defaults.push(default);
                      self.skip_newlines();
                      if !self.consume_if(&TokenKind::Comma) {
                          break;
                      }
                      self.skip_newlines();
                  }
                  Ok((params, defaults))
              }
          '''
          new_params = '''    fn parse_request_param_binding(
                  &mut self,
                  param_name: &str,
              ) -> NuResult<Option<FunctionAnnotation>> {
                  let is_from = matches!(self.peek_kind(), TokenKind::Ident(name) if name == "from");
                  if !is_from {
                      return Ok(None);
                  }
                  self.advance(); // contextual `from`
                  let source_name = self.expect_ident("request source after 'from'")?;
                  let source = match source_name.as_str() {
                      "path" => WebRequestParamSource::Path,
                      "query" => WebRequestParamSource::Query,
                      "header" => WebRequestParamSource::Header,
                      "cookie" => WebRequestParamSource::Cookie,
                      "body" => WebRequestParamSource::Body,
                      "form" => WebRequestParamSource::Form,
                      other => {
                          return Err(NuError::parse_error(
                              format!(
                                  "unknown request source '{other}'; expected path, query, header, cookie, body, or form"
                              ),
                              self.current_span(),
                          ));
                      }
                  };

                  let explicit_name = if self.consume_if(&TokenKind::LParen) {
                      let name = self.expect_string("request source name")?;
                      self.expect(TokenKind::RParen)?;
                      Some(name)
                  } else {
                      None
                  };
                  if source == WebRequestParamSource::Body && explicit_name.is_some() {
                      return Err(NuError::parse_error(
                          "body bindings do not accept a source name".to_string(),
                          self.current_span(),
                      ));
                  }
                  let source_name = match source {
                      WebRequestParamSource::Body => "body".to_string(),
                      _ => explicit_name.unwrap_or_else(|| param_name.to_string()),
                  };
                  Ok(Some(FunctionAnnotation::RequestBinding {
                      param: param_name.to_string(),
                      source,
                      source_name,
                  }))
              }

              /// Parse function parameters with optional default values and contextual
              /// request-source metadata (`name: Type from query`).
              fn parse_params_with_defaults(
                  &mut self,
              ) -> NuResult<(
                  Vec<crate::ast::Param>,
                  Vec<Option<Expr>>,
                  Vec<FunctionAnnotation>,
              )> {
                  let mut params = Vec::new();
                  let mut defaults = Vec::new();
                  let mut request_bindings = Vec::new();
                  self.skip_newlines();
                  while self.peek_kind() != &TokenKind::RParen && !self.is_at_end() {
                      let cap = self.try_parse_param_capability().unwrap_or(None);
                      let name = self.expect_ident("parameter name")?;
                      let ty = if self.consume_if(&TokenKind::Colon) {
                          Some(self.parse_type()?)
                      } else {
                          None
                      };
                      if let Some(binding) = self.parse_request_param_binding(&name)? {
                          request_bindings.push(binding);
                      }
                      let default = if self.consume_if(&TokenKind::Assign) {
                          Some(self.parse_expr()?)
                      } else {
                          None
                      };
                      params.push(crate::ast::Param { name, ty, cap });
                      defaults.push(default);
                      self.skip_newlines();
                      if !self.consume_if(&TokenKind::Comma) {
                          break;
                      }
                      self.skip_newlines();
                  }
                  Ok((params, defaults, request_bindings))
              }
          '''
          replace_once("src/parser.rs", old_params, new_params)

          # Contract IR: carry request metadata as an optional additive field on
          # each handler parameter. Serde defaults preserve existing schema readers.
          replace_once(
              "src/web/contracts.rs",
              '''use crate::ast::{AstModule, Decl, Expr, FunctionAnnotation, Literal, Param, WorkflowItem};
          ''',
              '''use crate::ast::{
              AstModule, Decl, Expr, FunctionAnnotation, Literal, Param, WebRequestParamSource,
              WorkflowItem,
          };
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''#[derive(Debug, Clone, Default, PartialEq, Eq, Serialize, Deserialize)]
          pub struct HandlerParamContract {
              pub name: String,
              pub ty: Option<String>,
              pub capability: Option<String>,
          }
          ''',
              '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "snake_case")]
          pub enum RequestParamSource {
              Path,
              Query,
              Header,
              Cookie,
              Body,
              Form,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct RequestParamBindingContract {
              pub source: RequestParamSource,
              pub source_name: String,
          }

          #[derive(Debug, Clone, Default, PartialEq, Eq, Serialize, Deserialize)]
          pub struct HandlerParamContract {
              pub name: String,
              pub ty: Option<String>,
              pub capability: Option<String>,
              #[serde(default, skip_serializing_if = "Option::is_none")]
              pub request: Option<RequestParamBindingContract>,
          }
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''struct FunctionMeta {
              params: Vec<Param>,
              response_type: Option<String>,
          ''',
              '''struct FunctionMeta {
              params: Vec<Param>,
              request_bindings: HashMap<String, RequestParamBindingContract>,
              response_type: Option<String>,
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''        let placement = annotations.iter().find_map(|annotation| match annotation {
                      FunctionAnnotation::Placement(p) => Some(p.to_string()),
                      _ => None,
                  });

                  Some((
          ''',
              '''        let placement = annotations.iter().find_map(|annotation| match annotation {
                      FunctionAnnotation::Placement(p) => Some(p.to_string()),
                      _ => None,
                  });
                  let request_bindings = annotations
                      .iter()
                      .filter_map(|annotation| match annotation {
                          FunctionAnnotation::RequestBinding {
                              param,
                              source,
                              source_name,
                          } => Some((
                              param.clone(),
                              RequestParamBindingContract {
                                  source: request_source_contract(*source),
                                  source_name: source_name.clone(),
                              },
                          )),
                          _ => None,
                      })
                      .collect();

                  Some((
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''            Self {
                          params: params.clone(),
                          response_type: ret_type.as_ref().map(ToString::to_string),
          ''',
              '''            Self {
                          params: params.clone(),
                          request_bindings,
                          response_type: ret_type.as_ref().map(ToString::to_string),
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''                &meta.params,
                          &transparent_aliases,
          ''',
              '''                &meta.params,
                          &meta.request_bindings,
                          &transparent_aliases,
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''            handler_params: meta
                          .map(|m| m.params.iter().map(handler_param_contract).collect())
                          .unwrap_or_default(),
          ''',
              '''            handler_params: meta
                          .map(|m| {
                              m.params
                                  .iter()
                                  .map(|param| {
                                      handler_param_contract(
                                          param,
                                          m.request_bindings.get(&param.name),
                                      )
                                  })
                                  .collect()
                          })
                          .unwrap_or_default(),
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''    handler_params: &[Param],
              transparent_aliases: &HashMap<String, String>,
          ''',
              '''    handler_params: &[Param],
              request_bindings: &HashMap<String, RequestParamBindingContract>,
              transparent_aliases: &HashMap<String, String>,
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''        let handler_param = handler_params
                      .iter()
                      .find(|param| param.name == route_param.name);
          ''',
              '''        let handler_param = handler_params.iter().find(|param| {
                      match request_bindings.get(&param.name) {
                          Some(binding) => {
                              binding.source == RequestParamSource::Path
                                  && binding.source_name == route_param.name
                          }
                          None => param.name == route_param.name,
                      }
                  });
          ''',
          )
          replace_once(
              "src/web/contracts.rs",
              '''fn handler_param_contract(param: &Param) -> HandlerParamContract {
              HandlerParamContract {
                  name: param.name.clone(),
                  ty: param.ty.as_ref().map(ToString::to_string),
                  capability: param.cap.map(|cap| cap.to_string()),
              }
          }

          fn effect_names''',
              '''fn request_source_contract(source: WebRequestParamSource) -> RequestParamSource {
              match source {
                  WebRequestParamSource::Path => RequestParamSource::Path,
                  WebRequestParamSource::Query => RequestParamSource::Query,
                  WebRequestParamSource::Header => RequestParamSource::Header,
                  WebRequestParamSource::Cookie => RequestParamSource::Cookie,
                  WebRequestParamSource::Body => RequestParamSource::Body,
                  WebRequestParamSource::Form => RequestParamSource::Form,
              }
          }

          fn handler_param_contract(
              param: &Param,
              request: Option<&RequestParamBindingContract>,
          ) -> HandlerParamContract {
              HandlerParamContract {
                  name: param.name.clone(),
                  ty: param.ty.as_ref().map(ToString::to_string),
                  capability: param.cap.map(|cap| cap.to_string()),
                  request: request.cloned(),
              }
          }

          fn effect_names''',
          )

          # Existing unit-test fixtures construct HandlerParamContract directly.
          # Add the new optional field without changing their semantics.
          for path in Path("src/web").glob("*.rs"):
              text = path.read_text()
              pattern = re.compile(r"HandlerParamContract\s*\{.*?\n\s*\}", re.S)
              def add_request(match):
                  block = match.group(0)
                  if "request:" in block:
                      return block
                  lines = block.splitlines()
                  closing_indent = re.match(r"\s*", lines[-1]).group(0)
                  field_indent = closing_indent + "    "
                  lines.insert(-1, f"{field_indent}request: None,")
                  return "\n".join(lines)
              updated = pattern.sub(add_request, text)
              path.write_text(updated)

          # Binding compiler: emit explicit non-path request sources while retaining
          # legacy/same-name path inference for handlers with no explicit source.
          replace_once(
              "src/web/bindings.rs",
              '''use crate::web::contracts::RouteContract;
          use serde::{Deserialize, Serialize};
          use std::collections::HashSet;

          /// Transport-neutral request source used to populate a handler argument.
          ///
          /// Path bindings are the first source emitted by the compiler. The remaining
          /// variants reserve the stable Contract IR vocabulary for typed query, header,
          /// cookie, body, and form extractors so transports and generators can converge
          /// on one schema without another IR-version split. Until the compiler emits a
          /// source, runtimes must not synthesize it implicitly.
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "snake_case")]
          pub enum RouteBindingSource {
              Path,
              Query,
              Header,
              Cookie,
              Body,
              Form,
          }
          ''',
              '''use crate::web::contracts::RouteContract;
          pub use crate::web::contracts::RequestParamSource as RouteBindingSource;
          use serde::{Deserialize, Serialize};
          use std::collections::HashSet;
          ''',
          )

          old_compile = '''pub fn compile_route_bindings(contract: &RouteContract) -> BindingCompilation {
              let contract_params = contract_syntax_params(&contract.path);
              let mut out = BindingCompilation::default();

              for route_param in &contract.params {
                  let Some((handler_index, handler_param)) = contract
                      .handler_params
                      .iter()
                      .enumerate()
                      .find(|(_, param)| param.name == route_param.name)
                  else {
                      if contract_params.contains(route_param.name.as_str()) {
                          out.diagnostics.push(format!(
                              "{} {}: contract route parameter '{}' has no same-named parameter on handler '{}'",
                              contract.method,
                              contract.path,
                              route_param.name,
                              contract.handler.as_deref().unwrap_or("<handler>")
                          ));
                      }
                      continue;
                  };

                  out.bindings.push(RouteBindingContract {
                      source: RouteBindingSource::Path,
                      source_name: route_param.name.clone(),
                      handler_param: handler_param.name.clone(),
                      handler_index,
                      ty: route_param.ty.clone().or_else(|| handler_param.ty.clone()),
                  });
              }

              out.bindings.sort_by_key(|binding| binding.handler_index);
              out
          }
          '''
          new_compile = '''pub fn compile_route_bindings(contract: &RouteContract) -> BindingCompilation {
              let contract_params = contract_syntax_params(&contract.path);
              let mut out = BindingCompilation::default();
              let mut explicit_path_inputs = HashSet::new();

              for (handler_index, handler_param) in contract.handler_params.iter().enumerate() {
                  let Some(request) = &handler_param.request else {
                      continue;
                  };
                  let ty = if request.source == RouteBindingSource::Path {
                      let Some(route_param) = contract
                          .params
                          .iter()
                          .find(|param| param.name == request.source_name)
                      else {
                          out.diagnostics.push(format!(
                              "{} {}: handler parameter '{}' binds unknown path input '{}'",
                              contract.method,
                              contract.path,
                              handler_param.name,
                              request.source_name
                          ));
                          continue;
                      };
                      explicit_path_inputs.insert(request.source_name.clone());
                      route_param.ty.clone().or_else(|| handler_param.ty.clone())
                  } else {
                      handler_param.ty.clone()
                  };

                  out.bindings.push(RouteBindingContract {
                      source: request.source,
                      source_name: request.source_name.clone(),
                      handler_param: handler_param.name.clone(),
                      handler_index,
                      ty,
                  });
              }

              for route_param in &contract.params {
                  if explicit_path_inputs.contains(&route_param.name) {
                      continue;
                  }
                  let Some((handler_index, handler_param)) = contract
                      .handler_params
                      .iter()
                      .enumerate()
                      .find(|(_, param)| {
                          param.name == route_param.name && param.request.is_none()
                      })
                  else {
                      if contract_params.contains(route_param.name.as_str()) {
                          out.diagnostics.push(format!(
                              "{} {}: contract route parameter '{}' has no same-named parameter on handler '{}'",
                              contract.method,
                              contract.path,
                              route_param.name,
                              contract.handler.as_deref().unwrap_or("<handler>")
                          ));
                      }
                      continue;
                  };

                  out.bindings.push(RouteBindingContract {
                      source: RouteBindingSource::Path,
                      source_name: route_param.name.clone(),
                      handler_param: handler_param.name.clone(),
                      handler_index,
                      ty: route_param.ty.clone().or_else(|| handler_param.ty.clone()),
                  });
              }

              out.bindings.sort_by_key(|binding| binding.handler_index);
              out
          }
          '''
          replace_once("src/web/bindings.rs", old_compile, new_compile)

          # Integration coverage exercises parser -> ContractCompilation -> binding IR.
          Path("tests/web_request_source_contracts.rs").write_text(r'''use nulang::ast::{FunctionAnnotation, WebRequestParamSource};
          use nulang::lexer::Lexer;
          use nulang::parser::Parser;
          use nulang::web::bindings::{compile_route_bindings, RouteBindingSource};
          use nulang::web::contracts::{compile_module_contracts, RequestParamSource};

          fn parse(source: &str) -> nulang::ast::AstModule {
              let tokens = Lexer::new(source).lex().unwrap();
              Parser::new(tokens).parse_module().unwrap()
          }

          #[test]
          fn contextual_request_sources_preserve_parameter_types_and_lower_to_bindings() {
              let module = parse(r#"
          fn endpoint(
              id: Int from path("user_id"),
              limit: Int from query,
              trace: String from header("X-Trace"),
              session: String from cookie("session"),
              payload: String from body,
              title: String from form("title")
          ) -> String { "ok" }

          fn web_main() {
              perform Web.route("POST", "/users/{user_id: Int}", endpoint)
          }
          "#);

              let function = module
                  .decls
                  .iter()
                  .find(|decl| matches!(decl, nulang::ast::Decl::Function { name, .. } if name == "endpoint"))
                  .unwrap();
              if let nulang::ast::Decl::Function { params, annotations, .. } = function {
                  assert_eq!(params[0].ty.as_ref().unwrap().to_string(), "Int");
                  assert!(annotations.iter().any(|annotation| matches!(
                      annotation,
                      FunctionAnnotation::RequestBinding {
                          param,
                          source: WebRequestParamSource::Query,
                          source_name,
                      } if param == "limit" && source_name == "limit"
                  )));
              }

              let compiled = compile_module_contracts(&module);
              assert!(compiled.diagnostics.is_empty(), "{:?}", compiled.diagnostics);
              let route = &compiled.routes[0];
              assert_eq!(route.handler_params[0].request.as_ref().unwrap().source, RequestParamSource::Path);
              assert_eq!(route.handler_params[1].request.as_ref().unwrap().source, RequestParamSource::Query);

              let bindings = compile_route_bindings(route);
              assert!(bindings.diagnostics.is_empty(), "{:?}", bindings.diagnostics);
              assert_eq!(bindings.bindings.len(), 6);
              assert_eq!(bindings.bindings[0].source, RouteBindingSource::Path);
              assert_eq!(bindings.bindings[0].source_name, "user_id");
              assert_eq!(bindings.bindings[1].source, RouteBindingSource::Query);
              assert_eq!(bindings.bindings[2].source, RouteBindingSource::Header);
              assert_eq!(bindings.bindings[3].source, RouteBindingSource::Cookie);
              assert_eq!(bindings.bindings[4].source, RouteBindingSource::Body);
              assert_eq!(bindings.bindings[5].source, RouteBindingSource::Form);
          }

          #[test]
          fn unknown_request_source_is_a_parse_error() {
              let tokens = Lexer::new("fn endpoint(limit: Int from matrix) { limit }")
                  .lex()
                  .unwrap();
              let error = Parser::new(tokens).parse_module().unwrap_err();
              assert!(error.to_string().contains("unknown request source 'matrix'"));
          }
          ''')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test request-source contracts
        run: cargo test --test web_request_source_contracts

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/zz-ai-web-param-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ast.rs src/parser.rs src/web/contracts.rs src/web/bindings.rs src/web/validation.rs src/web/runtime_bindings.rs src/web/ir.rs tests/web_request_source_contracts.rs .github/workflows/zz-ai-web-param-sources.yml
          git commit -m "feat(web): compile request-source parameter metadata"
          git push origin HEAD:feat/web-param-request-sources
