name: P0 Nominal Behavior MIR Guard

on:
  push:
    branches:
      - codex/nominal-actor-dispatch

concurrency:
  group: p0-nominal-behavior-mir
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/nominal-actor-dispatch
          fetch-depth: 0

      - name: Pin branch head
        shell: bash
        run: |
          set -euo pipefail
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Carry nominal behavior identity from protocol checking into MIR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1. The transition resolver must recognize a compiler-qualified
          # Actor.behavior identity before considering an untrusted lexical hint.
          identity = Path("src/behavior_identity.rs")
          text = identity.read_text()
          old = '''pub fn resolve_behavior_index_from_hint(
    actor_name_hint: &str,
    behavior: &str,
    behavior_names: &[String],
) -> Result<usize, BehaviorIdentityError> {
    if !actor_name_hint.is_empty() {
'''
          new = '''pub fn resolve_behavior_index_from_hint(
    actor_name_hint: &str,
    behavior: &str,
    behavior_names: &[String],
) -> Result<usize, BehaviorIdentityError> {
    // Semantic passes may already have qualified a known call as
    // `Actor.behavior`. That compiler-owned identity takes precedence over
    // the legacy lexical receiver-name hint.
    if let Some(idx) = behavior_names.iter().position(|name| name == behavior) {
        return Ok(idx);
    }

    if !actor_name_hint.is_empty() {
'''
          if new in text:
              print("behavior identity exact-qualified fast path already present")
          elif old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit("unexpected behavior identity resolver shape")
          identity.write_text(text)

          # 2. The protocol pass already knows the nominal actor schema.
          # After validation, encode that identity in the existing behavior
          # string so downstream HIR does not have to rediscover it.
          protocol = Path("src/actor_protocol.rs")
          text = protocol.read_text()

          old_send = '''        Expr::Send {
            actor,
            behavior,
            args,
            span,
            ..
        } => {
            annotate_expr(actor, env, protocols)?;
            for arg in args.iter_mut() {
                annotate_expr(arg, env, protocols)?;
            }
            let _ = validate_call(actor, behavior, args, env, protocols, *span)?;
            Ok(())
        }
'''
          new_send = '''        Expr::Send {
            actor,
            behavior,
            args,
            span,
            ..
        } => {
            annotate_expr(actor, env, protocols)?;
            for arg in args.iter_mut() {
                annotate_expr(arg, env, protocols)?;
            }
            let actor_name = actor_name_for_expr(actor, env);
            let short_behavior = if let Some(actor_name) = actor_name.as_deref() {
                let prefix = format!("{actor_name}.");
                behavior
                    .strip_prefix(&prefix)
                    .unwrap_or(behavior.as_str())
                    .to_string()
            } else {
                behavior.clone()
            };
            let _ = validate_call(actor, &short_behavior, args, env, protocols, *span)?;
            if let Some(actor_name) = actor_name {
                *behavior = format!("{actor_name}.{short_behavior}");
            }
            Ok(())
        }
'''
          if new_send in text:
              print("send qualification already present")
          elif old_send in text:
              text = text.replace(old_send, new_send, 1)
          else:
              raise SystemExit("unexpected actor protocol send branch shape")

          old_ask = '''        Expr::Ask {
            actor,
            behavior,
            args,
            span,
            ..
        } => {
            annotate_expr(actor, env, protocols)?;
            for arg in args.iter_mut() {
                annotate_expr(arg, env, protocols)?;
            }
            let ask_span = *span;
            let ret = validate_call(actor, behavior, args, env, protocols, ask_span)?;
            if let Some(ret) = ret {
                let placeholder = Expr::Literal(Literal::Unit, ask_span);
                let inner = std::mem::replace(expr, placeholder);
                *expr = Expr::TypeAnnotate {
                    expr: Box::new(inner),
                    ty: ret,
                    span: ask_span,
                };
            }
            Ok(())
        }
'''
          new_ask = '''        Expr::Ask {
            actor,
            behavior,
            args,
            span,
            ..
        } => {
            annotate_expr(actor, env, protocols)?;
            for arg in args.iter_mut() {
                annotate_expr(arg, env, protocols)?;
            }
            let actor_name = actor_name_for_expr(actor, env);
            let short_behavior = if let Some(actor_name) = actor_name.as_deref() {
                let prefix = format!("{actor_name}.");
                behavior
                    .strip_prefix(&prefix)
                    .unwrap_or(behavior.as_str())
                    .to_string()
            } else {
                behavior.clone()
            };
            let ask_span = *span;
            let ret = validate_call(actor, &short_behavior, args, env, protocols, ask_span)?;
            if let Some(actor_name) = actor_name {
                *behavior = format!("{actor_name}.{short_behavior}");
            }
            if let Some(ret) = ret {
                let placeholder = Expr::Literal(Literal::Unit, ask_span);
                let inner = std::mem::replace(expr, placeholder);
                *expr = Expr::TypeAnnotate {
                    expr: Box::new(inner),
                    ty: ret,
                    span: ask_span,
                };
            }
            Ok(())
        }
'''
          if new_ask in text:
              print("ask qualification already present")
          elif old_ask in text:
              text = text.replace(old_ask, new_ask, 1)
          else:
              raise SystemExit("unexpected actor protocol ask branch shape")

          protocol.write_text(text)

          # 3. HIR lowering must consume the same semantically enriched AST
          # that type checking used. Every production caller type-checks first;
          # a protocol-invalid AST therefore fails loudly rather than lowering
          # with guessed dispatch identity.
          hir = Path("src/hir_lower.rs")
          text = hir.read_text()
          old_hir = '''pub fn lower_module(
    ast: &ast::AstModule,
    inferred_decl_types: &FxHashMap<String, Type>,
) -> hir::Module {
    let mut module = hir::Module::new(&ast.name);
'''
          new_hir = '''pub fn lower_module(
    ast: &ast::AstModule,
    inferred_decl_types: &FxHashMap<String, Type>,
) -> hir::Module {
    let annotated_ast = crate::actor_protocol::annotate_module(ast)
        .expect("HIR lowering requires an actor-protocol-valid AST");
    let ast = &annotated_ast;
    let mut module = hir::Module::new(&ast.name);
'''
          if new_hir in text:
              print("HIR protocol enrichment already present")
          elif old_hir in text:
              text = text.replace(old_hir, new_hir, 1)
          else:
              raise SystemExit("unexpected HIR lower_module prologue")
          hir.write_text(text)

          # 4. MIR must stop choosing the first suffix match. A qualified
          # identity resolves exactly; otherwise the short name must be unique.
          mir = Path("src/mir_lower.rs")
          text = mir.read_text()
          old_fn = '''    /// Resolve `send`/`ask actor behavior(...)` to a behavior-table index by
    /// name. Mirrors the stable compiler's `behavior_table_index`: an exact
    /// "ActorName.behavior" match first, falling back to any behavior with a
    /// matching suffix if the receiver expression isn't a bare actor-typed
    /// variable name (a known ambiguity inherited from the stable compiler,
    /// not introduced here).
    fn send_behavior_idx(&self, actor_name_hint: &str, behavior: &str) -> usize {
        let full_name = format!("{}.{}", actor_name_hint, behavior);
        if let Some(idx) = self.behavior_names.iter().position(|n| *n == full_name) {
            return idx;
        }
        let suffix = format!(".{}", behavior);
        self.behavior_names
            .iter()
            .position(|n| n.ends_with(&suffix))
            .unwrap_or(self.behaviors.len())
    }
'''
          new_fn = '''    /// Resolve `send`/`ask actor behavior(...)` without ever choosing an
    /// arbitrary first suffix match. Known calls arrive from HIR with a
    /// compiler-qualified `Actor.behavior` identity. Dynamic calls retain
    /// compatibility only when the short behavior name is globally unique.
    fn send_behavior_idx(&self, actor_name_hint: &str, behavior: &str) -> NuResult<usize> {
        crate::behavior_identity::resolve_behavior_index_from_hint(
            actor_name_hint,
            behavior,
            &self.behavior_names,
        )
        .map_err(|error| compile_err(error.to_string(), Span::default()))
    }
'''
          if new_fn in text:
              print("MIR resolver already migrated")
          elif old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          else:
              raise SystemExit("unexpected send_behavior_idx implementation; refusing broad rewrite")

          old_call = "                let idx = self.ctx.send_behavior_idx(&actor_hint, behavior);\n"
          new_call = "                let idx = self.ctx.send_behavior_idx(&actor_hint, behavior)?;\n"
          count = text.count(old_call)
          if count == 2:
              text = text.replace(old_call, new_call)
          elif count == 0 and text.count(new_call) == 2:
              print("send/ask MIR call sites already migrated")
          else:
              raise SystemExit(
                  f"unexpected send_behavior_idx call-site shape: old={count}, new={text.count(new_call)}"
              )
          mir.write_text(text)
          PY

          cargo fmt --all
          git diff --check

      - name: Validate identity primitives
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features --lib behavior_identity

      - name: Validate typed actor protocol regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --no-default-features --test actor_protocol_nominal

      - name: Validate minimal compiler
        shell: bash
        run: |
          set -euo pipefail
          cargo check --no-default-features

      - name: Validate duplicate-name program reaches receiver-correct MIR
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nominal_actor_dispatch.rs <<'RS'
          use nulang::hir::{Decl, RValue, Stmt};
          use nulang::lexer::Lexer;
          use nulang::parser::Parser;
          use nulang::typechecker::TypeChecker;

          fn collect_send_behaviors(body: &nulang::hir::Body, out: &mut Vec<String>) {
              for stmt in &body.stmts {
                  if let Stmt::Let { value, .. } = stmt {
                      match value {
                          RValue::Send { behavior, .. } | RValue::Ask { behavior, .. } => {
                              out.push(behavior.clone());
                          }
                          RValue::Block(inner) => collect_send_behaviors(inner, out),
                          _ => {}
                      }
                  }
              }
          }

          #[test]
          fn known_receiver_is_qualified_before_mir_resolution() {
              let source = r#"
                  actor First { behavior hit(value: Int) { nil } }
                  actor Second { behavior hit(value: String) { nil } }
                  fn main() {
                      let target = spawn Second {}
                      send target hit("ok")
                  }
              "#;
              let tokens = Lexer::new(source).lex().unwrap();
              let ast = Parser::new(tokens).parse_module().unwrap();
              let mut tc = TypeChecker::new();
              tc.check_module(&ast).unwrap();
              let hir = nulang::hir_lower::lower_module(&ast, &tc.inferred_decl_types);

              let mut behaviors = Vec::new();
              for decl in &hir.decls {
                  if let Decl::Function(function) = decl {
                      collect_send_behaviors(&function.body, &mut behaviors);
                  }
              }
              assert!(
                  behaviors.iter().any(|behavior| behavior == "Second.hit"),
                  "known receiver must carry nominal behavior identity into HIR: {behaviors:?}"
              );

              let mir = nulang::mir_lower::lower_module(&hir).unwrap();
              let second_hit = mir
                  .behaviors
                  .iter()
                  .position(|behavior| behavior.name == "Second.hit")
                  .expect("Second.hit MIR behavior");
              let mut send_indices = Vec::new();
              for function in &mir.functions {
                  for block in &function.blocks {
                      for stmt in &block.stmts {
                          if let nulang::mir::Stmt::Assign {
                              value: nulang::mir::RValue::Send { behavior_idx, .. },
                              ..
                          } = stmt
                          {
                              send_indices.push(*behavior_idx);
                          }
                      }
                  }
              }
              assert!(
                  send_indices.contains(&second_hit),
                  "send must lower to Second.hit ({second_hit}), got {send_indices:?}"
              );
          }
          RS
          mkdir -p tests/.p0-temp
          cp /tmp/nominal_actor_dispatch.rs tests/nominal_actor_dispatch_p0.rs
          cargo test --no-default-features --test nominal_actor_dispatch_p0
          rm tests/nominal_actor_dispatch_p0.rs
          rmdir tests/.p0-temp 2>/dev/null || true

      - name: Verify isolated product diff
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
          changed="$(git diff --name-only)"
          printf 'working-tree paths:\n%s\n' "$changed"
          expected="$(printf '%s\n' \
            src/actor_protocol.rs \
            src/behavior_identity.rs \
            src/hir_lower.rs \
            src/mir_lower.rs)"
          test "$changed" = "$expected"

      - name: Guard exact head and land validated nominal identity
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/actor_protocol.rs \
            src/behavior_identity.rs \
            src/hir_lower.rs \
            src/mir_lower.rs; then
            echo "nominal behavior identity integration already landed; no product commit needed"
            exit 0
          fi

          git fetch origin codex/nominal-actor-dispatch
          remote_head="$(git rev-parse origin/codex/nominal-actor-dispatch)"
          if [ "$remote_head" != "$START_HEAD" ]; then
            echo "branch advanced during validation: $remote_head (expected $START_HEAD)" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/actor_protocol.rs \
            src/behavior_identity.rs \
            src/hir_lower.rs \
            src/mir_lower.rs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' \
            src/actor_protocol.rs \
            src/behavior_identity.rs \
            src/hir_lower.rs \
            src/mir_lower.rs)"
          git commit -m 'fix(compiler): preserve nominal actor behavior identity'
          git push origin HEAD:codex/nominal-actor-dispatch
