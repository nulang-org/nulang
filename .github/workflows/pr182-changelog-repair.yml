name: PR 182 changelog repair

on:
  push:
    branches:
      - fix/value-pointer-payload-safety

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/value-pointer-payload-safety
          fetch-depth: 0
      - name: Add pointer-width safety changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '### Added since 1.0.0-frozen — 2026-09-11 (backend parity + durable determinism)\n'
          entry = '''### Runtime soundness — 2026-09-12\n- **NaN-box pointer width safety** (`src/vm.rs`): `Value::ptr` now rejects host\n  addresses that do not fit the 48-bit payload instead of silently masking high\n  address bits and manufacturing a different pointer. Valid in-range pointers\n  keep the existing representation and behavior.\n\n'''
          if entry in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('stable-tier insertion marker changed')
          p.write_text(s.replace(marker, entry + marker, 1))
          PY
          git diff --check
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/value-pointer-payload-safety
          if [ "$(git rev-parse origin/fix/value-pointer-payload-safety)" != "$GITHUB_SHA" ]; then
            echo 'branch advanced during validation; refusing stale push'
            exit 1
          fi
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs(changelog): note Value pointer width safety'
          git push origin HEAD:fix/value-pointer-payload-safety
