name: Repair Main CI Baseline

on:
  push:
    branches: [fix/main-ci-baseline]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/main-ci-baseline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove no-default warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/runtime/actor.rs')
          text = path.read_text()
          old = '        let payload_len = payload.len();\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale payload_len binding, found {count}')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Format tree
        run: cargo fmt --all

      - name: Validate formatting
        run: cargo fmt --all -- --check

      - name: Validate minimal all-targets build
        run: cargo check --all-targets --no-default-features

      - name: Validate default all-targets build
        run: cargo check --all-targets

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src benches
          if git diff --cached --quiet; then
            echo 'No generated repair changes to commit.'
            exit 0
          fi
          git commit -m 'style: restore main CI baseline'
          git push origin HEAD:fix/main-ci-baseline
