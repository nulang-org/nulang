name: Apply cluster gossip GREEN

on:
  pull_request:
    paths:
      - '.github/workflows/apply-cluster-gossip-green-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact gossip cadence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/cluster.rs')
          text = path.read_text()

          replacements = [
              (
                  "//! Membership changes propagate via gossip. Each tick, a node selects a random\n//! subset of healthy peers and sends them a compact view of the membership\n",
                  "//! Membership changes propagate via gossip. At a bounded cadence, a node selects\n//! a random subset of healthy peers and sends them a compact view of the membership\n",
              ),
              (
                  "/// Default interval between heartbeats (500ms).\nconst DEFAULT_HEARTBEAT_INTERVAL: Duration = Duration::from_millis(500);\n\n/// Default timeout before marking a node suspicious (2s).\n",
                  "/// Default interval between heartbeats (500ms).\nconst DEFAULT_HEARTBEAT_INTERVAL: Duration = Duration::from_millis(500);\n\n/// Default interval between gossip rounds. This matches the runtime's intended\n/// cluster-maintenance cadence while preventing hot network polls from turning\n/// gossip into an unbounded packet source.\nconst DEFAULT_GOSSIP_INTERVAL: Duration = Duration::from_millis(100);\n\n/// Default timeout before marking a node suspicious (2s).\n",
              ),
              (
                  "    /// Timestamp of last heartbeat we sent.\n    last_heartbeat_sent: Instant,\n\n    /// Optional virtual clock for deterministic testing.\n",
                  "    /// Timestamp of last heartbeat we sent.\n    last_heartbeat_sent: Instant,\n\n    /// Timestamp of the last gossip round. `None` permits one immediate\n    /// dissemination after a peer becomes available.\n    last_gossip_sent: Option<Instant>,\n\n    /// Optional virtual clock for deterministic testing.\n",
              ),
              (
                  "            suspicion_duration: DEFAULT_SUSPICION_DURATION,\n            last_heartbeat_sent: now,\n            split_brain: None,\n",
                  "            suspicion_duration: DEFAULT_SUSPICION_DURATION,\n            last_heartbeat_sent: now,\n            last_gossip_sent: None,\n            split_brain: None,\n",
              ),
              (
                  "        // ------------------------------------------------------------------\n        // 5. Gossip to a random subset of healthy nodes\n        // ------------------------------------------------------------------\n        let gossip_targets = self.pick_gossip_targets(GOSSIP_FANOUT);\n        if !gossip_targets.is_empty() {\n            actions.push(ClusterAction::SendGossip {\n                targets: gossip_targets,\n            });\n        }\n",
                  "        // ------------------------------------------------------------------\n        // 5. Gossip to a random subset of healthy nodes. Unlike callers of\n        //    `tick`, gossip has its own cadence so a hot network poll loop\n        //    cannot flood the bounded transport queues with control traffic.\n        // ------------------------------------------------------------------\n        let gossip_due = self\n            .last_gossip_sent\n            .map_or(true, |last| now.duration_since(last) >= DEFAULT_GOSSIP_INTERVAL);\n        if gossip_due {\n            let gossip_targets = self.pick_gossip_targets(GOSSIP_FANOUT);\n            if !gossip_targets.is_empty() {\n                self.last_gossip_sent = Some(now);\n                actions.push(ClusterAction::SendGossip {\n                    targets: gossip_targets,\n                });\n            }\n        }\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check patch whitespace
        run: git diff --check
      - name: GREEN focused contract
        run: >-
          cargo test --locked --no-default-features
          --test cluster_gossip_throttle -- --nocapture
      - name: Commit GREEN source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-cluster-gossip-green-pr.yml
          git add src/runtime/cluster.rs
          git commit -m 'fix(cluster): rate-limit gossip emission'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
