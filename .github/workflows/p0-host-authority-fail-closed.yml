name: P0 Host Authority Fail Closed

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: p0-host-authority-fail-closed
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply fail-closed host-authority policy
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/callbacks.rs")
          text = path.read_text()

          anchor = (
              '        ("Provider", Some("ask")) => other("Provider", "Ask", Some(string_arg(0)?)),\n'
              '        ("Inference" | "LLM", Some("ask")) => other("Inference", "Ask", None),\n'
              '        _ => return Ok(None),\n'
          )
          replacement = (
              '        ("Provider", Some("ask")) => other("Provider", "Ask", Some(string_arg(0)?)),\n'
              '        ("Inference" | "LLM", Some("ask")) => other("Inference", "Ask", None),\n'
              '        (\n'
              '            "FS" | "Realtime" | "Env" | "Secret" | "Http" | "Process" | "System"\n'
              '            | "DB" | "Python" | "Provider" | "Inference" | "LLM",\n'
              '            operation,\n'
              '        ) => {\n'
              '            return Err(format!(\n'
              '                "unmapped host-authority operation {effect_name}.{}",\n'
              '                operation.unwrap_or("<missing>")\n'
              '            ));\n'
              '        }\n'
              '        _ => return Ok(None),\n'
          )

          if anchor not in text:
              raise SystemExit("authority mapping anchor not found; refusing non-deterministic patch")
          if "mod host_authority_policy_tests" in text:
              raise SystemExit("host-authority regression tests already present")
          text = text.replace(anchor, replacement, 1)

          marker = "\n/// Parse an outbound HTTP URL into the exact TCP authority it needs."
          if marker not in text:
              raise SystemExit("host-authority test insertion marker not found")

          test_lines = [
              "",
              "#[cfg(test)]",
              "mod host_authority_policy_tests {",
              "    use super::required_host_authority;",
              "",
              "    #[test]",
              "    fn sensitive_namespaces_fail_closed_for_unmapped_operations() {",
              "        for namespace in [",
              "            \"FS\", \"Realtime\", \"Env\", \"Secret\", \"Http\", \"Process\", \"System\",",
              "            \"DB\", \"Provider\", \"Inference\", \"LLM\",",
              "        ] {",
              "            let error = required_host_authority(namespace, Some(\"__unmapped__\"), &[], &[])",
              "                .expect_err(\"sensitive host namespace must fail closed\");",
              "            assert!(error.contains(\"unmapped host-authority operation\"), \"{namespace}: {error}\");",
              "        }",
              "    }",
              "",
              "    #[test]",
              "    fn missing_operation_in_sensitive_namespace_fails_closed() {",
              "        for namespace in [\"FS\", \"Python\", \"Http\", \"DB\"] {",
              "            let error = required_host_authority(namespace, None, &[], &[])",
              "                .expect_err(\"missing operation in sensitive namespace must fail closed\");",
              "            assert!(error.contains(\"<missing>\"), \"{namespace}: {error}\");",
              "        }",
              "    }",
              "",
              "    #[test]",
              "    fn python_unknown_operation_still_requires_authority() {",
              "        let grant = required_host_authority(\"Python\", Some(\"future_op\"), &[], &[])",
              "            .expect(\"Python operation should classify\");",
              "        assert!(grant.is_some());",
              "    }",
              "",
              "    #[test]",
              "    fn mixed_web_namespace_keeps_local_rendering_operations_ungated() {",
              "        for operation in [\"html\", \"text\", \"raw\", \"route\", \"redirect\", \"param\"] {",
              "            let grant = required_host_authority(\"Web\", Some(operation), &[], &[])",
              "                .expect(\"local Web operation should classify without error\");",
              "            assert!(grant.is_none(), \"{operation} unexpectedly required host authority\");",
              "        }",
              "    }",
              "",
              "    #[test]",
              "    fn unknown_non_sensitive_namespace_remains_outside_authority_gate() {",
              "        let grant = required_host_authority(\"Test\", Some(\"mock\"), &[], &[])",
              "            .expect(\"non-sensitive namespace should remain outside host-authority gate\");",
              "        assert!(grant.is_none());",
              "    }",
              "}",
              "",
          ]
          text = text.replace(marker, "\n".join(test_lines) + marker, 1)
          path.write_text(text)

      - name: Format
        run: cargo fmt --all

      - name: Verify focused authority regressions
        run: |
          cargo test --lib host_authority_policy_tests -- --nocapture
          cargo test --lib host_authority -- --nocapture

      - name: Verify default and minimal builds
        run: |
          cargo check --lib
          cargo check --lib --no-default-features
          git diff --check

      - name: Commit validated product change and remove staging workflow
        env:
          BRANCH: integration/p0-stabilization-2026-09-14
        run: |
          rm .github/workflows/p0-host-authority-fail-closed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/callbacks.rs .github/workflows/p0-host-authority-fail-closed.yml
          git diff --cached --check
          git commit -m "fix(authority): fail closed on unmapped host operations"
          git push origin "HEAD:${BRANCH}"
