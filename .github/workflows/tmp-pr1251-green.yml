name: Temporary PR1251 GREEN validation

on:
  push:
    branches:
      - tmp/pr1251-green-20261002

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm delivery-failure regression is RED
        shell: bash
        run: |
          set +e
          cargo test --locked --test runtime_delivery_failure_system_priority -- --nocapture 2>&1 | tee /tmp/pr1251-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected the delivery-failure regression to fail before the production fix"
            exit 1
          fi
          grep -Fq "delivery-failure system notification must bypass normal mailbox capacity" /tmp/pr1251-red.log

      - name: Apply exact system-lane delivery-failure fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/distributed.rs")
          source = path.read_text()
          old = '''pub(crate) fn notify_delivery_failed(runtime: &mut Runtime, sender_id: u64, reason: &str) {
              if sender_id == 0 {
                  return;
              }
              if !runtime.actors.get(&sender_id).is_some() {
                  return;
              }
              let code = delivery_failure_code(reason);
              let fail_payload = vec![Value::int(code), Value::nil()];
              runtime.send_message_by_id(sender_id, 0, &fail_payload);
          }
          '''
          new = '''pub(crate) fn notify_delivery_failed(runtime: &mut Runtime, sender_id: u64, reason: &str) {
              if sender_id == 0 {
                  return;
              }
              if !runtime.actors.get(&sender_id).is_some() {
                  return;
              }
              let code = delivery_failure_code(reason);
              let failure = Message {
                  behavior_id: 0,
                  payload: MessagePayload::from_slice(&[Value::int(code), Value::nil()]),
                  sender: 0,
                  priority: MessagePriority::System,
                  trace_id: None,
              };
              if let Some(actor) = runtime.actors.get_mut(&sender_id) {
                  let _ = actor.mailbox.push(failure);
              }
              runtime.enqueue_actor(sender_id);
          }
          '''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one delivery-failure notifier body, found {count}")
          path.write_text(source.replace(old, new, 1))

      - name: Focused regression is GREEN
        run: cargo test --locked --test runtime_delivery_failure_system_priority -- --nocapture

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: No-default-features check
        run: cargo check --locked --no-default-features

      - name: Commit validated production patch and remove validator
        shell: bash
        run: |
          rm .github/workflows/tmp-pr1251-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/distributed.rs .github/workflows/tmp-pr1251-green.yml
          git diff --cached --check
          git commit -m "fix(distribution): deliver failure notifications on system lane"
          git push origin HEAD:tmp/pr1251-green-20261002
