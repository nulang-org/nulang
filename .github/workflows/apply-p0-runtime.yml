name: Apply P0 runtime isolation fix

on:
  push:
    branches:
      - fix/compiled-runtime-fuzz-p0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply scoped runtime edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected context once, found {count}")
              p.write_text(text.replace(old, new, 1))
              print(f"updated {path}")

          old = "\n".join([
              "/// Record a runtime error for retrieval by the AOT driver (no-op semantics",
              "/// for the tiered JIT, which never inspects this slot).",
              "pub fn aot_set_pending_error(msg: String) {",
              "    AOT_PENDING_ERROR.with(|e| {",
              "        *e.borrow_mut() = Some(msg);",
              "    });",
              "}",
          ])
          new = "\n".join([
              "/// Record a compiled-runtime error for retrieval at the backend boundary.",
              "///",
              "/// Native code cannot unwind. Preserve the first error until the backend",
              "/// consumes it so operations on a nil sentinel cannot replace the cause.",
              "pub fn aot_set_pending_error(msg: String) {",
              "    AOT_PENDING_ERROR.with(|e| {",
              "        let mut pending = e.borrow_mut();",
              "        if pending.is_none() {",
              "            *pending = Some(msg);",
              "        }",
              "    });",
              "}",
          ])
          replace_once("src/jit/runtime.rs", old, new)

          old = "    pub fn run(&self) -> NuResult<u64> {\n"
          new = old + "        // Thread-local compiled errors belong to one AOT invocation only.\n        let _ = crate::jit::runtime::aot_take_pending_error();\n        let _ = crate::jit::runtime::take_jit_pending_vm_error();\n\n"
          replace_once("src/aot/mod.rs", old, new)

          old = "        if let Some(msg) = crate::jit::runtime::aot_take_pending_error() {\n"
          new = "        let aot_error = crate::jit::runtime::aot_take_pending_error();\n        let jit_error = crate::jit::runtime::take_jit_pending_vm_error();\n        if let Some(msg) = aot_error.or(jit_error) {\n"
          replace_once("src/aot/mod.rs", old, new)

          old = "\n".join([
              "        let action = jit.tiered_execute_step_typed(module_idx, pc, module, &mut regs, constants);",
              "        crate::jit::runtime::clear_jit_vm();",
              "        crate::jit::runtime::clear_jit_constants();",
              "        crate::jit::runtime::clear_jit_callbacks();",
          ]) + "\n"
          new = "\n".join([
              "        // Start each native JIT region with clean thread-local error state.",
              "        let _ = crate::jit::runtime::take_jit_pending_vm_error();",
              "        let _ = crate::jit::runtime::aot_take_pending_error();",
              "        let action = jit.tiered_execute_step_typed(module_idx, pc, module, &mut regs, constants);",
              "        crate::jit::runtime::clear_jit_vm();",
              "        crate::jit::runtime::clear_jit_constants();",
              "        crate::jit::runtime::clear_jit_callbacks();",
              "",
              "        // Compiled helpers may report through either channel. Consume both",
              "        // before another backend invocation can observe stale state.",
              "        let jit_error = crate::jit::runtime::take_jit_pending_vm_error();",
              "        let aot_error = crate::jit::runtime::aot_take_pending_error();",
              "        if let Some(msg) = jit_error.or(aot_error) {",
              "            self.jit_pending_error = Some(msg);",
              "            return true;",
              "        }",
          ]) + "\n"
          replace_once("src/vm.rs", old, new)

          old = "\n".join([
              "                } else {",
              "                    let payload = emit_sext48(builder, val);",
              "                    let neg = builder.ins().ineg(payload);",
              "                    Ok(emit_tag_int(builder, neg))",
              "                }",
          ])
          new = "\n".join([
              "                } else {",
              "                    // Boxed values can still be nil even when MIR metadata says Int",
              "                    // (for example, a negative integer exponent). Preserve runtime",
              "                    // type/error semantics instead of re-tagging nil as integer zero.",
              "                    call_helper(builder, helpers, \"nulang_ineg\", &[val])",
              "                }",
          ])
          replace_once("src/aot/codegen.rs", old, new)

          anchor = "mod tests {\n    use super::*;\n"
          test = "\n".join([
              "mod tests {",
              "    use super::*;",
              "",
              "    #[test]",
              "    fn differential_unary_negation_and_error_isolation_regressions() {",
              "        let cases = [",
              "            \"--(1 + 2,)\",",
              "            \"-3 ** -2\",",
              "            \"-fn(x) { x + 1 }\",",
              "            \"fn pick(b) { if b then 1 else -1 }; pick(true) * pick(-false)\",",
              "            \"0\",",
              "        ];",
              "        for source in cases {",
              "            match differential_fuzz_one(source) {",
              "                Ok(DiffOutcome::Agreed { .. }) => {}",
              "                Ok(other) => panic!(\"regression case not fully executed: {:?}: {:?}\", source, other),",
              "                Err(msg) => panic!(\"backend divergence for {:?}: {}\", source, msg),",
              "            }",
              "        }",
              "        match differential_fuzz_one(\"0\") {",
              "            Ok(DiffOutcome::Agreed { .. }) => {}",
              "            Ok(other) => panic!(\"isolation sentinel not executed: {:?}\", other),",
              "            Err(msg) => panic!(\"compiled error leaked into isolation sentinel: {}\", msg),",
              "        }",
              "    }",
              "",
          ])
          replace_once("src/fuzz.rs", anchor, test)
          PY

      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Run targeted backend regression
        run: cargo test --lib differential_unary_negation_and_error_isolation_regressions -- --nocapture

      - name: Commit verified runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aot/codegen.rs src/aot/mod.rs src/jit/runtime.rs src/vm.rs src/fuzz.rs
          git commit -m "fix(runtime): isolate compiled backend errors"
          git push origin HEAD:fix/compiled-runtime-fuzz-p0

      - name: Run focused differential fuzz
        env:
          NULANG_FUZZ_ITERATIONS: "1000"
          NULANG_FUZZ_SHARD_ID: "0"
        run: cargo test --lib fuzz_differential_extended -- --ignored --nocapture
