name: Finalize P0 fuzz observability

on:
  push:
    branches:
      - fix/compiled-runtime-fuzz-p0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply deterministic repro and changelog edits
        run: python3 .github/scripts/finalize_p0_fuzz.py

      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Verify deterministic artifact format
        run: cargo test --lib differential_divergence_artifact_contains_repro_metadata -- --nocapture

      - name: Commit verified observability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fuzz.rs CHANGELOG.md
          git commit -m "fix(fuzz): persist deterministic divergence repros"
          git push origin HEAD:fix/compiled-runtime-fuzz-p0

      - name: Exercise extended differential fuzz loop
        env:
          NULANG_FUZZ_ITERATIONS: "100"
          NULANG_FUZZ_SHARD_ID: "0"
          NULANG_FUZZ_ARTIFACT_DIR: /tmp/nulang-fuzz
        run: cargo test --lib fuzz_differential_extended -- --ignored --nocapture
