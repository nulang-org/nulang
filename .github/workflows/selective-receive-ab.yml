name: Empty selective receive exact-base A/B

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref or SHA to compare against
        required: false
        default: main
  pull_request:
    paths:
      - '.github/workflows/selective-receive-ab.yml'
      - 'scripts/selective_receive_ab_bench.py'
      - 'scripts/tests/test_selective_receive_ab_bench.py'
      - 'benches/actor_bench.rs'
      - 'src/runtime/mailbox.rs'

concurrency:
  group: selective-receive-ab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: Exact-base empty receive Criterion A/B
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Test comparator contracts
        run: python3 -m unittest scripts/tests/test_selective_receive_ab_bench.py

      # Keep this an opt-in diagnostic, not an unreviewed performance gate.
      # No cache, artifact uploads, or modification of the comparison base.
      - name: Paired Criterion comparison
        env:
          BASE_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}"
        run: |
          python3 scripts/selective_receive_ab_bench.py \
            --base-ref "$BASE_REF" \
            --pairs 8 \
            --warmup 1 \
            --output selective-receive-ab.json

      - name: Publish same-host comparison
        if: always() && hashFiles('selective-receive-ab.json') != ''
        run: |
          {
            echo '## Empty selective receive Criterion exact-base A/B'
            echo
            echo 'The exact same benchmark module is built against the parent and candidate libraries.'
            echo
            echo 'This isolates cold and repeated empty selective-receive latency; active actor throughput is a separate gate.'
            echo
            echo '### First poll, repeated empty polls, and first arrival after an empty poll'
            echo
            echo '```json'
            jq '.cases' selective-receive-ab.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
