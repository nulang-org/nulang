name: Temporary #1195 changelog patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/workflow-consume-custom-event-replay-20260930' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/workflow-consume-custom-event-replay-20260930
          fetch-depth: 0

      - name: Apply exact prefix-only changelog edit
        shell: python
        run: |
          from pathlib import Path

          path = Path("CHANGELOG.md")
          old = path.read_text(encoding="utf-8")
          marker = "# Nulang Changelog\n"
          heading = "### Deterministic workflow custom-event replay — 2026-10-01"
          assert old.startswith(marker), "unexpected changelog header"
          assert heading not in old, "entry already present"

          entry = """### Deterministic workflow custom-event replay — 2026-10-01
          - **Replay now consumes an already-committed custom workflow event when its deterministic replay identity and payload match, instead of appending the event a second time.** The activation-local replay cursor advances only after that exact committed event is accepted.
          - **Conflicting history fails closed.** If the same replay identity is already committed with a different event or payload, replay leaves durable history and the replay cursor unchanged rather than manufacturing a divergent continuation.

          """
          new = marker + entry + old[len(marker):]
          assert new.endswith(old[len(marker):]), "non-prefix changelog mutation"
          assert len(new.encode("utf-8")) - len(old.encode("utf-8")) == len(entry.encode("utf-8")), "unexpected byte delta"
          path.write_text(new, encoding="utf-8")

      - name: Remove temporary workflow and verify diff
        run: |
          git rm .github/workflows/tmp-1195-changelog-pr.yml
          git diff HEAD --check
          test "$(git diff HEAD --name-only | sort)" = $'.github/workflows/tmp-1195-changelog-pr.yml\nCHANGELOG.md'
          test "$(git diff HEAD --numstat -- CHANGELOG.md | cut -f2)" = "0"

      - name: Commit exact patch
        run: |
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached HEAD --name-only | sort)" = $'.github/workflows/tmp-1195-changelog-pr.yml\nCHANGELOG.md'
          git commit -m "docs(changelog): record workflow custom-event replay"
          git push origin HEAD:fix/workflow-consume-custom-event-replay-20260930
