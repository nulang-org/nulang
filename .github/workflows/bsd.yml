name: BSD portability

# OpenBSD and NetBSD are source-build candidates, not public binary releases.
# Run the minimal portable bytecode CLI natively on both to find regressions.
on:
  pull_request:
    paths:
      - '.github/workflows/bsd.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'crates/**'
      - 'examples/01_hello.nula'
      - 'examples/08_actors.nula'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bsd.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'crates/**'
      - 'examples/01_hello.nula'
      - 'examples/08_actors.nula'

permissions:
  contents: read

jobs:
  openbsd:
    name: OpenBSD x86_64 (portable CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run Nulang on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          mem: 8192
          prepare: |
            pkg_add rust
          run: |
            set -eu
            export CARGO_TARGET_DIR=target/bsd-openbsd
            rustc --version
            cargo --version
            cargo build --locked --no-default-features --bin nulang
            bin="target/bsd-openbsd/debug/nulang"
            "$bin" --version
            test "$("$bin" --eval 'perform IO.print("bsd-smoke")')" = "bsd-smoke"
            "$bin" examples/01_hello.nula
            "$bin" examples/08_actors.nula

  netbsd:
    name: NetBSD x86_64 (portable CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run Nulang on NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          usesh: true
          mem: 8192
          prepare: |
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:/usr/sbin:/usr/bin:$PATH"
            if [ -x /usr/pkg/bin/pkgin ]; then
              /usr/pkg/bin/pkgin update
              /usr/pkg/bin/pkgin -y install rust
            else
              export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/10.1/All"
              /usr/sbin/pkg_add rust
            fi
          run: |
            set -eu
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:/usr/sbin:/usr/bin:$PATH"
            export CARGO_TARGET_DIR=target/bsd-netbsd
            rustc --version
            cargo --version
            cargo build --locked --no-default-features --bin nulang
            bin="target/bsd-netbsd/debug/nulang"
            "$bin" --version
            test "$("$bin" --eval 'perform IO.print("bsd-smoke")')" = "bsd-smoke"
            "$bin" examples/01_hello.nula
            "$bin" examples/08_actors.nula
