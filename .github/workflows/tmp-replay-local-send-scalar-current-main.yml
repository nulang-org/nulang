name: Replay scalar local-send fast path on current main

on:
  push:
    branches:
      - perf/local-send-scalar-fastpath-current-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/local-send-scalar-fastpath-current-main
          fetch-depth: 0

      - name: Replay measured scalar-send delta only
        shell: bash
        run: |
          set -euo pipefail
          base=6266a6ea3993372c3ca989c98cdcb2d000abe330
          head=35fccd2470c5c99a9857b8f0a8a72e8a03d1cdc6
          git diff "$base" "$head" -- src/runtime/mod.rs src/runtime/tests.rs | git apply --3way --index

      - name: Add current-main changelog entry and remove replay workflow
        shell: python
        run: |
          from pathlib import Path
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "# Nulang Changelog\n"
          title = "### Scalar local-send fast path on current main — 2026-10-01\n"
          assert text.startswith(heading)
          assert title not in text
          entry = (
              title
              + "- **Primitive resident local sends combine mailbox admission, readiness transition, priority capture, and receive-wait inspection under one target-actor borrow.** Pointer/object payloads retain the existing ORCA/object-store reference-tracked path.\n"
              + "- **This is the measured #1162 optimization replayed without the later routing shortcut.** Existing current-main local-send layer probes and the exact-parent A/B workflow remain the promotion authority.\n\n"
          )
          changelog.write_text(text.replace(heading, heading + entry, 1), encoding="utf-8")

      - name: Format and verify scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-replay-local-send-scalar-current-main.yml
          cargo fmt --all
          git add -A
          git diff --cached --check
          cargo fmt --all -- --check

      - name: Compile and run focused runtime tests
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features --lib runtime::tests -- --test-threads=1

      - name: Commit current-main replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "perf(runtime): replay scalar local-send fast path on current main"
          git push origin HEAD:perf/local-send-scalar-fastpath-current-main
