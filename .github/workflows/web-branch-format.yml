name: Web Branch Formatting Repair

on:
  push:
    branches:
      - feat/native-web-contracts

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[web-format-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/native-web-contracts
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --no-self-update
      - name: Format branch
        run: |
          cargo +1.95.0 fmt --all
      - name: Remove temporary workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/web-branch-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(web): apply rustfmt [web-format-applied]'
          git push origin HEAD:feat/native-web-contracts
