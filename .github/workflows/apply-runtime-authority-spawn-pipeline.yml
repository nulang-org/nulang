name: Apply runtime authority spawn pipeline

on:
  push:
    branches: [codex/runtime-capability-spawn-pipeline]
    paths:
      - .github/workflows/apply-runtime-authority-spawn-pipeline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Validate helper runner
        run: echo ready
