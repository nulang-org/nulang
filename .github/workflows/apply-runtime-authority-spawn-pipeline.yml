''',
              '''                    target_node: target_operand,
                    capabilities: capabilities.clone(),
                    ty: ty.clone(),
'''
          )

          replace_once(
              "src/mir_codegen.rs",
              '''                target_node,
                capabilities: _,
            } => {
                if let Some(node) = target_node {
''',
