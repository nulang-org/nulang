name: Apply runtime authority spawn pipeline

on:
  push:
    branches: [codex/runtime-capability-spawn-pipeline]
    paths:
      - .github/workflows/apply-runtime-authority-spawn-pipeline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply exact source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          parser = Path("src/parser.rs")
          text = parser.read_text()
          marker = "    fn parse_spawn(&mut self) -> NuResult<Expr> {\n"
          if text.count(marker) != 1:
              raise SystemExit("src/parser.rs: parse_spawn marker mismatch")
          helper = r'''    /// Parse explicit runtime-authority grants attached to a spawn.
    ///
    /// Source syntax intentionally accepts only a narrow, auditable form:
    /// `Namespace::Action` or `Namespace::Action("resource")`.  The latter is
    /// canonicalized to `Namespace::Action(resource)` so every later compiler
    /// and runtime layer compares the same token bytes.
    fn parse_spawn_authority_grants(&mut self) -> NuResult<Vec<String>> {
        if !self.consume_if(&TokenKind::With) {
            return Ok(Vec::new());
        }

        self.expect(TokenKind::LBracket)?;
        self.skip_newlines();
        let mut grants = Vec::new();

        while !self.match_token(&TokenKind::RBracket) && !self.is_at_end() {
            let grant_span = self.current_span();
            let namespace = self.expect_ident("runtime authority namespace")?;
            self.expect(TokenKind::DoubleColon)?;
            let action = self.expect_ident("runtime authority action")?;
            let resource = if self.consume_if(&TokenKind::LParen) {
                let resource = self.expect_string("runtime authority resource string")?;
                self.expect(TokenKind::RParen)?;
                Some(resource)
            } else {
                None
            };

            let raw = match resource {
                Some(resource) => format!("{}::{}({})", namespace, action, resource),
                None => format!("{}::{}", namespace, action),
            };
            crate::runtime_authority::AuthorityToken::parse(raw.clone()).map_err(|err| {
                NuError::parse_error(
                    format!("Invalid runtime authority grant: {}", err),
                    grant_span,
                )
            })?;
            grants.push(raw);

            self.skip_newlines();
            if self.consume_if(&TokenKind::Comma) {
                self.skip_newlines();
            } else {
                break;
            }
        }

        self.expect(TokenKind::RBracket)?;
        Ok(grants)
    }

'''
          parser.write_text(text.replace(marker, helper + marker, 1))

          replace_once(
              "src/parser.rs",
              '''        // Optional named registration: `spawn Foo() as "name"`
        let register_as = if self.consume_if(&TokenKind::As) {
            Some(self.expect_string("actor name")?)
        } else {
            None
        };
''',
              '''        // Optional runtime-authority grants: `spawn Foo() with [Net::TcpOut("host:443")]`.
        // Parse these before named registration so `spawn Foo() with [...] as "name"`
        // has one deterministic grammar.
        let capabilities = self.parse_spawn_authority_grants()?;

        // Optional named registration: `spawn Foo() as "name"`
        let register_as = if self.consume_if(&TokenKind::As) {
