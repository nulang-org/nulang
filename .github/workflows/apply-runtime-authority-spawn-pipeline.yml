                    if !capabilities.is_empty() {
                        return Err(compile_err(
                            "remote spawn with runtime authority grants is unsupported until authenticated grant propagation is versioned",
                            Span::default(),
                        ));
                    }
'''
          )
          replace_once(
              "src/mir_codegen.rs",
              '''                    self.emit(Instruction::new3(
                        OpCode::Spawn,
                        ((*behavior_idx >> 8) & 0xFF) as u8,
                        (*behavior_idx & 0xFF) as u8,
                        dst,
                    ));
                    if !init.is_empty() {
''',
              '''                    self.emit(Instruction::new3(
                        OpCode::Spawn,
