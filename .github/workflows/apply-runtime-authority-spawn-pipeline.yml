                    if !capabilities.is_empty() {
                        self.module
                            .spawn_capability_grants
                            .push((pc, capabilities.clone()));
                    }
                    if !init.is_empty() {
'''
          )

          Path("tests/runtime_authority_spawn_pipeline.rs").write_text(r'''use nulang::bytecode::CodeModule;
use nulang::lexer::Lexer;
use nulang::parser::Parser;
use nulang::typechecker::TypeChecker;
use nulang::types::NuResult;

fn compile(source: &str) -> NuResult<CodeModule> {
    let tokens = Lexer::new(source).lex()?;
    let ast = Parser::new(tokens).parse_module()?;
    let mut type_checker = TypeChecker::new();
    type_checker.check_module(&ast)?;
    let hir = nulang::hir_lower::lower_module(&ast, &type_checker.inferred_decl_types);
    let mut mir = nulang::mir_lower::lower_module(&hir)?;
    nulang::mir_codegen::compile_mir(&mut mir, "runtime-authority-test")
}

const ACTOR: &str = r#"
actor Worker {
    state count: Int = 0
    behavior ping() { self.count }
}
"#;

#[test]
fn local_spawn_grants_reach_bytecode_side_table() {
    let source = format!(
        "{}\nfn main() {{ spawn Worker() with [Net::TcpOut(\"api.example.com:443\"), Fs::Read(\"/data/models\")] }}",
        ACTOR
    );
    let module = compile(&source).expect("compile local spawn with grants");
    assert_eq!(module.spawn_capability_grants.len(), 1);
    assert_eq!(
        module.spawn_capability_grants[0].1,
        vec![
            "Net::TcpOut(api.example.com:443)".to_string(),
            "Fs::Read(/data/models)".to_string(),
        ]
    );
}

#[test]
fn remote_spawn_with_grants_fails_closed() {
    let source = format!(
        "{}\nfn main() {{ spawn@1 Worker() with [Net::TcpOut(\"api.example.com:443\")] }}",
        ACTOR
    );
    let err = compile(&source).expect_err("remote grants must not be silently erased");
    assert!(
        err.to_string().contains("remote spawn with runtime authority grants is unsupported"),
        "unexpected error: {err}"
    );
}

#[test]
fn grant_resource_must_be_a_string_literal() {
    let source = format!(
        "{}\nfn main() {{ spawn Worker() with [Net::TcpOut(443)] }}",
        ACTOR
    );
    let tokens = Lexer::new(&source).lex().expect("lex");
    let err = Parser::new(tokens)
        .parse_module()
        .expect_err("non-string authority resources must be rejected by the parser");
    assert!(err.to_string().contains("runtime authority resource string"));
}
''')
          PY

      - name: Format
        run: cargo fmt --all

      - name: Focused tests
        run: cargo test --test runtime_authority_spawn_pipeline

      - name: Remove temporary patch workflow
        run: rm .github/workflows/apply-runtime-authority-spawn-pipeline.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.rs src/hir_lower.rs src/mir_codegen.rs tests/runtime_authority_spawn_pipeline.rs .github/workflows/apply-runtime-authority-spawn-pipeline.yml
          git commit -m "feat(compiler): preserve spawn authority grants"
          git push origin "HEAD:${GITHUB_REF_NAME}"
