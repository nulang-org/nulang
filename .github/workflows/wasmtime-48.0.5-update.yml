name: Temporary Wasmtime 48.0.5 security update

on:
  push:
    branches:
      - fix/wasmtime-48.0.5-rustsec
    paths:
      - .github/workflows/wasmtime-48.0.5-update.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/wasmtime-48.0.5-rustsec

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bump Wasmtime and regenerate lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          old = 'wasmtime = { version = "48.0.3"'
          new = 'wasmtime = { version = "48.0.5"'
          if old not in s:
              raise SystemExit('expected Wasmtime 48.0.3 pin not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo update -p wasmtime --precise 48.0.5

      - name: Validate locked WASM backend
        run: |
          cargo build --locked --all-targets --features wasm-backend
          cargo test --locked --features wasm-backend

      - name: Audit dependency tree
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Commit resolved dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git diff --staged --check
          git commit -m "fix(security): update Wasmtime to 48.0.5"
          git push origin HEAD:fix/wasmtime-48.0.5-rustsec
