name: Validate Web HTTP server contracts

on:
  push:
    branches:
      - test/web-http-server-contracts

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/web-http-server-contracts
          fetch-depth: 0

      - name: Re-export HTTP method with public route API
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/runtime/mod.rs")
          text = path.read_text()
          old = "pub use http_server::{render_route_handler, HttpServerState, WebDevServer, WebRoute};"
          new = "pub use http_server::{\n    render_route_handler, HttpMethod, HttpServerState, WebDevServer, WebRoute,\n};"
          if text.count(old) != 1:
              raise SystemExit(f"expected one HTTP runtime re-export anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test real HTTP contract dispatch
        run: cargo test --test web_http_server_contracts

      - name: Commit validated socket coverage
        shell: bash
        run: |
          rm .github/workflows/zz-ai-web-http-server-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/mod.rs tests/web_http_server_contracts.rs .github/workflows/zz-ai-web-http-server-contracts.yml
          git commit -m "test(web): validate WebDevServer contract dispatch over TCP"
          git push origin HEAD:test/web-http-server-contracts
