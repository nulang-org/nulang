name: Publish validated authority host boundaries

on:
  push:
    branches:
      - feat/authority-host-boundaries

permissions:
  contents: write

concurrency:
  group: authority-host-boundaries
  cancel-in-progress: true

jobs:
  publish-validated-tree:
    if: ${{ !contains(github.event.head_commit.message, '[authority-host-boundaries-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated actor host-effect authority patch
        run: python3 scripts/apply_authority_host_boundaries.py

      - name: Apply validated Web and realtime host gates
        run: python3 scripts/apply_authority_web_bypass_gate.py

      - name: Apply validated FFI authority patch
        run: python3 scripts/apply_authority_ffi_gate.py

      - name: Apply validated actor-free top-level scope
        run: python3 scripts/apply_authority_top_level_scope.py

      - name: Apply validated host-action execution regression
        run: python3 scripts/apply_authority_host_integration_test.py

      - name: Verify deterministic production file set
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            src/aot/mod.rs \
            src/jit/runtime.rs \
            src/runtime/callbacks.rs \
            src/vm.rs | sort)"
          test "$actual" = "$expected" || {
            echo "unexpected generated file set"
            echo "actual:"
            echo "$actual"
            echo "expected:"
            echo "$expected"
            exit 1
          }

      - name: Publish previously validated production tree
        run: |
          rm scripts/apply_authority_host_boundaries.py
          rm scripts/apply_authority_web_bypass_gate.py
          rm scripts/apply_authority_ffi_gate.py
          rm scripts/apply_authority_top_level_scope.py
          rm scripts/apply_authority_host_integration_test.py
          rm .github/workflows/apply-authority-host-boundaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): enforce actor host boundaries [authority-host-boundaries-applied]"
          git push origin HEAD:feat/authority-host-boundaries
