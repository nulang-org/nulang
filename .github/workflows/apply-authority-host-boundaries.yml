name: Apply authority host boundaries

on:
  push:
    branches:
      - feat/authority-host-boundaries

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[authority-host-boundaries-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply actor host-effect authority patch
        run: python3 scripts/apply_authority_host_boundaries.py

      - name: Apply FFI authority patch
        run: python3 scripts/apply_authority_ffi_gate.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run host authority regressions
        run: cargo test --lib host_authority -- --nocapture

      - name: Run migration-independent authority unit tests
        run: cargo test --lib authority -- --nocapture

      - name: Check library
        run: cargo check --lib

      - name: Check without optional features
        run: cargo check --lib --no-default-features

      - name: Check all targets
        run: cargo check --all-targets

      - name: Commit validated implementation
        run: |
          rm scripts/apply_authority_host_boundaries.py
          rm scripts/apply_authority_ffi_gate.py
          rm .github/workflows/apply-authority-host-boundaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): enforce actor host boundaries [authority-host-boundaries-applied]"
          git push origin HEAD:feat/authority-host-boundaries
