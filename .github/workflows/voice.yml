name: Voice Core

on:
  pull_request:
    paths:
      - "crates/nulang-ai-core/**"
      - "crates/nulang-ai-voice/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/voice.yml"
  push:
    branches: [main]
    paths:
      - "crates/nulang-ai-core/**"
      - "crates/nulang-ai-voice/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/voice.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  voice:
    name: Format, Check, Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --package nulang-ai-core --package nulang-ai-voice -- --check

      - name: Check
        run: cargo check -p nulang-ai-core -p nulang-ai-voice --all-targets

      - name: Test
        run: cargo test -p nulang-ai-core -p nulang-ai-voice

      - name: Clippy
        run: cargo clippy -p nulang-ai-core -p nulang-ai-voice --all-targets -- -D warnings
