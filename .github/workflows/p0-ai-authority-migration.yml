name: P0 AI Authority Fixture Migration

on:
  push:
    branches:
      - integration/p0-stabilization-2026-09-14
    paths:
      - .github/workflows/p0-ai-authority-migration.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/p0-stabilization-2026-09-14
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Rebase function-local spawn metadata to module PCs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mir_codegen.rs')
          text = path.read_text()

          before = '''        let function_start = saved_instructions.len();\n        // Build the spill map: locals whose id exceeds the register file'''
          after = '''        let function_start = saved_instructions.len();\n        // Spawn-site metadata is emitted while this function's instruction\n        // vector is isolated, so its PCs are function-local until the code is\n        // appended back to the module. Remember each table's starting length\n        // and rebase only entries produced by this function at the end.\n        let spawn_init_metadata_start = self.module.spawn_init_overrides.len();\n        let spawn_authority_metadata_start = self.module.spawn_capability_grants.len();\n        let remote_spawn_metadata_start = self.module.remote_spawn_init_fields.len();\n        // Build the spill map: locals whose id exceeds the register file'''
          if text.count(before) != 1:
              raise SystemExit('compile_function start shape changed')
          text = text.replace(before, after, 1)

          before = '''        let code_len = function_code.len();\n        self.module.instructions.extend(function_code);\n\n        // Publish the debugger's pc<->line map and per-function debug info.'''
          after = '''        let code_len = function_code.len();\n        self.module.instructions.extend(function_code);\n\n        // Metadata recorded while `module.instructions` held only this\n        // function used function-local PCs. Runtime spawn dispatch indexes\n        // these tables with module-absolute PCs, so relocate every entry\n        // emitted by this function by the same base as its bytecode.\n        for (pc, _) in &mut self.module.spawn_init_overrides[spawn_init_metadata_start..] {\n            *pc += function_start;\n        }\n        for (pc, _) in &mut self.module.spawn_capability_grants[spawn_authority_metadata_start..] {\n            *pc += function_start;\n        }\n        for (pc, _) in &mut self.module.remote_spawn_init_fields[remote_spawn_metadata_start..] {\n            *pc += function_start;\n        }\n\n        // Publish the debugger's pc<->line map and per-function debug info.'''
          if text.count(before) != 1:
              raise SystemExit('compile_function end shape changed')
          text = text.replace(before, after, 1)
          path.write_text(text)
          PY

      - name: Add nonzero-function-base authority regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/spawn_authority_provenance.rs')
          text = path.read_text()
          marker = '#[test]\nfn source_grants_survive_frontend_and_bind_to_exact_spawn_pc() {'
          if text.count(marker) != 1:
              raise SystemExit('authority regression insertion point changed')
          test = '''#[test]\nfn spawn_site_authority_pc_is_module_absolute_after_prior_function_code() {\n    let mut mir = lower(\n        r#"\nfn helper() { 41 }\nactor Child { behavior ping() { 1 } }\nfn main() {\n    spawn Child {} with [Inference::Ask]\n}\n"#,\n    );\n    let module = compile_mir(&mut mir, "authority-absolute-pc").unwrap();\n    let spawn_pc = module\n        .instructions\n        .iter()\n        .position(|instr| instr.opcode == OpCode::Spawn)\n        .unwrap();\n    assert!(spawn_pc > 0, "regression requires a nonzero function base");\n    assert_eq!(\n        spawn_grants(&module, spawn_pc),\n        vec!["Inference::Ask".to_string()]\n    );\n    assert_eq!(module.spawn_capability_grants[0].0, spawn_pc);\n\n    let runtime = Rc::new(RefCell::new(Runtime::new()));\n    let mut vm = VM::new();\n    vm.load_module(module);\n    vm.set_actor_callbacks(Box::new(RuntimeVmCallbacks::new(runtime.clone())));\n    let child = vm.run().unwrap();\n    let child_id = child.as_actor_id().expect("spawn should return actor ref");\n    assert_eq!(\n        runtime\n            .borrow()\n            .actors\n            .get(&child_id)\n            .unwrap()\n            .authority_manifest()\n            .unwrap()\n            .canonical_tokens(),\n        vec!["Inference::Ask".to_string()]\n    );\n}\n\n'''
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY

      - name: Migrate legacy AI fixtures to explicit inference authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/integration_tests/mod.rs')
          text = path.read_text()
          tests = [
              'test_agent_ask_tracks_usage_and_cost',
              'test_agent_ask_uses_memory',
              'test_agent_usage_behavior',
              'test_agent_workflow_recovers_semantic_memory_after_restart',
              'test_agent_workflow_researches_and_reports',
              'test_debate_source_end_to_end',
              'test_inference_ask_actor_behavior_suspends_and_resumes',
              'test_inference_ask_chained_suspensions_resume_in_order',
              'test_inference_ask_nonblocking_other_actors_run_first',
              'test_inference_ask_queued_messages_wait_for_suspended_behavior',
              'test_mir_agent_ask_uses_memory',
              'test_pipeline_source_end_to_end',
              'test_supervisor_source_end_to_end',
              'test_workflow_inference_ask_step_records_completion',
              'test_workflow_inference_ask_step_redriven_after_restart',
              'test_workflow_step_inference_ask_then_signal_wait',
              'test_workflow_step_signal_wait_then_inference_ask',
          ]
          spawn_expr = re.compile(r'\bspawn\s+[A-Za-z_][A-Za-z0-9_]*\s*\{')

          def add_authority_to_spawns(segment: str, test_name: str) -> tuple[str, int]:
              out = []
              cursor = 0
              changed = 0
              while True:
                  match = spawn_expr.search(segment, cursor)
                  if match is None:
                      out.append(segment[cursor:])
                      break
                  start = match.start()
                  out.append(segment[cursor:start])
                  brace = segment.find('{', start, match.end())
                  if brace < 0:
                      raise SystemExit(f'{test_name}: matched spawn without initializer brace')
                  depth = 0
                  quote = None
                  escaped = False
                  end = None
                  i = brace
                  while i < len(segment):
                      ch = segment[i]
                      if quote is not None:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = None
                      else:
                          if ch in ('"', "'"):
                              quote = ch
                          elif ch == '{':
                              depth += 1
                          elif ch == '}':
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  break
                      i += 1
                  if end is None:
                      raise SystemExit(f'{test_name}: unbalanced spawn initializer')
                  after = segment[end:]
                  if after.lstrip().startswith('with ['):
                      out.append(segment[start:end])
                  else:
                      out.append(segment[start:end] + ' with [Inference::Ask]')
                      changed += 1
                  cursor = end
              return ''.join(out), changed

          for name in tests:
              marker = f'fn {name}()'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing target test: {name}')
              next_test = text.find('\n    #[test]', start + len(marker))
              next_cfg = text.find('\n    #[cfg(', start + len(marker))
              candidates = [p for p in (next_test, next_cfg) if p >= 0]
              end = min(candidates) if candidates else len(text)
              segment = text[start:end]
              migrated, count = add_authority_to_spawns(segment, name)
              if count == 0:
                  raise SystemExit(f'{name}: expected at least one unprivileged spawn fixture')
              text = text[:start] + migrated + text[end:]
              print(f'{name}: migrated {count} spawn site(s)')

          path.write_text(text)

          http = Path('src/runtime/http_server.rs')
          http_text = http.read_text()
          needle = "/// Match a route pattern against a request path, returning captured parameters.\n/// Patterns use `:name` segments, e.g. `/products/:id`.\npub fn match_route("
          replacement = "/// Match a route pattern against a request path, returning captured parameters.\n/// Patterns use `:name` segments, e.g. `/products/:id`.\n#[cfg(test)]\npub fn match_route("
          if http_text.count(needle) != 1:
              raise SystemExit('expected exactly one legacy match_route declaration')
          http.write_text(http_text.replace(needle, replacement, 1))
          PY

          git diff -- src/mir_codegen.rs tests/spawn_authority_provenance.rs src/integration_tests/mod.rs src/runtime/http_server.rs
          test -n "$(git diff -- src/mir_codegen.rs)"
          test -n "$(git diff -- tests/spawn_authority_provenance.rs)"
          test -n "$(git diff -- src/integration_tests/mod.rs)"
          test -n "$(git diff -- src/runtime/http_server.rs)"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check default and minimal builds
        run: |
          cargo check --all-targets
          cargo check --all-targets --no-default-features

      - name: Enforce zero-warning library builds
        run: |
          RUSTFLAGS='-D warnings' cargo check --lib
          RUSTFLAGS='-D warnings' cargo check --release --lib

      - name: Run spawn authority provenance suite
        run: cargo test --test spawn_authority_provenance -- --nocapture

      - name: AI regression 01 — usage and cost
        run: cargo test --lib integration_tests::tests::test_agent_ask_tracks_usage_and_cost -- --exact --nocapture
      - name: AI regression 02 — memory
        run: cargo test --lib integration_tests::tests::test_agent_ask_uses_memory -- --exact --nocapture
      - name: AI regression 03 — usage behavior
        run: cargo test --lib integration_tests::tests::test_agent_usage_behavior -- --exact --nocapture
      - name: AI regression 04 — recovered semantic memory
        run: cargo test --lib integration_tests::tests::test_agent_workflow_recovers_semantic_memory_after_restart -- --exact --nocapture
      - name: AI regression 05 — workflow research and report
        run: cargo test --lib integration_tests::tests::test_agent_workflow_researches_and_reports -- --exact --nocapture
      - name: AI regression 06 — debate source
        run: cargo test --lib integration_tests::tests::test_debate_source_end_to_end -- --exact --nocapture
      - name: AI regression 07 — suspends and resumes
        run: cargo test --lib integration_tests::tests::test_inference_ask_actor_behavior_suspends_and_resumes -- --exact --nocapture
      - name: AI regression 08 — chained suspensions
        run: cargo test --lib integration_tests::tests::test_inference_ask_chained_suspensions_resume_in_order -- --exact --nocapture
      - name: AI regression 09 — nonblocking scheduling
        run: cargo test --lib integration_tests::tests::test_inference_ask_nonblocking_other_actors_run_first -- --exact --nocapture
      - name: AI regression 10 — queued messages
        run: cargo test --lib integration_tests::tests::test_inference_ask_queued_messages_wait_for_suspended_behavior -- --exact --nocapture
      - name: AI regression 11 — MIR memory
        run: cargo test --lib integration_tests::tests::test_mir_agent_ask_uses_memory -- --exact --nocapture
      - name: AI regression 12 — pipeline source
        run: cargo test --lib integration_tests::tests::test_pipeline_source_end_to_end -- --exact --nocapture
      - name: AI regression 13 — supervisor source
        run: cargo test --lib integration_tests::tests::test_supervisor_source_end_to_end -- --exact --nocapture
      - name: AI regression 14 — workflow completion
        run: cargo test --lib integration_tests::tests::test_workflow_inference_ask_step_records_completion -- --exact --nocapture
      - name: AI regression 15 — workflow redrive
        run: cargo test --lib integration_tests::tests::test_workflow_inference_ask_step_redriven_after_restart -- --exact --nocapture
      - name: AI regression 16 — ask then signal
        run: cargo test --lib integration_tests::tests::test_workflow_step_inference_ask_then_signal_wait -- --exact --nocapture
      - name: AI regression 17 — signal then ask
        run: cargo test --lib integration_tests::tests::test_workflow_step_signal_wait_then_inference_ask -- --exact --nocapture

      - name: Re-run host authority regressions
        run: cargo test --lib host_authority -- --nocapture

      - name: Diff hygiene and scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed paths:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 4
          test "${changed[0]}" = "src/integration_tests/mod.rs"
          test "${changed[1]}" = "src/mir_codegen.rs"
          test "${changed[2]}" = "src/runtime/http_server.rs"
          test "${changed[3]}" = "tests/spawn_authority_provenance.rs"

      - name: Commit validated P0 migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-stabilization-2026-09-14 main
          remote_head="$(git rev-parse origin/integration/p0-stabilization-2026-09-14)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "integration branch advanced during validation: $remote_head (expected $GITHUB_SHA)" >&2
            exit 1
          fi
          main_head="$(git rev-parse origin/main)"
          expected_main="439070db0ac2f902d1692c393799e6d25bbad903"
          if [ "$main_head" != "$expected_main" ]; then
            echo "main advanced during validation: $main_head (expected $expected_main)" >&2
            exit 1
          fi
          rm .github/workflows/p0-ai-authority-migration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mir_codegen.rs tests/spawn_authority_provenance.rs src/integration_tests/mod.rs src/runtime/http_server.rs .github/workflows/p0-ai-authority-migration.yml
          git diff --cached --check
          git commit -m 'fix(authority): rebase spawn metadata and migrate AI fixtures'
          git push origin HEAD:integration/p0-stabilization-2026-09-14
