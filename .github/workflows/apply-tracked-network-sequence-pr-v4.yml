name: Make unsupported tracked sends side-effect free

on:
  pull_request:
    paths:
      - '.github/workflows/apply-tracked-network-sequence-pr-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch default tracked-send contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/runtime/network.rs')
          text = path.read_text()
          old = '''    /// Send a packet and return the exact NUL0 sequence when the transport can\n    /// expose it synchronously. The default preserves compatibility for custom\n    /// transports that only implement fire-and-forget `send`.\n    fn send_tracked(\n        &mut self,\n        to_node: NodeId,\n        to_addr: std::net::SocketAddr,\n        packet: Packet,\n    ) -> Option<u64> {\n        self.send(to_node, to_addr, packet);\n        None\n    }'''
          new = '''    /// Send a packet and return the exact NUL0 sequence when the transport can\n    /// expose it synchronously. `None` means no tracked send was performed;\n    /// callers may explicitly fall back to ordinary `send`. This keeps custom\n    /// transports source-compatible without risking an untrackable duplicate.\n    fn send_tracked(\n        &mut self,\n        _to_node: NodeId,\n        _to_addr: std::net::SocketAddr,\n        _packet: Packet,\n    ) -> Option<u64> {\n        None\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact tracked-send default once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-tracked-network-sequence-pr-v4.yml
          git add src/runtime/network.rs
          git diff --cached --check
          git commit -m 'refactor(network): make tracked-send fallback explicit'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
