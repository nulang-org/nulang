name: Docs Sync

# Regenerate derived docs (stdlib reference + API reference) whenever the
# compiler, standard library, examples, docs source, or this workflow change
# on the main branch. The updated docs are committed back to main, the Astro
# site is built to verify the result, and DeepWiki is pinged to encourage
# re-indexing. Cloudflare Pages then redeploys https://nulang.org from main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Trigger when compiler / stdlib source or docs content change.
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-docs:
    name: Regenerate and sync docs
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required for auto-committing doc changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate docs
        run: node scripts/generate-docs.js

      - name: Build Astro site
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm run build
        # Deployment is handled by the Cloudflare Pages Git integration,
        # which triggers on every push to main. This step validates the build
        # before any generated docs are committed.

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/src/content/docs/stdlib/ docs/api.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: auto-sync stdlib reference [skip ci]"
            git push
          fi

      - name: Ping DeepWiki to refresh index
        # Best-effort request to encourage DeepWiki to re-index the repo docs.
        # DeepWiki does not publish a guaranteed refresh endpoint, so this step
        # is allowed to fail without failing the workflow.
        run: |
          curl -fsSL --max-time 30 --retry 2 --retry-delay 5 \
            -H "Accept: text/html" \
            "https://deepwiki.com/nulang-org/nulang" \
            -o /dev/null || true
        continue-on-error: true
