name: Docs Sync

# Regenerate derived docs (stdlib reference + API reference) whenever the
# compiler, standard library, examples, docs source, or this workflow change
# on the main branch. The generated outputs are proposed through a dedicated
# pull request so protected-main rules remain authoritative. The Astro site is
# built before the PR is opened, and DeepWiki is pinged to encourage re-indexing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Trigger when compiler / stdlib source or docs content change.
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - '!docs/public/playground/**'
      - 'playground/web/**'
      - 'crates/nulang-playground/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-docs:
    name: Regenerate and sync docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate docs
        run: node scripts/generate-docs.js

      - name: Build browser playground
        run: |
          playground/web/build.sh
          cd docs
          node scripts/sync-playground.mjs

      - name: Build Astro site
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm run build
        # Deployment remains handled by the Cloudflare Pages Git integration.
        # This step validates the exact generated site before assets are
        # proposed to protected main through the generated-assets PR.

      - name: Open or update generated-assets PR
        env:
          # Optional PAT/GitHub-App token avoids the approval gate GitHub
          # applies to PR workflows created by GITHUB_TOKEN. Without it, the
          # generated-assets PR is still created safely but a maintainer must
          # approve its workflow runs in the PR UI.
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/src/content/docs/stdlib/ docs/api.md docs/public/playground/

          if git diff --staged --quiet; then
            echo "Generated docs and playground assets are already current."
            exit 0
          fi

          sync_branch="automation/docs-sync"
          git checkout -B "$sync_branch"
          git commit -m "docs: auto-sync generated site assets"
          git push --force origin "HEAD:$sync_branch"

          pr_number="$(gh pr list --head "$sync_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "docs: sync generated site assets" \
              --body "Automated refresh of generated standard-library/API docs and the browser-playground bundle from the current main branch."
          else
            gh pr create \
              --base main \
              --head "$sync_branch" \
              --title "docs: sync generated site assets" \
              --body "Automated refresh of generated standard-library/API docs and the browser-playground bundle from the current main branch."
          fi

      - name: Ping DeepWiki to refresh index
        # Best-effort request to encourage DeepWiki to re-index the repo docs.
        # DeepWiki does not publish a guaranteed refresh endpoint, so this step
        # is allowed to fail without failing the workflow.
        run: |
          curl -fsSL --max-time 30 --retry 2 --retry-delay 5 \
            -H "Accept: text/html" \
            "https://deepwiki.com/nulang-org/nulang" \
            -o /dev/null || true
        continue-on-error: true
