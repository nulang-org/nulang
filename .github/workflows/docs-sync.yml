name: Docs Sync

# Regenerate derived docs (stdlib reference + API reference) whenever the
# compiler, standard library, examples, docs source, or this workflow change
# on the main branch. Outputs are archived for a reviewed pull request rather
# than pushed directly into branches guarded by the organization-wide ruleset.
# The Astro site is built and verified before assets are archived.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Trigger when compiler / stdlib source or docs content change.
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/**'
      - '!docs/public/playground/**'
      - 'playground/web/**'
      - 'crates/nulang-playground/**'
      - '.github/workflows/docs-sync.yml'

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-docs:
    name: Regenerate and sync docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DOCS_SYNC_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate docs
        run: node scripts/generate-docs.js

      - name: Build browser playground
        run: |
          playground/web/build.sh
          cd docs
          node scripts/sync-playground.mjs

      - name: Build Astro site
        run: |
          cd docs
          pnpm install --frozen-lockfile
          pnpm run build
        # Deployment remains handled by the Cloudflare Pages Git integration.
        # This step validates the exact generated site before assets are
        # archived for review as generated assets (no protected-branch writes).

      - name: Open      # Keep generated output recoverable even when organization-wide branch
      # rules require reviewed PRs for all branch writes.
      - name: Archive generated docs and playground
        uses: actions/upload-artifact@v7
        with:
          name: nulang-generated-docs
          path: |
            docs/src/content/docs/stdlib/
            docs/api.md
            docs/public/playground/
          if-no-files-found: error
          retention-days: 30

      - name: Report generated asset drift
        shell: bash
        run: |
          git add -- docs/src/content/docs/stdlib/ docs/api.md docs/public/playground/
          if git diff --cached --quiet; then
            echo "Generated docs are already current."
          else
            echo "::warning::Generated docs differ from main. Download the 'nulang-generated-docs' artifact from https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and import it through a reviewed PR; no protected branch push was attempted."
            git diff --cached --stat
          fi

      - name: Ping DeepWiki to refresh index
        # Best-effort request to encourage DeepWiki to re-index the repo docs.
        # DeepWiki does not publish a guaranteed refresh endpoint, so this step
        # is allowed to fail without failing the workflow.
        run: |
          curl -fsSL --max-time 30 --retry 2 --retry-delay 5 \
            -H "Accept: text/html" \
            "https://deepwiki.com/nulang-org/nulang" \
            -o /dev/null || true
        continue-on-error: true
