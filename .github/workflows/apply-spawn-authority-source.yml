name: Apply source spawn authority integration

on:
  push:
    branches:
      - feat/spawn-authority-source-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[source-authority-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spawn-authority-source-v2
          fetch-depth: 0

      - name: Recover proven exact-provenance transform
        run: |
          git fetch origin feat/spawn-authority-provenance
          git show 124017fd8ab7d5972ee1a98406fa8916fdff19f4:scripts/apply_spawn_authority_provenance.py > /tmp/apply_spawn_authority_provenance.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_spawn_authority_provenance.py')
          s = p.read_text()
          s = s.replace('if sig_count != 4:', 'if sig_count != 2:')
          s = s.replace('expected 4 spawn signatures', 'expected 2 spawn signatures')
          s = s.replace('if rc_count != 2:', 'if rc_count != 1:')
          s = s.replace('expected 2 Rc spawn bodies', 'expected 1 Rc spawn body')
          s = s.replace('if raw_count != 2:', 'if raw_count != 1:')
          s = s.replace('expected 2 raw-pointer spawn bodies', 'expected 1 raw-pointer spawn body')
          p.write_text(s)
          PY

      - name: Apply exact spawn provenance
        run: python3 /tmp/apply_spawn_authority_provenance.py

      - name: Thread exact provenance through native AOT callbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/runtime/callbacks.rs')
          s = p.read_text()
          old = 'fn spawn_with_site_authority(\n'
          if s.count(old) != 1:
              raise SystemExit(f'callback helper count={s.count(old)}')
          p.write_text(s.replace(old, 'pub(crate) fn spawn_with_site_authority(\n', 1))

          p = Path('src/aot/mod.rs')
          s = p.read_text()
          stub = '    fn spawn_actor(\n        &mut self,\n        _module: &crate::bytecode::CodeModule,\n        _behavior_idx: usize,\n        _init: Vec<(String, crate::vm::Value)>,\n    ) -> crate::vm::Value {'
          stub_new = '    fn spawn_actor(\n        &mut self,\n        _module: &crate::bytecode::CodeModule,\n        _spawn_pc: usize,\n        _behavior_idx: usize,\n        _init: Vec<(String, crate::vm::Value)>,\n    ) -> crate::vm::Value {'
          if s.count(stub) != 1:
              raise SystemExit(f'AOT stub signature count={s.count(stub)}')
          s = s.replace(stub, stub_new, 1)

          real_sig = '    fn spawn_actor(\n        &mut self,\n        module: &crate::bytecode::CodeModule,\n        behavior_idx: usize,\n        init: Vec<(String, crate::vm::Value)>,\n    ) -> crate::vm::Value {'
          real_sig_new = '    fn spawn_actor(\n        &mut self,\n        module: &crate::bytecode::CodeModule,\n        spawn_pc: usize,\n        behavior_idx: usize,\n        init: Vec<(String, crate::vm::Value)>,\n    ) -> crate::vm::Value {'
          if s.count(real_sig) != 2:
              raise SystemExit(f'AOT real signature count={s.count(real_sig)}')
          s = s.replace(real_sig, real_sig_new)

          body = 'unsafe { (*self.runtime).spawn_from_module(module, behavior_idx, init) }'
          body_new = 'unsafe {\n            crate::runtime::callbacks::spawn_with_site_authority(\n                &mut *self.runtime,\n                module,\n                spawn_pc,\n                behavior_idx,\n                init,\n            )\n        }'
          if s.count(body) != 2:
              raise SystemExit(f'AOT spawn body count={s.count(body)}')
          p.write_text(s.replace(body, body_new))
          PY

      - name: Keep integration regression on public API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/spawn_authority_provenance.rs')
          s = p.read_text()
          private_import = 'use nulang::authority_runtime::spawn_authority_manifest;\n'
          if s.count(private_import) != 1:
              raise SystemExit(f'private authority import count={s.count(private_import)}')
          s = s.replace(private_import, '', 1)
          helper_anchor = "fn two_spawn_source() -> &'static str {\n"
          helper = "fn spawn_grants(module: &nulang::bytecode::CodeModule, pc: usize) -> Vec<String> {\n    module\n        .spawn_capability_grants\n        .iter()\n        .find(|(site, _)| *site == pc)\n        .map(|(_, grants)| grants.clone())\n        .unwrap_or_default()\n}\n\n"
          if s.count(helper_anchor) != 1:
              raise SystemExit(f'test helper anchor count={s.count(helper_anchor)}')
          s = s.replace(helper_anchor, helper + helper_anchor, 1)
          first = 'spawn_authority_manifest(&module, spawn_pcs[0])\n            .unwrap()\n            .canonical_tokens()'
          second = 'spawn_authority_manifest(&module, spawn_pcs[1])\n            .unwrap()\n            .canonical_tokens()'
          if s.count(first) != 1 or s.count(second) != 1:
              raise SystemExit('spawn authority assertions moved')
          s = s.replace(first, 'spawn_grants(&module, spawn_pcs[0])', 1)
          s = s.replace(second, 'spawn_grants(&module, spawn_pcs[1])', 1)
          p.write_text(s)
          PY

      - name: Apply source syntax and HIR preservation
        run: python3 scripts/apply_spawn_authority_source.py

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo test --test spawn_authority_provenance
          cargo check --lib
          cargo fmt --all -- --check
          git diff --check

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_spawn_authority_source.py
          rm .github/workflows/apply-spawn-authority-source.yml

      - name: Commit validated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): wire source spawn grants end to end [source-authority-applied]"
          git push origin HEAD:feat/spawn-authority-source-v2
