name: Docs Production Deploy

# Explicit production fallback for nulang.org.
#
# Primary deployment is still the Cloudflare Pages Git integration documented
# in docs/wrangler.toml. This workflow exists so a stale/disconnected Git
# integration does not leave production pinned to an old commit.
#
# Required GitHub Actions secrets:
#   CLOUDFLARE_PAGES_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# The API token should use the account-level Cloudflare Pages Write/Edit
# permission, scoped to the Nulang Cloudflare account.

on:
  workflow_dispatch:

concurrency:
  group: docs-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy nulang.org
    runs-on: ubuntu-latest
    environment:
      name: nulang.org
      url: https://nulang.org

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7

      - name: Record deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install Rust for browser playground
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache playground build
        uses: Swatinem/rust-cache@v2

      - name: Build browser playground
        run: playground/web/build.sh

      - name: Smoke test browser playground
        run: node playground/web/test/smoke.mjs

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check Astro site
        working-directory: docs
        run: pnpm run check

      - name: Build Astro site
        working-directory: docs
        run: pnpm run build

      - name: Verify deployable site output
        run: |
          test -s docs/dist/index.html
          test -s docs/dist/playground/index.html
          test -s docs/dist/playground/nulang_playground.wasm
          echo "EXPECTED_HOMEPAGE_SHA=$(sha256sum docs/dist/index.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_PAGES_API_TOKEN."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=nulang-docs \
            --branch=main \
            --commit-hash="$DEPLOY_SHA" \
            --commit-message="Production deploy $DEPLOY_SHA"

      - name: Verify production matches the selected commit
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 https://nulang.org/ -o /tmp/nulang-homepage.html &&
               curl -fsS --max-time 15 https://nulang.org/playground/nulang_playground.wasm -o /tmp/nulang_playground.wasm &&
               test -s /tmp/nulang_playground.wasm; then
              production_sha="$(sha256sum /tmp/nulang-homepage.html | awk '{print $1}')"
              if [ "$production_sha" = "$EXPECTED_HOMEPAGE_SHA" ]; then
                echo "nulang.org matches the selected commit and the browser compiler is reachable."
                exit 0
              fi
              echo "Homepage digest is still stale: $production_sha (expected $EXPECTED_HOMEPAGE_SHA)."
            fi
            echo "Production not ready yet (attempt $attempt/12)."
            sleep 5
          done

          echo "::error::Production did not converge to the selected commit or the browser compiler is unavailable."
          exit 1
