name: Docs Production Deploy

# Explicit production fallback for nulang.org.
#
# Primary deployment is still the Cloudflare Pages Git integration documented
# in docs/wrangler.toml. This workflow exists so a stale/disconnected Git
# integration does not leave production pinned to an old commit.
#
# GitHub Actions secret:
#   CLOUDFLARE_PAGES_API_TOKEN (preferred) or CLOUDFLARE_API_TOKEN
#
# The token should use the account-level Cloudflare Pages Write/Edit
# permission, scoped to the Nulang Cloudflare account. CLOUDFLARE_ACCOUNT_ID
# is optional because the repository already publishes the account ID used by
# the Pages/Email integration.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'playground/web/**'
      - 'crates/nulang-playground/**'
      - '.github/workflows/docs-production-deploy.yml'

concurrency:
  group: docs-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy nulang.org
    runs-on: ubuntu-latest
    environment:
      name: nulang.org
      url: https://nulang.org

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7

      - name: Record deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Install Rust for browser playground
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache playground build
        uses: Swatinem/rust-cache@v2

      - name: Build browser playground
        run: playground/web/build.sh

      - name: Smoke test browser playground
        run: node playground/web/test/smoke.mjs

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check Astro site
        working-directory: docs
        run: pnpm run check

      - name: Build Astro site
        working-directory: docs
        run: pnpm run build

      - name: Verify deployable site output
        run: |
          test -s docs/dist/index.html
          test -s docs/dist/playground/index.html
          test -s docs/dist/playground/nulang_playground.wasm
          echo "EXPECTED_HOMEPAGE_SHA=$(sha256sum docs/dist/index.html | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Detect Cloudflare deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          account_id="${CLOUDFLARE_ACCOUNT_ID:-ad5ebd496c88731aa7a6b4cfca58e612}"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cloudflare Pages API token is configured in GitHub Actions."
          fi

      - name: Fail manual deploy when credentials are missing
        if: github.event_name == 'workflow_dispatch' && steps.cloudflare.outputs.available != 'true'
        run: |
          echo "::error::Configure CLOUDFLARE_PAGES_API_TOKEN (preferred) or CLOUDFLARE_API_TOKEN before a manual production deploy."
          exit 1

      - name: Explain skipped automatic deploy
        if: github.event_name == 'push' && steps.cloudflare.outputs.available != 'true'
        run: |
          echo "::warning::Site build passed, but production deployment was skipped because no Cloudflare Pages API token is configured."

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=nulang-docs \
            --branch=main \
            --commit-hash="$DEPLOY_SHA" \
            --commit-message="Production deploy $DEPLOY_SHA"

      - name: Verify Pages project and custom domain match the selected commit
        if: steps.cloudflare.outputs.available == 'true'
        shell: bash
        run: |
          for attempt in {1..12}; do
            project_ok=false
            domain_ok=false

            if curl -fsS --max-time 15 https://nulang-docs.pages.dev/ -o /tmp/nulang-pages-homepage.html; then
              project_sha="$(sha256sum /tmp/nulang-pages-homepage.html | awk '{print $1}')"
              if [ "$project_sha" = "$EXPECTED_HOMEPAGE_SHA" ]; then
                project_ok=true
              else
                echo "Pages project digest is stale: $project_sha (expected $EXPECTED_HOMEPAGE_SHA)."
              fi
            fi

            if curl -fsS --max-time 15 https://nulang.org/ -o /tmp/nulang-homepage.html &&
               curl -fsS --max-time 15 https://nulang.org/playground/nulang_playground.wasm -o /tmp/nulang_playground.wasm &&
               test -s /tmp/nulang_playground.wasm; then
              domain_sha="$(sha256sum /tmp/nulang-homepage.html | awk '{print $1}')"
              if [ "$domain_sha" = "$EXPECTED_HOMEPAGE_SHA" ]; then
                domain_ok=true
              else
                echo "Custom-domain digest is stale: $domain_sha (expected $EXPECTED_HOMEPAGE_SHA)."
              fi
            fi

            if [ "$project_ok" = true ] && [ "$domain_ok" = true ]; then
              echo "Cloudflare Pages and nulang.org both match the selected commit; browser compiler is reachable."
              exit 0
            fi

            echo "Production not ready yet (attempt $attempt/12)."
            sleep 5
          done

          echo "::error::Pages project and custom domain did not both converge to the selected commit."
          exit 1
