name: Apply WASM changelog entry

on:
  push:
    branches:
      - debug/wasm-ci-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: debug/wasm-ci-provenance
          fetch-depth: 0

      - name: Insert changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '### Added since 1.0.0-frozen — 2026-09-14 (web contract + capacity broker hardening)\n'
          entry = '''### Runtime backend parity — 2026-09-17\n- **WASM guest-heap negation error parity** (`src/wasm_runtime.rs`,\n  `src/mir_wasm.rs`): unary negation of a guest heap value now reports the\n  same Nulang arithmetic type error as the interpreter instead of surfacing a\n  generic Wasmtime trap. The fix preserves pointer-provenance hardening: a\n  guest `TAG_PTR` remains a linear-memory offset and is never reconstructed as\n  a process-local host pointer. A focused WASM regression test covers tuple\n  negation, and the deterministic differential fuzzer exercises the same path.\n\n'''
          if entry in s:
              raise SystemExit('changelog entry already present')
          if s.count(marker) != 1:
              raise SystemExit(f'changelog insertion marker count changed: {s.count(marker)}')
          p.write_text(s.replace(marker, entry + marker, 1))
          PY

      - name: Validate diff and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-wasm-changelog.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/apply-wasm-changelog.yml
          git commit -m "docs: record WASM heap negation parity fix"
          git push origin HEAD:debug/wasm-ci-provenance
