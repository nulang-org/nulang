name: Android UI protocol

on:
  pull_request:
    paths:
      - 'platforms/android/NulangUIProtocol/**'
      - 'tests/fixtures/ui_protocol/v1/**'
      - '.github/workflows/android-ui-protocol.yml'
  push:
    branches: [main]
    paths:
      - 'platforms/android/NulangUIProtocol/**'
      - 'tests/fixtures/ui_protocol/v1/**'
      - '.github/workflows/android-ui-protocol.yml'

permissions:
  contents: read

jobs:
  protocol-conformance:
    name: Kotlin JVM protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and execute protocol conformance
        run: gradle -p platforms/android/NulangUIProtocol check --no-daemon --stacktrace
