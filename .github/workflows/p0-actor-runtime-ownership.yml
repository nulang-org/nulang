name: P0 Actor Runtime Ownership

on:
  push:
    branches:
      - fix/nominal-actor-runtime-ownership

concurrency:
  group: p0-actor-runtime-ownership
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nominal-actor-runtime-ownership
          fetch-depth: 0

      - name: Pin head
        run: echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply runtime ownership patch
        run: |
          python3 scripts/apply_p0_actor_runtime_ownership.py
          sed -i 's/behavior hit(): Int/behavior hit()/g' src/runtime/tests.rs

      - name: Format and static checks
        run: |
          cargo fmt --all
          git diff --check
          cargo check --no-default-features --tests

      - name: Reject cross-schema bytecode slot
        run: cargo test --no-default-features bytecode_dispatch_rejects_other_actor_schema_slot

      - name: Preserve schema through migration
        run: cargo test --no-default-features actor_schema_identity_survives_snapshot_json_and_migration

      - name: Ambiguous legacy actor fails closed
        run: cargo test --no-default-features ambiguous_legacy_snapshot_has_no_cross_schema_bytecode_dispatch

      - name: Existing unknown-behavior regressions remain green
        run: |
          cargo test --no-default-features unknown_behavior
          cargo test --no-default-features behavior_zero

      - name: Runtime focused suite
        run: cargo test --no-default-features runtime::tests

      - name: Land validated delta
        run: |
          git fetch origin fix/nominal-actor-runtime-ownership
          test "$(git rev-parse origin/fix/nominal-actor-runtime-ownership)" = "$START_HEAD"
          rm .github/workflows/p0-actor-runtime-ownership.yml
          rm scripts/apply_p0_actor_runtime_ownership.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(runtime): bind bytecode dispatch to actor schema"
          git push origin HEAD:fix/nominal-actor-runtime-ownership
