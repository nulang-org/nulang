name: Temporary PR1260 GREEN validation

on:
  push:
    branches:
      - tmp/pr1260-green-20261003

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm validated RED inputs are unchanged
        run: git diff --exit-code 27ba285690d8bef70ca28f6d98dcae648ffdb748 HEAD -- src/types.rs tests/orca_type_invariants.rs

      - name: Apply guarded mutable-array value restriction
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/types.rs")
          source = path.read_text()
          old = "            Type::Array(t) => t.collect_ref_free_vars(acc),"
          new = "            Type::Array(t) => t.collect_free_vars(acc),"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"unexpected collect_ref_free_vars array arm count: {count}")
          path.write_text(source.replace(old, new, 1))

          changed = path.read_text()
          if changed.count(new) != 1:
              raise SystemExit("guarded array value-restriction patch was not applied exactly once")

      - name: Verify production diff is one-line scoped
        shell: bash
        run: |
          git diff --check
          test "$(git diff --numstat -- src/types.rs | awk '{print $1 ":" $2}')" = "1:1"
          git diff -- src/types.rs

      - name: Default focused regressions are GREEN
        run: cargo test --locked --test orca_type_invariants -- --nocapture

      - name: No-default-features focused regressions are GREEN
        run: cargo test --locked --no-default-features --test orca_type_invariants -- --nocapture

      - name: WASM focused regressions are GREEN
        run: cargo test --locked --features wasm-backend --test orca_type_invariants -- --nocapture

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Commit validated production patch and remove validator
        shell: bash
        run: |
          rm .github/workflows/tmp-pr1260-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.rs .github/workflows/tmp-pr1260-green.yml
          git diff --cached --check
          git commit -m "fix(typechecker): keep mutable array element vars monomorphic"
          git push origin HEAD:tmp/pr1260-green-20261003
