name: Temporary PR1235 GREEN validation

on:
  push:
    branches:
      - tmp/pr1235-green-20261002

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm validated RED inputs are unchanged
        run: git diff --exit-code b3f749b4ce92ed9a3e868190ea94c5f76d6bab8e HEAD -- src/runtime/distributed.rs tests/distributed_runtime_spawn_trait.rs

      - name: Apply impl-scoped local-spawn fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/runtime/distributed.rs")
          source = path.read_text()
          impl_marker = "impl<'a> DistributedRuntime for DistributedRuntimeImpl<'a> {"
          impl_start = source.index(impl_marker)
          method_start = source.index("    fn spawn_on_node(\n", impl_start)
          impl_end_marker = "\n}\n\n// ---------------------------------------------------------------------------\n// Free functions"
          method_end = source.index(impl_end_marker, method_start)
          old_method = source[method_start:method_end]

          required_old_fragments = (
              "_behavior_name: &str",
              "_initial_state: Vec<(String, Value)>",
              "ActorAddress::local(0)",
              "ActorAddress::remote(node, 0)",
          )
          missing = [fragment for fragment in required_old_fragments if fragment not in old_method]
          if missing:
              raise SystemExit(f"unexpected local-spawn method shape; missing {missing!r}")

          new_method = (
              "    fn spawn_on_node(\n"
              "        &mut self,\n"
              "        _transport: &mut dyn NetworkTransport,\n"
              "        node: NodeId,\n"
              "        behavior_name: &str,\n"
              "        initial_state: Vec<(String, Value)>,\n"
              "    ) -> ActorAddress {\n"
              "        // This trait method has enough context for a real local spawn. Remote\n"
              "        // spawn still requires the free function's cluster/resolver inputs.\n"
              "        if node == NodeId::LOCAL {\n"
              "            let handler = self\n"
              "                .runtime\n"
              "                .spawnable_behaviors\n"
              "                .get(behavior_name)\n"
              "                .copied();\n"
              "            let id = self\n"
              "                .runtime\n"
              "                .spawn_actor(Box::new(move || initial_state));\n"
              "            if let Some(handler) = handler {\n"
              "                if let Some(actor) = self.runtime.actors.get_mut(&id) {\n"
              "                    actor.register_behavior(behavior_name.to_string(), handler);\n"
              "                }\n"
              "            }\n"
              "            ActorAddress::local(id)\n"
              "        } else {\n"
              "            // Remote failure/placeholder semantics are tracked separately in #1238.\n"
              "            ActorAddress::remote(node, 0)\n"
              "        }\n"
              "    }"
          )

          path.write_text(source[:method_start] + new_method + source[method_end:])

      - name: Format patched files
        run: cargo fmt --all

      - name: Focused regressions are GREEN
        run: cargo test --locked --test distributed_runtime_spawn_trait -- --nocapture

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: No-default-features check
        run: cargo check --locked --no-default-features

      - name: Commit validated production patch and remove validator
        shell: bash
        run: |
          rm .github/workflows/tmp-pr1235-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/distributed.rs tests/distributed_runtime_spawn_trait.rs .github/workflows/tmp-pr1235-green.yml
          git diff --cached --check
          git commit -m "fix(runtime): make local distributed trait spawn real actors"
          git push origin HEAD:tmp/pr1235-green-20261002
