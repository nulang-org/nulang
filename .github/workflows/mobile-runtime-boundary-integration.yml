name: Mobile Runtime Boundary Integration

on:
  push:
    branches:
      - feat/mobile-runtime-boundary-ci2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply current-main mobile runtime boundary
        run: |
          python3 patches/mobile/apply_current.py
          chmod +x scripts/check_mobile_runtime_profile.sh
          git diff --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Canonically format applied Rust changes
        run: cargo fmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Verify interpreter-only mobile profile
        run: bash scripts/check_mobile_runtime_profile.sh

      - name: Preserve no-default all-targets build
        run: cargo check --all-targets --no-default-features

      - name: Preserve default build
        run: cargo check --lib

      - name: Preserve WASM feature graph
        run: cargo check --lib --features wasm-backend

      - name: Commit validated source changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          rm -rf patches/mobile
          rm -f .github/workflows/mobile-runtime-boundary-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(mobile): isolate interpreter-only runtime"
          git push origin HEAD:feat/mobile-runtime-boundary-ci2
