name: Temporary rustfmt 1198

on:
  push:
    branches:
      - tmp/format-1198-20261004

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/format-1198-20261004
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Apply rustfmt
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "nulang-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply rustfmt to timer replay restack"
          git push origin HEAD:tmp/format-1198-20261004
