name: Cluster gossip throttle

on:
  pull_request:
    paths:
      - 'tests/cluster_gossip_throttle.rs'
      - '.github/workflows/cluster-gossip-throttle-pr.yml'
      - 'src/runtime/cluster.rs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Focused gossip cadence contract
        run: >-
          cargo test --locked --no-default-features
          --test cluster_gossip_throttle -- --nocapture
