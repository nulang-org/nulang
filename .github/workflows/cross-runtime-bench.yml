name: Cross-runtime actor benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per runtime
        required: false
        default: '5'
      warmup:
        description: Warm-up runs per runtime
        required: false
        default: '1'
      cpu_mode:
        description: CPU topology for measured runtime processes
        required: false
        default: single
        type: choice
        options:
          - single
          - host
  pull_request:
    paths:
      - '.github/workflows/cross-runtime-bench.yml'
      - 'benchmarks/cross_runtime/**'
      - 'benchmarks/README.md'
      - 'scripts/cross_runtime_bench.py'
      - 'scripts/actor_density_cross_runtime.py'
      - 'tests/test_cross_runtime_bench.py'
      - 'tests/test_actor_density_cross_runtime.py'
      - 'tests/test_mailbox_contention_cross_runtime.py'
      - 'scripts/mailbox_contention_cross_runtime.py'
      - 'examples/mailbox_contention.rs'
      - 'src/benchmarks.rs'
      - 'src/bin/nulang_savina.rs'
      - 'benchmarks/SAVINA.md'
      - 'Cargo.toml'

concurrency:
  group: cross-runtime-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Nulang vs Rust / Go / Erlang / Ractor baselines
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Install Erlang
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang-base erlang-dev

      - name: Validate comparator output contracts
        run: python3 -m unittest discover -s tests -p test_cross_runtime_bench.py -v

      - name: Validate actor-density probe contracts
        run: python3 -m unittest discover -s tests -p test_actor_density_cross_runtime.py -v

      - name: Smoke-test Ractor actor density
        run: |
          cargo run --locked --release \
            --manifest-path benchmarks/cross_runtime/ractor_baseline/Cargo.toml \
            --bin density -- idle 1000 > ractor-density-smoke.txt
          grep -q '^actor_count=1000$' ractor-density-smoke.txt
          grep -q '^rss_after_settle_bytes=' ractor-density-smoke.txt

      - name: Validate mailbox contention output contracts
        run: python3 -m unittest discover -s tests -p test_mailbox_contention_cross_runtime.py -v

      - name: Smoke-test Nulang and Ractor contended admission
        run: |
          python3 scripts/mailbox_contention_cross_runtime.py \
            --producers 1,2 --messages-per-producer 1000 \
            --runs 1 --warmup 0 --cpu-mode host \
            --output contention-smoke.json

      - name: Run cross-runtime baselines
        env:
          RUNS: "${{ inputs.runs || '3' }}"
          WARMUP: "${{ inputs.warmup || '1' }}"
          CPU_MODE: "${{ inputs.cpu_mode || 'single' }}"
        run: |
          python3 scripts/cross_runtime_bench.py \
            --runs "$RUNS" \
            --warmup "$WARMUP" \
            --cpu-mode "$CPU_MODE" \
            --output cross-runtime-results.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: cross-runtime-results-${{ github.sha }}
          path: |
            cross-runtime-results.json
            ractor-density-smoke.txt
            contention-smoke.json
            benchmarks/cross_runtime/ractor_baseline/Cargo.lock
          if-no-files-found: error
