name: Cross-runtime actor benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per runtime
        required: false
        default: '12'
      warmup:
        description: Warm-up runs per runtime
        required: false
        default: '1'
      runtimes:
        description: Comma-separated runtimes (bytecode/warmed JIT/AOT/Rust/Go/Erlang)
        required: false
        default: 'nulang,nulang-jit,nulang-aot,rust,go,erlang'
      cpu_mode:
        description: CPU topology for measured runtime processes
        required: false
        default: single
        type: choice
        options:
          - single
          - host
  pull_request:
    paths:
      - '.github/workflows/cross-runtime-bench.yml'
      - 'benchmarks/cross_runtime/**'
      - 'benchmarks/README.md'
      - 'scripts/cross_runtime_bench.py'
      - 'scripts/cross_runtime_order.py'
      - 'scripts/tests/test_cross_runtime*.py'
      - 'src/benchmarks.rs'
      - 'src/bin/nulang_savina.rs'
      - 'benchmarks/SAVINA.md'
      - 'Cargo.toml'

concurrency:
  group: cross-runtime-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Bytecode / warmed JIT / AOT vs Rust / Go / Erlang
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Test comparative benchmark ordering
        run: python3 -m unittest discover -s scripts/tests -p 'test_cross_runtime*.py' -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Install Erlang
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang-base erlang-dev

      - name: Run cross-runtime baselines
        env:
          RUNS: "${{ inputs.runs || '12' }}"
          WARMUP: "${{ inputs.warmup || '1' }}"
          CPU_MODE: "${{ inputs.cpu_mode || 'single' }}"
          RUNTIMES: "${{ inputs.runtimes || 'nulang,nulang-jit,nulang-aot,rust,go,erlang' }}"
        run: |
          python3 scripts/cross_runtime_bench.py \
            --runs "$RUNS" \
            --warmup "$WARMUP" \
            --cpu-mode "$CPU_MODE" \
            --runtimes "$RUNTIMES" \
            --output cross-runtime-results.json

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: cross-runtime-results-${{ github.sha }}
          path: cross-runtime-results.json
          if-no-files-found: error
