name: Apply authority snapshot preservation

on:
  push:
    branches:
      - feat/authority-snapshot-preservation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[authority-snapshot-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply assertion-heavy patch
        run: python3 scripts/apply_authority_snapshot_preservation.py

      - name: Reject whitespace errors
        run: git diff --check

      - name: Run authority-focused runtime tests
        run: cargo test --lib authority -- --nocapture

      - name: Check library
        run: cargo check --lib

      - name: Check relational persistence backends
        run: cargo check --lib --features sqlite,postgres

      - name: Check all targets
        run: cargo check --all-targets

      - name: Commit validated implementation
        run: |
          rm scripts/apply_authority_snapshot_preservation.py
          rm .github/workflows/apply-authority-snapshot-preservation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(authority): preserve manifests across durable recovery [authority-snapshot-applied]"
          git push origin HEAD:feat/authority-snapshot-preservation
