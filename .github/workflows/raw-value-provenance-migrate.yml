# Temporary self-removing migration workflow for #181. It validates the exact
# branch head with the pinned Rust toolchain before committing source changes.
name: Raw Value Provenance Migration

on:
  push:
    branches:
      - integration/raw-value-provenance

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/raw-value-provenance
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Replay proven internal raw-constructor annotations
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/value-safety-boundary
          git diff ab0e61010409e2e70276e577c52e9232fa558a92 fe0aa2fdffc6dd50b240b1ae83d50a86b41c3556 -- \
            src/aot/codegen.rs \
            src/aot/mod.rs \
            src/fuzz.rs \
            src/integration_tests/mod.rs \
            src/jit/runtime.rs \
            src/jit/tests.rs \
            src/jit/typed_compiler.rs \
            src/python/marshal.rs \
            > /tmp/raw-constructors.patch
          git apply --3way /tmp/raw-constructors.patch

      - name: Make core raw reconstruction compiler-enforced
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/vm.rs')
          s = p.read_text()

          old_raw = '''    /// Construct a Value from raw NaN-boxed bits.\n    ///\n    /// # Safety\n    /// The caller must ensure the bits form a valid tagged value.\n    pub fn from_raw(raw: u64) -> Self {\n        Value { raw }\n    }\n'''
          new_raw = '''    /// Construct a `Value` from trusted raw NaN-boxed bits.\n    ///\n    /// # Safety\n    /// Every tag payload must satisfy its runtime invariant. If `raw` has\n    /// `TAG_PTR`, the caller must preserve the originating pointer's provenance\n    /// and lifetime for every operation that can dereference the returned value;\n    /// externally controlled bits must use [`Value::try_from_untrusted_bits`].\n    pub unsafe fn from_raw(raw: u64) -> Self {\n        Value { raw }\n    }\n'''
          if old_raw not in s:
              raise SystemExit('from_raw anchor changed')
          s = s.replace(old_raw, new_raw, 1)

          old_bits = '''    /// Construct a Value from raw NaN-boxed bits.\n    pub fn from_bits(raw: u64) -> Self {\n        Value { raw }\n    }\n'''
          new_bits = '''    /// Construct a `Value` from trusted raw NaN-boxed bits.\n    ///\n    /// # Safety\n    /// Same contract as [`Value::from_raw`]. Pointer-tagged bits must retain\n    /// their originating host provenance/lifetime for every dereference;\n    /// untrusted integer boundaries must use the validated decoder instead.\n    pub unsafe fn from_bits(raw: u64) -> Self {\n        Value { raw }\n    }\n\n    /// Decode externally controlled raw bits without allowing them to mint a\n    /// process-local host heap pointer. Immediate tags and floats are safe to\n    /// transport as opaque values; `TAG_PTR` requires host provenance and is\n    /// therefore rejected at untrusted boundaries.\n    pub fn try_from_untrusted_bits(raw: u64) -> Result<Self, &'static str> {\n        if (raw & TAG_MASK) == TAG_PTR {\n            Err("pointer-tagged raw value has no Nulang host-heap provenance")\n        } else {\n            Ok(Value { raw })\n        }\n    }\n'''
          if old_bits not in s:
              raise SystemExit('from_bits anchor changed')
          s = s.replace(old_bits, new_bits, 1)

          s = s.replace(
              'self.frames[frame_idx].regs[i] = Value::from_bits(*bits);',
              'self.frames[frame_idx].regs[i] = unsafe { Value::from_bits(*bits) };',
          )
          s = s.replace(
              'frame.regs[i] = Value::from_bits(bits);',
              'frame.regs[i] = unsafe { Value::from_bits(bits) };',
          )
          p.write_text(s)

          # Current CLI has diverged from the historical hardening branch, so
          # migrate its two present raw-result sites explicitly instead of
          # replaying stale main.rs hunks.
          p = Path('src/main.rs')
          s = p.read_text()
          old = '            let result = nulang::vm::Value::from_raw(result_raw);\n'
          new = '''            // SAFETY: result_raw was produced by Nulang-generated native/AOT code\n            // using the same in-process Value ABI. String payloads are materialized\n            // before the standalone AOT heap is torn down and are not dereferenced\n            // through this fallback Value afterwards.\n            let result = unsafe { nulang::vm::Value::from_raw(result_raw) };\n'''
          if old not in s:
              raise SystemExit('native CLI raw-result anchor changed')
          s = s.replace(old, new, 1)
          old = '                nulang::vm::Value::from_raw(value).to_string_repr()\n'
          new = '''                // SAFETY: this raw result was returned by the in-process CoreVM ABI.\n                // resolve_display_string handled live pointer/string cases above;\n                // this fallback only formats non-dereferencing immediate/tag metadata.\n                unsafe { nulang::vm::Value::from_raw(value) }.to_string_repr()\n'''
          if old not in s:
              raise SystemExit('core-vm CLI raw-result anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # C ABI and libffi CType::Value are untrusted integer boundaries.
          p = Path('src/ffi/c_api.rs')
          s = p.read_text()
          old = '    Ok(Value::from_bits(value.raw))\n'
          new = '    Value::try_from_untrusted_bits(value.raw)\n'
          if old not in s:
              raise SystemExit('C ABI raw-value anchor changed')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/ffi/marshal.rs')
          s = p.read_text()
          old = '    Ok(Value::from_bits(raw))\n'
          new = '    Value::try_from_untrusted_bits(raw).map_err(str::to_string)\n'
          if old not in s:
              raise SystemExit('libffi raw-value anchor changed')
          p.write_text(s.replace(old, new, 1))

          # WASM guest TAG_PTR means a linear-memory offset, not a host heap
          # address. Convert guest results only through the validated decoder.
          p = Path('src/wasm_runtime.rs')
          s = p.read_text()
          old = '''    if value_layout::is_ptr_raw(raw) {\n        return Err("wasm guest pointer-tagged value has no host heap provenance");\n    }\n    Ok(crate::vm::Value::from_raw(raw))\n'''
          new = '''    crate::vm::Value::try_from_untrusted_bits(raw)\n        .map_err(|_| "wasm guest pointer-tagged value has no host heap provenance")\n'''
          if old not in s:
              raise SystemExit('WASM guest decoder anchor changed')
          s = s.replace(old, new, 1)
          s = s.replace(
              'crate::vm::Value::from_raw(raw).to_string_repr()',
              'unsafe { crate::vm::Value::from_raw(raw) }.to_string_repr()',
          )
          p.write_text(s)

          p = Path('src/wasmfx_runtime.rs')
          s = p.read_text()
          old = '''    if value_layout::is_ptr_raw(raw) {\n        return Err(NuError::VMError {\n            msg: "wasmfx guest returned a host pointer-tagged value".into(),\n            span: crate::types::Span::default(),\n        });\n    }\n    Ok(crate::vm::Value::from_raw(raw))\n'''
          new = '''    crate::vm::Value::try_from_untrusted_bits(raw).map_err(|_| NuError::VMError {\n        msg: "wasmfx guest returned a host pointer-tagged value".into(),\n        span: crate::types::Span::default(),\n    })\n'''
          if old not in s:
              raise SystemExit('WasmFX guest decoder anchor changed')
          p.write_text(s.replace(old, new, 1))

          # Persistence handles TAG_PTR above this fallthrough by translating a
          # portable object id through obj_table; missing ids become nil. The
          # unchecked fallthrough therefore reconstructs non-pointer tags only.
          p = Path('src/runtime/heap_serialize.rs')
          s = p.read_text()
          s = s.replace(
              '    Value::from_raw(raw)\n}',
              '    // SAFETY: TAG_PTR and TAG_STRING were validated/remapped above; this path contains only immediate/non-pointer tags.\n    unsafe { Value::from_raw(raw) }\n}',
              1,
          )
          old = '''                Some(Value::from_raw(\n                    TAG_CLOSURE\n                        | crate::vm::CLOSURE_ENV_FLAG\n                        | (env_idx as u64 & crate::vm::CLOSURE_ENV_IDX_MASK),\n                ))\n'''
          new = '''                // SAFETY: this is an internally constructed closure handle. The\n                // environment index was allocated by this VM immediately above and is\n                // masked to the closure representation's validated index field.\n                Some(unsafe {\n                    Value::from_raw(\n                        TAG_CLOSURE\n                            | crate::vm::CLOSURE_ENV_FLAG\n                            | (env_idx as u64 & crate::vm::CLOSURE_ENV_IDX_MASK),\n                    )\n                })\n'''
          if old not in s:
              raise SystemExit('closure reconstruction raw-value anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # One AOT regression added after the historical hardening branch still
          # decodes an in-process AOT result. Make its trusted boundary explicit.
          p = Path('src/aot/codegen.rs')
          s = p.read_text()
          old = '''            crate::vm::Value::from_raw(raw).is_nil(),\n            "Actor.link outside an actor must nil-no-op like the interpreter"\n'''
          new = '''            // SAFETY: `raw` is produced by the in-process AOT module using\n            // the same Value ABI; this assertion only inspects the nil tag.\n            unsafe { crate::vm::Value::from_raw(raw) }.is_nil(),\n            "Actor.link outside an actor must nil-no-op like the interpreter"\n'''
          if old not in s:
              raise SystemExit('AOT raw-result regression anchor changed')
          p.write_text(s.replace(old, new, 1))

          # The historical caller-annotation patch predates #186 and wrapped
          # `Value::ptr` even though it is still a safe constructor on this slice.
          # Remove those wrappers so the #181 PR remains warning-clean; #186 will
          # make pointer construction itself an explicit provenance boundary next.
          p = Path('src/jit/runtime.rs')
          s = p.read_text()
          s = s.replace('unsafe { Value::ptr(ptr) }.as_raw()', 'Value::ptr(ptr).as_raw()')
          s = s.replace('unsafe { Value::ptr(dst_ptr) }.as_raw()', 'Value::ptr(dst_ptr).as_raw()')
          s = s.replace(
              'unsafe { Value::ptr(c.as_ptr() as *mut u8) }',
              'Value::ptr(c.as_ptr() as *mut u8)',
          )
          p.write_text(s)
          PY

      - name: Format and validate constructor migration
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 check --all-targets --no-default-features
          cargo +1.95.0 check --all-targets
          git diff --check

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/raw-value-provenance-migrate.yml
          git diff --check
          git fetch origin integration/raw-value-provenance
          if [ "$(git rev-parse origin/integration/raw-value-provenance)" != "$GITHUB_SHA" ]; then
            echo 'integration branch advanced during validation; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): enforce raw Value provenance boundaries'
          git push origin HEAD:integration/raw-value-provenance
