[advisories]
# RUSTSEC-2026-0186 is an "unsound" warning for memmap2 < 0.9.11.
# The vulnerable APIs (Mmap::advise_range, MmapMut::flush[_async]_range)
# are not called by nulang or by its transitive dependency cranelift-jit,
# which only uses MmapMut::map_anon. Upgrading memmap2 is blocked on
# cranelift-jit updating its own memmap2 requirement.
ignore = [
    "RUSTSEC-2026-0186",
    # The previous rustls 0.22 / webpki 0.102 / roots 0.26 branch is
    # absent after the verified libsql and ureq TLS-owner migration. Do not
    # retain their exemptions: a future reintroduction must fail cargo-audit.
    # Remaining known risk: RUSTSEC-2026-0258 still affects h2 0.3.27
    # through libsql 0.10 -> Hyper 0.14. No patched h2 0.3 is available.
    # The modern h2 0.4 graph is independently locked to >=0.4.16 and tested
    # by tests/security_h2_lockfile.rs. Cargo-audit ignores by advisory ID,
    # not by version; a green configured audit does NOT mean the old graph is
    # fixed. Remove this waiver only after the Hyper 0.14 graph is migrated
    # with recovery, remote TLS and compatibility proof (issue #2293).
    "RUSTSEC-2026-0258",
    # rustls-pemfile remains unmaintained (RUSTSEC-2025-0134).
    # This existing warning requires a separate dependency-owner removal,
    # not another waiver for the already-removed rustls 0.22 stack.
    "RUSTSEC-2025-0134",
]