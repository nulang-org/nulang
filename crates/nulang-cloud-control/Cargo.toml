[package]
name = "nulang-cloud-control"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic reconciliation and placement primitives for Nulang Cloud"

[features]
default = []
postgres = ["dep:postgres"]

[dependencies]
nulang-capacity = { path = "../nulang-capacity" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postgres = { version = "0.19", optional = true }

# Keep this frozen migration crate outside the root Nulang workspace.
# It remains directly buildable while active branches are migrated to Nulang Cloud.
[workspace]
resolver = "2"
