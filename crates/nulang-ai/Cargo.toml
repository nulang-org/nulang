[package]
name = "nulang-ai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AI runtime types for Nulang — LLM clients, memory, pipelines, debates, supervisor teams"

[dependencies]
nulang-ai-core = { path = "../nulang-ai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync"] }

[lib]
name = "nulang_ai"
path = "src/mod.rs"
