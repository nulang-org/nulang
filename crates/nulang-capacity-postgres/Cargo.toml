[package]
name = "nulang-capacity-postgres"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PostgreSQL persistence adapter for Nulang Cloud capacity allocation state"

[dependencies]
nulang-capacity = { path = "../nulang-capacity", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tokio-postgres = "0.7"
