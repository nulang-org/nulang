[package]
name = "nulang-ui-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned renderer-neutral UI protocol for Nulang universal applications"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nulang_ui_protocol"
path = "src/lib.rs"
