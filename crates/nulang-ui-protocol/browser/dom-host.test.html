<!doctype html>
<meta charset="utf-8">
<title>Nulang UI DOM host regression tests</title>
<div id="mount"></div><pre id="results">running</pre>
<script src="nulang-ui-dom.js"></script>
<script src="nulang-ui-stream.js"></script>
<script>
"use strict";
const tests = [];
function test(name, fn) { tests.push({name, fn}); }
function assert(condition, detail) { if (!condition) throw Error(detail || "assertion failed"); }
const str = value => ({type:"string", value});
const bool = value => ({type:"bool", value});
const entry = (id, kind, properties={}, children=[]) => ({id,kind,properties,children});
function snapshot(revision, nodes, root="root") {
  return {protocol:"nulang-ui/1",document_id:"test",revision:String(revision),root,nodes};
}
function patch(from,to,operations,acknowledged_inputs=[]) {
  return {protocol:"nulang-ui/1",document_id:"test",base_revision:String(from),revision:String(to),operations,acknowledged_inputs};
}
function setup(nodes) {
  const container=document.getElementById("mount"); container.replaceChildren();
  return window.nulangUiDom.createHost(container,snapshot(1,nodes));
}

test("keyed reorder retains original row nodes and focus", () => {
  const host=setup([entry("root","div",{},["a","b","c"]),entry("a","button",{text:str("A")}),entry("b","input",{value:str("bbb")}),entry("c","button",{text:str("C")})]);
  const before=host.element("b"), a=host.element("a"), c=host.element("c");
  before.focus(); before.setSelectionRange(1,2);
  host.applyPatch(patch(1,2,[{op:"replace_children",node_id:"root",children:["c","a","b"]}]));
  assert(host.element("b")===before && host.element("a")===a && host.element("c")===c,"row identity changed");
  assert(document.activeElement===before,"focus lost");
  assert(before.selectionStart===1 && before.selectionEnd===2,"selection lost");
  assert([...document.getElementById("mount").firstElementChild.children].map(n=>n.dataset.nulangNodeId).join(",")==="c,a,b","incorrect keyed order");
});

test("local typing wins over old patch, then acknowledgement releases ownership", () => {
  const received=[];
  const host=setup([entry("root","form",{},["title"]),entry("title","input",{value:str("")})]);
  host.onInput = detail => received.push(detail);
  const input=host.element("title");
  input.value="abc";input.dispatchEvent(new Event("input",{bubbles:true}));
  assert(received.length===1 && received[0].sequence==="1","input event sequence missing");
  host.applyPatch(patch(1,2,[{op:"set_property",node_id:"title",name:"value",value:str("old")}]));
  assert(input.value==="abc","local input overwritten");
  host.applyPatch(patch(2,3,[{op:"set_property",node_id:"title",name:"value",value:str("ABC")}],[{node_id:"title",property:"value",sequence:"1"}]));
  assert(input.value==="ABC","acknowledged value not applied");
});

test("composition defers patches until IME finishes", () => {
  const host=setup([entry("root","form",{},["title"]),entry("title","input",{value:str("")})]);
  const input=host.element("title");
  input.dispatchEvent(new CompositionEvent("compositionstart",{bubbles:true}));
  assert(host.applyPatch(patch(1,2,[{op:"set_property",node_id:"title",name:"placeholder",value:str("new")}]))==="deferred","composing input patched");
  assert(!input.placeholder,"composition modified DOM");
  input.dispatchEvent(new CompositionEvent("compositionend",{bubbles:true}));
  assert(input.placeholder==="new" && host.document.revision==="2","queued patch not applied");
});

test("rejects revision gaps, duplicates, malicious URLs and markup without mutation", () => {
  const host=setup([entry("root","div",{},["link"]),entry("link","a",{href:str("/ok"),text:str("safe")})]);
  const existing=host.element("link");
  assert(host.applyPatch(patch(1,2,[]))==="applied","valid patch rejected");
  assert(host.applyPatch(patch(1,2,[]))==="stale","duplicate patch not ignored");
  let failed=false;
  try {host.applyPatch(patch(3,4,[]));} catch(e) {failed=true;}
  assert(failed && host.document.revision==="2","gap advanced state");
  failed=false;
  try {host.applyPatch(patch(2,3,[{op:"set_property",node_id:"link",name:"href",value:str("javascript:alert(1)")}]))} catch(e) {failed=true;}
  assert(failed && host.document.revision==="2" && existing.getAttribute("href")==="/ok","unsafe URL committed");
  host.applyPatch(patch(2,3,[{op:"set_property",node_id:"link",name:"text",value:str("<img src=x onerror=alert(1)>")}]));
  assert(existing.textContent==="<img src=x onerror=alert(1)>" && !existing.querySelector("img"),"markup executed");
});

test("root replacement and removed inputs do not resurrect removed controls", () => {
  const host=setup([entry("root","form",{},["title"]),entry("title","input",{value:str("")})]);
  const original=host.element("title");original.value="local";original.dispatchEvent(new Event("input"));
  host.applyPatch(patch(1,2,[{op:"replace_children",node_id:"root",children:[]},{op:"remove_node",node_id:"title"}]));
  assert(host.element("title")===undefined && !original.isConnected,"old input was retained");
  host.applyPatch(patch(2,3,[{op:"upsert_node",node:entry("title","input",{value:str("server")})},{op:"replace_children",node_id:"root",children:["title"]}]));
  assert(host.element("title").value==="server","stale local input resurrected");
});

test("SSR hydration adopts keyed markup with the same scoped NodeIds as Rust", () => {
  const container=document.getElementById("mount");
  container.innerHTML='<div><ul data-nulang-key="left"><li data-nulang-key="é">Unicode</li><li data-nulang-key="same">One</li></ul><ul data-nulang-key="right"><li data-nulang-key="same">Two</li></ul></div>';
  const original=container.querySelector("li");
  const host=window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"});
  assert(host.element("root/k6c656674/kc3a9")===original,"SSR node was recreated");
  assert(host.element("root/k7269676874/k73616d65").textContent==="Two","key scope not respected");
  assert(host.element("root/k6c656674/k73616d65").textContent==="One","wrong sibling identity");
  assert(host.document.nodes.some(n=>n.id==="root/k6c656674/kc3a9" && n.properties.text.value==="Unicode"),"missing SSR snapshot property");
  assert(container.querySelector("[data-nulang-node-id='root/k6c656674/kc3a9']")===original,"missing adoption marker");
});

test("SSR hydration refuses duplicate or unsafe keyed nodes atomically", () => {
  const container=document.getElementById("mount");
  container.innerHTML='<ul><li data-nulang-key="duplicate">A</li><li data-nulang-key="duplicate">B</li></ul>';
  const before=container.firstElementChild;
  let rejected=false;
  try { window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"}); } catch (_) {rejected=true}
  assert(rejected && container.firstElementChild===before,"duplicate sibling keys accepted or DOM mutated");

  container.innerHTML='<ul><a data-nulang-key="ok" href="javascript:alert(1)">Bad</a></ul>';
  rejected=false;
  try { window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"}); } catch (_) {rejected=true}
  assert(rejected,"unsafe SSR URL accepted");

  container.innerHTML='<ul data-nulang-key="ignored"><li>A</li></ul>';
  rejected=false;
  try { window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"}); } catch (_) {rejected=true}
  assert(rejected,"root key silently ignored");

  container.innerHTML='<ul><li data-nulang-key="x&#10;y">Invalid</li></ul>';
  rejected=false;
  try { window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"}); } catch (_) {rejected=true}
  assert(rejected,"control-character key accepted");
});

test("explicit resync rejects drafts and wrong-document or older snapshots", () => {
  const host=setup([entry("root","div",{},["a"]),entry("a","input",{value:str("")})]);
  const input=host.element("a");
  input.value="draft";input.dispatchEvent(new Event("input"));
  const next=snapshot(3,[entry("root","div",{},["a"]),entry("a","input",{value:str("server")})]);
  let rejected=false;
  try {host.resync(next)} catch (_) {rejected=true}
  assert(rejected && input.value==="draft","unacknowledged edit silently discarded");
  const other={...next,document_id:"other"};
  rejected=false;
  try {host.resync(other,{discardPending:true})} catch (_) {rejected=true}
  assert(rejected && host.document.revision==="1","cross-document snapshot accepted");
  const stale={...next,revision:"0"};
  rejected=false;
  try {host.resync(stale,{discardPending:true})} catch (_) {rejected=true}
  assert(rejected,"old snapshot accepted");
  assert(host.resync(next,{discardPending:true})==="resynced","explicit resync failed");
  assert(host.element("a").value==="server","stale draft survived explicit replacement");
  host.applyPatch(patch(3,4,[{op:"set_property",node_id:"a",name:"value",value:str("new")}]));
  assert(host.element("a").value==="new","state was not reset after resync");
});

test("SSR hydrated keyed reorder applies server patches without replacing nodes", () => {
  const container=document.getElementById("mount");
  container.innerHTML='<ul><li data-nulang-key="a">A</li><li data-nulang-key="b">B</li></ul>';
  const oldB=container.querySelectorAll("li")[1];
  const host=window.nulangUiDom.createHostFromDom(container,{documentId:"test",revision:"1"});
  assert(host.applyMessage({protocol:"nulang-ui-msg/1",type:"patch",
    patch:patch(1,2,[{op:"replace_children",node_id:"root",children:["root/k62","root/k61"]}])})==="applied","patch not applied");
  assert(container.firstElementChild.firstElementChild===oldB,"keyed SSR element replaced");
});

test("fetch SSE stream accepts typed snapshot and patch with same-origin credentials", async () => {
  const host=setup([entry("root","div",{},[ "a","b" ]),entry("a","span",{text:str("A")}),entry("b","span",{text:str("B")})]);
  const original=host.element("b");
  const messages=[
    {protocol:"nulang-ui-msg/1",type:"snapshot",document:snapshot(1,[entry("root","div",{},["a","b"]),entry("a","span",{text:str("A")}),entry("b","span",{text:str("B")})])},
    {protocol:"nulang-ui-msg/1",type:"patch",patch:patch(1,2,[{op:"replace_children",node_id:"root",children:["b","a"]}])}
  ];
  const frames=messages.map((m,i)=>"event: nulang-ui\nid: "+(i+1)+"\ndata: "+JSON.stringify(m)+"\n\n").join("");
  const chunks=[frames.slice(0,17),frames.slice(17,83),frames.slice(83)];
  const encoder=new TextEncoder();const requests=[];
  const client=window.nulangUiStream.createClient(host,{
    url:"/private/live",
    fetch:async (url,opts)=>{
      requests.push({url,opts});
      return {ok:true,status:200,body:new ReadableStream({
        start(controller){chunks.forEach(s=>controller.enqueue(encoder.encode(s)));controller.close()}
      })};
    }
  });
  assert(await client.connectOnce()==="closed","stream did not complete");
  assert(host.document.revision==="2" && host.element("b")===original,"patch lost node identity");
  assert(requests.length===1 && requests[0].url==="/private/live","incorrect endpoint");
  assert(requests[0].opts.credentials==="same-origin" && requests[0].opts.method==="GET","insecure fetch defaults");
});

test("SSE parser rejects missing event IDs, cross-document messages and revision gaps", async () => {
  const host=setup([entry("root","div",{},[])]);
  const encoder=new TextEncoder();
  const frame=(id,message)=>"event: nulang-ui\nid: "+id+"\ndata: "+JSON.stringify(message)+"\n\n";
  const data=frame("1",{protocol:"nulang-ui-msg/1",type:"snapshot",document:snapshot(1,[entry("root","div",{},[])])})
    +frame("4",{protocol:"nulang-ui-msg/1",type:"patch",patch:patch(3,4,[])});
  let called=0,reason;
  const client=window.nulangUiStream.createClient(host,{
    url:"/private/live",
    fetch:async()=>({ok:true,status:200,body:new ReadableStream({start(c){c.enqueue(encoder.encode(data));c.close()}})}),
    onRecoveryNeeded:(error)=>{called++;reason=error;}
  });
  assert(await client.connectOnce()==="recover","revision gap not detected");
  assert(called===1 && host.document.revision==="1","gap improperly advanced revision");
  assert(reason && reason.includes("revision"),"no recovery reason");
});

test("reconnecting streams require snapshots before any patch", async () => {
  const host=setup([entry("root","div",{},["a","b"]),entry("a","span",{text:str("A")}),entry("b","span",{text:str("B")})]);
  const encoder=new TextEncoder();
  const value={protocol:"nulang-ui-msg/1",type:"patch",patch:patch(1,2,[{op:"replace_children",node_id:"root",children:["b","a"]}])};
  const frame="event: nulang-ui\nid: 2\ndata: "+JSON.stringify(value)+"\n\n";
  let reason="";
  const client=window.nulangUiStream.createClient(host,{
    url:"/ui/live",
    fetch:async()=>({ok:true,status:200,body:new ReadableStream({start(c){c.enqueue(encoder.encode(frame));c.close()}})}),
    onRecoveryNeeded:message=>{reason=message;}
  });
  assert(await client.connectOnce()==="recover","patch-only stream must not advance the document");
  assert(host.document.revision==="1" && reason.includes("snapshot"),"missing reconnect recovery");
});

test("recovery preserves unacknowledged local input rather than dropping drafts", async () => {
  const host=setup([entry("root","form",{},["a"]),entry("a","input",{value:str("")})]);
  const input=host.element("a");
  input.value="draft";input.dispatchEvent(new Event("input"));
  const msg={protocol:"nulang-ui-msg/1",type:"snapshot",document:snapshot(2,[entry("root","form",{},["a"]),entry("a","input",{value:str("server")})])};
  const frame="event: nulang-ui\nid: 2\ndata: "+JSON.stringify(msg)+"\n\n";
  let recovered=false;
  const client=window.nulangUiStream.createClient(host,{
    url:"/ui/live",
    fetch:async()=>({ok:true,status:200,body:new ReadableStream({start(c){c.enqueue(new TextEncoder().encode(frame));c.close()}})}),
    onRecoveryNeeded:()=>{recovered=true;}
  });
  assert(await client.connectOnce()==="recover" && recovered,"pending draft not protected");
  assert(input.value==="draft" && host.document.revision==="1","draft lost during snapshot");
});

test("real loopback HTTP SSE requires credentials and preserves keyed identity", async () => {
  const response=await fetch("/__test__/live",{cache:"no-store",credentials:"same-origin"});
  assert(response.status===403,"real HTTP SSE accepted unauthenticated request");
  const host=setup([entry("root","div",{},["a","b"]),entry("a","span",{text:str("A")}),entry("b","span",{text:str("B")})]);
  const previous=host.element("b");
  const client=window.nulangUiStream.createClient(host,{
    url:"/__test__/live",
    getHeaders:()=>({Authorization:"Bearer test-token"})
  });
  assert(await client.connectOnce()==="closed","real network stream did not close");
  assert(host.document.revision==="2" && host.element("b")===previous,"HTTP SSE did not reconcile keyed identity");
  assert(host.element("root").firstElementChild===previous,"SSE patch ordering incorrect");
});

test("SSE auth failures do not reconnect or leak bearer credentials into URLs", async () => {
  const host=setup([entry("root","div",{},[])]);
  let count=0;
  const client=window.nulangUiStream.createClient(host,{
    url:"/private/live",
    getHeaders:()=>({"Authorization":"Bearer session-secret"}),
    fetch:async (_url,opts)=>{count++;assert(opts.headers.Authorization==="Bearer session-secret");return {ok:false,status:403}}
  });
  assert(await client.connectOnce()==="unauthorized","denied request retried");
  assert(count===1,"authorization failure fetched repeatedly");
  let rejected=false;
  try{window.nulangUiStream.createClient(host,{url:"https://example.org/private"})}catch(_){rejected=true}
  assert(rejected,"cross-origin stream accepted");
  rejected=false;
  try{window.nulangUiStream.createClient(host,{url:"/private?token=secret"})}catch(_){rejected=true}
  assert(rejected,"query token accepted");
});

(async () => {
 const out=[];
 for(const {name,fn} of tests) {
   try {await fn();out.push("PASS "+name)} catch(e){out.push("FAIL "+name+": "+e.message)}
 }
 const failed=out.filter(s=>s.startsWith("FAIL")).length;
 document.getElementById("results").textContent=out.join("\n")+"\n"+(failed?"FAILURES "+failed:"ALL PASS");
 document.documentElement.setAttribute("data-test-status",failed?"failed":"passed");
})();
</script>
