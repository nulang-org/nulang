[package]
name = "nulang-ai-voice"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Realtime voice transport and provider adapters for the NuLang agent runtime"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
nulang-ai-core = { path = "../nulang-ai-core", version = "0.1.0" }
