[package]
name = "nulang-policy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic application authorization policy kernel for Nulang"

[dependencies]
nulang-security = { path = "../nulang-security", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[lib]
name = "nulang_policy"
path = "src/lib.rs"
