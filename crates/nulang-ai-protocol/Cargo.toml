[package]
name = "nulang-ai-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NLAP v1 protocol helpers for NuLang Agent Runtime"

[dependencies]
nulang-ai-core = { path = "../nulang-ai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nulang_ai_protocol"
path = "src/lib.rs"
