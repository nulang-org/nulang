[package]
name = "nulang-playground"
version = "0.1.0"
edition = "2021"
authors = ["David Porkka"]
license = "Apache-2.0"
description = "Browser playground for Nulang: lexer + parser + typechecker + CoreVM compiled to WebAssembly"
homepage = "https://nulang.org/playground"
repository = "https://github.com/nulang-org/nulang"

# This crate is EXCLUDED from the root workspace (see `exclude` in the root
# Cargo.toml): it re-uses the compiler's source files via #[path] includes
# and therefore cannot share the main crate's feature set or dependency
# closure. Build it standalone:
#   cargo build --release --target wasm32-unknown-unknown \
#     --manifest-path crates/nulang-playground/Cargo.toml

[features]
# Declared but never enabled: shared compiler sources carry
# #[cfg(feature = "ai-runtime")] gates; declaring the feature here satisfies
# the unexpected_cfgs lint. The AI runtime itself is native-only.
ai-runtime = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Kept deliberately minimal and pure-Rust so the crate builds for
# wasm32-unknown-unknown with no C toolchain and no JS shims:
#   serde/serde_json — AST/bytecode (de)serialization
#   ariadne          — diagnostic rendering (src/diagnostic.rs)
#   blake3           — .nbc artifact hashing (src/bytecode.rs); builds for
#                      wasm32 via its portable Rust backend
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ariadne = "0.4"
blake3 = "1.8"
rustc-hash = "2"
tracing = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
