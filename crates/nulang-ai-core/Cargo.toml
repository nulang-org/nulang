[package]
name = "nulang-ai-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Domain types for NuLang Agent Runtime — Goal, Task, SwarmEvent, NLAP v1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "nulang_ai_core"
path = "src/lib.rs"
