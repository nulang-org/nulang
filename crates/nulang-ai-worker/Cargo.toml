[package]
name = "nulang-ai-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
nulang-ai-core = { path = "../nulang-ai-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
