# Nulang Documentation — Cloudflare Pages
# Deployed at: https://nulang.org
#
# This is the minimal wrangler config for the Astro Starlight docs site.
# Primary deployment is via Cloudflare Pages Git integration.
# Use `npx wrangler pages dev` for local preview of the Cloudflare environment.

name = "nulang-docs"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-19"
# Pages secrets (set via wrangler pages secret put):
#   TURNSTILE_SECRET — Turnstile widget secret for /api/contact
#   CLOUDFLARE_API_TOKEN — API token with Account Email Sending Edit
#   CONTACT_TO (optional) — defaults to davidporkka@gmail.com
#   CLOUDFLARE_ACCOUNT_ID (optional) — defaults to the account id
#     documented as the fallback in docs/functions/api/contact.ts


# Cloudflare Pages build configuration (wrangler.toml-driven project:
# the toml lives in docs/, so the Pages project root IS docs/):
#   Framework preset: Astro
#   Build command:     pnpm install && pnpm run build
#   Output directory:  dist
#   Build watch paths: docs/**
#   Custom domain:     nulang.org
#
# Email Routing (catch-all):
#   *@nulang.org → davidporkka@gmail.com
